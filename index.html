<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<title>箭回旋 · 竞技场</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none}
html,body{overflow:hidden;touch-action:none;width:100vw;height:100vh;background:#030610;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{display:none;width:100%;height:100%;max-width:1400px;position:relative}
.screen.active{display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{background:linear-gradient(160deg,rgba(30,41,59,.94),rgba(15,23,42,.94));backdrop-filter:blur(14px);border:1px solid rgba(148,163,184,.16);border-radius:18px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6);width:min(520px,92vw);max-height:94vh;overflow-y:auto}
h1{font-size:22px;margin-bottom:4px;text-align:center;letter-spacing:3px;background:linear-gradient(180deg,#fbbf24,#ea580c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h2{font-size:10px;margin-bottom:16px;text-align:center;color:#64748b;font-weight:400;letter-spacing:4px}
h3{font-size:12px;color:#94a3b8;margin:12px 0 6px;text-align:center;font-weight:500}
button{font-family:inherit;font-size:14px;padding:11px 18px;border:none;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;cursor:pointer;transition:all .15s;width:100%;margin-bottom:8px;font-weight:600;letter-spacing:.5px;box-shadow:0 4px 12px rgba(37,99,235,.25)}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(59,130,246,.4)}
button:disabled{opacity:.4;cursor:not-allowed}
button.secondary{background:#334155;box-shadow:0 4px 12px rgba(0,0,0,.25)}
input{font-family:inherit;font-size:14px;padding:11px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;width:100%;margin-bottom:8px;text-transform:uppercase}
input:focus{outline:none;border-color:#3b82f6}
input::placeholder{color:#475569;text-transform:none}
.row{display:flex;gap:8px}
.row>input{flex:2;margin-bottom:0}
.row>button{flex:1;margin-bottom:0}
.room-code{font-size:32px;font-weight:800;letter-spacing:9px;text-align:center;padding:18px;background:#0f172a;border:1px dashed #334155;border-radius:12px;margin-bottom:12px;color:#60a5fa;font-family:'Courier New',monospace;text-indent:9px}
.hud{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:rgba(15,23,42,.94);border-radius:10px;margin-bottom:6px;font-size:11px;gap:6px;flex-wrap:wrap;border:1px solid rgba(148,163,184,.1)}
.hud-item{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:5px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.timer{font-family:'Courier New',monospace;font-size:15px;font-weight:800;color:#fbbf24;padding:2px 10px;background:#0f172a;border-radius:7px;letter-spacing:1px}
.timer.warn{color:#ef4444;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.game-view{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
canvas{display:block;flex:1;width:100%;height:100%;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.55);background:#05070f;object-fit:contain}
.hidden{display:none!important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;border:1px solid #334155;padding:10px 20px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:all .3s;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.legend{font-size:10px;color:#64748b;text-align:center;line-height:1.6;margin-top:8px}
.setting-row{margin-bottom:10px}
.setting-row>label{display:block;font-size:11px;color:#94a3b8;margin-bottom:5px;text-align:center;font-weight:500;letter-spacing:1px}
.btn-group{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.btn-group button{flex:1;min-width:40px;margin:0;padding:8px 5px;font-size:11px;background:#1e293b;border:1.5px solid transparent;color:#94a3b8;font-weight:600;box-shadow:none}
.btn-group button.active{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:#60a5fa;box-shadow:0 3px 12px rgba(59,130,246,.4)}
.btn-group button:hover:not(.active){background:#334155;color:#cbd5e1;transform:none;box-shadow:none}
.team-preview{display:flex;justify-content:center;gap:5px;margin-top:8px;flex-wrap:wrap}
.team-chip{display:flex;align-items:center;gap:3px;padding:4px 8px;border-radius:7px;background:#0f172a;font-size:11px;border:1px solid #1e293b}
.team-chip .dot{width:7px;height:7px}
.human-picker{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:5px}
.human-picker .label{font-size:11px;color:#94a3b8;min-width:64px;text-align:right}
.human-picker .btn-group{flex:1}
.human-picker .btn-group button{min-width:36px;padding:5px 3px;font-size:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
.modal.active{display:flex;animation:fadeIn .25s ease}
.modal-content{background:linear-gradient(160deg,#1e293b,#0f172a);border:2px solid rgba(148,163,184,.2);border-radius:18px;padding:22px 20px;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.8);max-height:92vh;overflow-y:auto}
.winner-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px;letter-spacing:2px}
.winner-sub{font-size:12px;text-align:center;color:#94a3b8;margin-bottom:16px}
.stats-list{background:#0a0e1a;border-radius:10px;padding:12px;margin-bottom:14px}
.stat-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1e293b;font-size:12px}
.stat-row:last-child{border-bottom:none}
.stat-row.winner-row{background:rgba(59,130,246,.1);margin:0 -6px;padding:6px;border-radius:6px}
.stat-bar{flex:1;height:5px;background:#1e293b;border-radius:3px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.mvp-box{background:linear-gradient(135deg,rgba(250,204,21,.15),rgba(234,179,8,.08));border:1px solid rgba(250,204,21,.35);border-radius:10px;padding:12px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.mvp-icon{font-size:24px;filter:drop-shadow(0 0 8px rgba(250,204,21,.6))}
.mvp-info{flex:1}
.mvp-name{font-size:14px;font-weight:700;color:#fbbf24;margin-bottom:2px}
.mvp-stats{font-size:11px;color:#94a3b8}
.char-select-panel{width:min(1000px,96vw);max-height:94vh;padding:20px;background:linear-gradient(160deg,rgba(30,41,59,.97),rgba(15,23,42,.97));backdrop-filter:blur(16px);border:2px solid rgba(250,204,21,.25);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.8);overflow-y:auto}
.char-select-title{text-align:center;font-size:22px;font-weight:800;letter-spacing:6px;margin-bottom:4px;background:linear-gradient(180deg,#fbbf24,#ea580c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.char-select-sub{text-align:center;font-size:11px;color:#64748b;letter-spacing:3px;margin-bottom:16px}
.char-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.char-card{position:relative;background:linear-gradient(160deg,rgba(15,23,42,.95),rgba(30,41,59,.9));border:2px solid rgba(148,163,184,.2);border-radius:14px;padding:10px 6px 8px;cursor:pointer;transition:all .18s;text-align:center;overflow:hidden}
.char-card:hover{transform:translateY(-3px);border-color:rgba(96,165,250,.5);box-shadow:0 8px 24px rgba(59,130,246,.3)}
.char-card.selected{background:linear-gradient(160deg,rgba(250,204,21,.25),rgba(234,179,8,.15));border-color:#fbbf24;box-shadow:0 0 24px rgba(250,204,21,.5)}
.char-card svg{width:100%;height:auto;max-width:110px;display:block;margin:0 auto}
.char-name{font-size:11px;font-weight:700;color:#cbd5e1;margin-top:4px;letter-spacing:1px}
.char-title{font-size:9px;color:#64748b;margin-top:1px;letter-spacing:1px}
.char-card.selected .char-name{color:#fbbf24}
.char-actions{display:flex;gap:8px}
.char-actions button{flex:1;margin-bottom:0}
.mobile-ui{position:fixed;inset:0;pointer-events:none;display:none;z-index:100}
.mobile-ui.active{display:block}
/* ★ 虚拟摇杆 */
.joystick-base{position:absolute;left:max(5vw,24px);bottom:max(5vh,24px);width:min(34vw,170px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.16),rgba(30,41,59,.45));border:3px solid rgba(96,165,250,.5);box-shadow:inset 0 0 30px rgba(59,130,246,.2),0 0 20px rgba(59,130,246,.3);pointer-events:auto;touch-action:none}
.joystick-knob{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#93c5fd,#3b82f6 65%,#1e40af);box-shadow:0 0 22px rgba(96,165,250,.75),inset 0 -4px 8px rgba(0,0,0,.4);transform:translate(-50%,-50%);will-change:transform;pointer-events:none}
.joystick-base::after{content:'';position:absolute;inset:15%;border-radius:50%;border:1px dashed rgba(96,165,250,.3);pointer-events:none}
.actions{position:absolute;right:max(3vw,12px);bottom:max(3vh,12px);width:min(36vw,180px);height:min(36vw,180px);pointer-events:auto}
.actions button{position:absolute;width:48%;height:48%;border-radius:50%;border:2px solid rgba(255,255,255,.4);color:#fff;font-size:14px;font-weight:800;padding:0;margin:0;backdrop-filter:blur(4px);transition:all .06s;min-width:auto;box-shadow:none;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-touch-callout:none;outline:none}
.actions button svg{width:52%;height:52%;pointer-events:none}
.actions button.pressed,.actions button:active{transform:scale(.88);filter:brightness(1.5)}
.actions .jump{right:26%;top:0;background:rgba(34,197,94,.55)}
.actions .dash{left:0;top:26%;background:rgba(59,130,246,.6)}
.actions .sword{right:0;top:26%;background:rgba(234,179,8,.6)}
.actions .bow{right:26%;bottom:0;background:rgba(239,68,68,.55)}
.skill-banner{position:fixed;top:20%;left:50%;padding:12px 24px;background:rgba(15,23,42,.96);border:2px solid #60a5fa;border-radius:12px;font-size:16px;font-weight:800;letter-spacing:2px;color:#60a5fa;pointer-events:none;z-index:1000;opacity:0;transform:translate(-50%,-50%) scale(.7)}
@keyframes skillPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}30%,80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.protect-overlay{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(59,130,246,.9),rgba(147,51,234,.9));color:#fff;padding:5px 18px;border-radius:18px;font-size:12px;font-weight:700;letter-spacing:2px;z-index:150;pointer-events:none;box-shadow:0 0 20px rgba(59,130,246,.7);border:1px solid rgba(255,255,255,.3)}
.protect-overlay.hidden{display:none}
.fs-btn{position:absolute;top:8px;right:8px;width:32px;height:32px;padding:0;background:rgba(30,41,59,.85);border:1px solid rgba(148,163,184,.2);border-radius:8px;color:#cbd5e1;font-size:16px;line-height:1;cursor:pointer;margin:0;min-width:auto;z-index:20;display:flex;align-items:center;justify-content:center;box-shadow:none}
.rotate-hint{position:fixed;inset:0;background:#05070f;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;color:#94a3b8;font-size:14px;letter-spacing:2px;text-align:center;padding:20px}
.rotate-hint .icon{font-size:60px;animation:rotateAnim 2s ease-in-out infinite}
@keyframes rotateAnim{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:800px){body.touch-device .rotate-hint{display:flex}}
.kb-hint{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:11px;color:#64748b;flex-wrap:wrap}
.kb-hint .k{display:inline-block;background:#1e293b;border:1px solid #334155;border-radius:4px;padding:2px 6px;font-family:'Courier New',monospace;color:#cbd5e1;margin:0 2px}
</style>
</head>
<body>

<div class="rotate-hint">
  <div class="icon">📱</div>
  <div>请旋转至横屏游玩</div>
</div>

<div id="wrap">

<div class="screen active" id="screen-setup">
  <div class="card">
    <h1>🏹 箭回旋</h1>
    <h2>ARROW ARENA · 竞技场</h2>
    <div class="setting-row">
      <label>阵营数量</label>
      <div class="btn-group" id="grpTeams">
        <button data-val="2" class="active">2 阵营</button>
        <button data-val="3">3 阵营</button>
        <button data-val="4">4 阵营</button>
      </div>
    </div>
    <div class="setting-row">
      <label>每阵营角色数</label>
      <div class="btn-group" id="grpPer">
        <button data-val="1">1</button>
        <button data-val="2" class="active">2</button>
        <button data-val="3">3</button>
        <button data-val="4">4</button>
        <button data-val="5">5</button>
      </div>
    </div>
    <div class="setting-row">
      <label>AI 难度</label>
      <div class="btn-group" id="grpAI">
        <button data-val="easy">简单</button>
        <button data-val="normal" class="active">一般</button>
        <button data-val="hard">困难</button>
        <button data-val="hell">地狱</button>
      </div>
    </div>
    <div class="setting-row">
      <label>真人玩家数</label>
      <div class="btn-group" id="grpHumans">
        <button data-val="1" class="active">1</button>
        <button data-val="2">2</button>
        <button data-val="3">3</button>
        <button data-val="4">4</button>
      </div>
    </div>
    <div class="setting-row" id="humanTeamsRow">
      <label>真人所属阵营</label>
      <div id="humanTeamPickers"></div>
    </div>
    <button class="secondary" onclick="openCharSelect()" style="background:linear-gradient(135deg,#ea580c,#dc2626)">
      ⚔️ 选择你的角色（<span id="myCharName">圣殿骑士</span>）
    </button>
    <div class="team-preview" id="teamPreview"></div>
    <button onclick="openCreateRoom()" style="margin-top:12px">🌐 创建房间</button>
    <div class="row" style="margin-top:8px">
      <input id="joinCode" placeholder="输入 6 位房间码" maxlength="6" autocomplete="off">
      <button class="secondary" onclick="joinRoom(document.getElementById('joinCode').value)">加入</button>
    </div>
    <div class="legend">
      每局 5 分钟 · 开局 15 秒保护 · 队友驻足 15 秒复活<br>
      💧 喷泉灭火 · 🌀 传送门 · 🎚️ 开关墙
    </div>
    <div class="kb-hint" id="kbHint">
      <span><span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span> 移动/微调</span>
      <span><span class="k">J</span> 剑</span>
      <span><span class="k">K</span> 蓄力射箭</span>
      <span><span class="k">Shift</span> 冲刺</span>
    </div>
  </div>
</div>

<div class="screen" id="screen-waiting">
  <div class="card">
    <h3>房间码 · 分享给队友</h3>
    <div class="room-code" id="roomCodeDisplay">------</div>
    <button class="secondary" onclick="copyRoomCode()">📋 复制房间码</button>
    <div style="margin-top:12px;font-size:12px;color:#94a3b8;text-align:center" id="waitStatus">
      等待队友加入（或直接开始 AI 对战）…
    </div>
    <button onclick="startGame()" style="margin-top:14px">▶ 开始游戏</button>
    <button class="secondary" onclick="leaveRoom()">返回设置</button>
  </div>
</div>

<div class="screen" id="screen-game">
  <div class="game-view">
    <div class="hud" id="hud"></div>
    <div style="position:relative;flex:1;min-height:0">
      <canvas id="canvas" width="1120" height="616"></canvas>
      <div class="protect-overlay hidden" id="protectOverlay">🛡 保护期 <span id="protectTime">15</span>s</div>
      <button class="fs-btn" onclick="toggleFullscreen()">⛶</button>
    </div>
  </div>
</div>

<div class="modal" id="resultModal">
  <div class="modal-content">
    <div class="winner-title" id="winnerTitle">阵营获胜！</div>
    <div class="winner-sub" id="winnerSub"></div>
    <div class="stats-list" id="statsList"></div>
    <div class="mvp-box">
      <div class="mvp-icon">⭐</div>
      <div class="mvp-info">
        <div class="mvp-name" id="mvpName">—</div>
        <div class="mvp-stats" id="mvpStats">—</div>
      </div>
    </div>
    <button onclick="rematch()">🔄 再来一局</button>
    <button class="secondary" onclick="backToSetup()">⚙ 返回设置</button>
  </div>
</div>

<div class="modal" id="charModal">
  <div class="char-select-panel">
    <div class="char-select-title">⚔️ 选择你的战士 ⚔️</div>
    <div class="char-select-sub">SELECT YOUR FIGHTER</div>
    <div class="char-grid" id="charGrid"></div>
    <div class="char-actions">
      <button class="secondary" onclick="closeCharSelect()">取消</button>
      <button onclick="confirmCharSelect()">✓ 确定</button>
    </div>
  </div>
</div>

<div class="skill-banner hidden" id="skillBanner"></div>
<div class="toast" id="toast"></div>

<div class="mobile-ui" id="mobileUI">
  <div class="joystick-base" id="joyBase">
    <div class="joystick-knob" id="joyKnob"></div>
  </div>
  <div class="actions">
    <button class="jump" data-key="jump"><svg viewBox="0 0 24 24"><path d="M12,3 L16,10 L14,10 L14,20 L10,20 L10,10 L8,10 Z" fill="#fff"/></svg></button>
    <button class="dash" data-key="dash"><svg viewBox="0 0 24 24"><path d="M3,8 L14,8 L14,4 L21,12 L14,20 L14,16 L3,16 Z" fill="#fff"/></svg></button>
    <button class="sword" data-key="sword"><svg viewBox="0 0 24 24"><path d="M4,20 L6,22 L11,17 L13,19 L20,4 L18,2 L16,4 L14,6 L9,11 L7,9 L5,11 L9,15 L7,17 Z" fill="#fff"/></svg></button>
    <button class="bow" data-key="bow"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="12" r="1.5" fill="#fff"/></svg></button>
  </div>
</div>

</div>

<script>
/* ============ 常量 ============ */
const TILE = 28;
const MAP_W = 56, MAP_H = 30;
const W = TILE * MAP_W, H = TILE * MAP_H;
const VIEW_W = 40, VIEW_H = 22;
const VIEW_PX_W = VIEW_W * TILE, VIEW_PX_H = VIEW_H * TILE;

const MOVE_SPEED = 3.6;
const DASH_SPEED = 12;
const DASH_TIME = 9;
const DASH_CD = 32;
const ARROW_MAX = 5;
const RESCUE_FRAMES = 900;
const BURN_FRAMES = 900;
const FREEZE_FRAMES = 900;
const FALL_GRACE = 70;
const ROUND_FRAMES = 300 * 60;
const PROTECTION_FRAMES = 15 * 60;
const AIM_ADJUST_SPEED = 0.032;
const RESCUE_DISTANCE = 60;
const PLAYER_W = 50, PLAYER_H = 50;
const PLAYER_VISUAL_PAD = 18;
const MINIMAP_W = 220;

const T = { EMPTY:0, FLOOR:1, WALL:2, VOID:3, CRYSTAL:4, FOREST:5, GATE:6 };

const SKILLS = {
  swap:   { name:'颠三倒四', icon:'🔄', color:'#a78bfa', dur:480 },
  multi:  { name:'万箭齐发', icon:'🎯', color:'#f472b6', dur:600 },
  aim:    { name:'随心所欲', icon:'👁️', color:'#38bdf8', dur:600 },
  fire:   { name:'火凤鸣鸾', icon:'🔥', color:'#fb923c', dur:900 },
  ice:    { name:'冰雪如针', icon:'❄️', color:'#a5f3fc', dur:900 },
  double: { name:'左右开弓', icon:'⚡', color:'#facc15', dur:600 },
};
const BOOK_TYPES = ['swap','multi','aim','fire','ice','double'];
const RESCUE_RULES = { arrow:true, crush:true, burn:false, fall:false, freeze:true };

function parseMap(){
  baseTiles = []; crumbles = new Map(); forests = new Map(); switches = [];
  for (let y = 0; y < MAP_H; y++){
    const row = [];
    for (let x = 0; x < MAP_W; x++){
      const ch = MAP_STR[y][x];
      let t = T.FLOOR;
      if (ch === '#') t = T.WALL;
      else if (ch === '~') t = T.VOID;
      else if (ch === 'F'){ t = T.FOREST; forests.set(x+','+y,{alive:true,burn:0}); }
      else if (ch === 'C'){ t = T.CRYSTAL; crumbles.set(x+','+y,{gone:false,timer:0,respawn:0}); }
      else if (ch === 'G') t = T.GATE;
      else if (ch === 'S'){ t = T.FLOOR; switches.push({ x, y, px:x*TILE+TILE/2, py:y*TILE+TILE/2, t:Math.random()*6.28 }); }
      row.push(t);
    }
    baseTiles.push(row);
  }
  gateOpen = false;
}

function tileAt(tx, ty){
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return T.WALL;
  return baseTiles[ty][tx];
}

function isBlocking(tx, ty){
  const t = tileAt(tx, ty);
  if (t === T.WALL) return true;
  if (t === T.GATE) return !gateOpen;
  if (t === T.FOREST){ const f = forests.get(tx+','+ty); return f && f.alive; }
  if (t === T.CRYSTAL){ const c = crumbles.get(tx+','+ty); return c && !c.gone; }
  for (const f of FOUNTAINS) if (f.x === tx && f.y === ty) return true;
  return false;
}

function isVoid(tx, ty){ return tileAt(tx, ty) === T.VOID; }

function isNearFountain(px, py){
  for (const f of FOUNTAINS){
    const dx = px - (f.x*TILE + TILE/2);
    const dy = py - (f.y*TILE + TILE/2);
    if (dx*dx + dy*dy < (TILE*1.8)*(TILE*1.8)) return true;
  }
  return false;
}

function canSpawnAt(x, y){
  if (tileAt(x, y) !== T.FLOOR) return false;
  if (forests.has(x+','+y)) return false;
  if (crumbles.has(x+','+y)) return false;
  for (const f of FOUNTAINS)
    if (Math.abs(f.x - x) <= 2 && Math.abs(f.y - y) <= 2) return false;
  for (const po of PORTALS)
    if (Math.abs(po.a.x - x*TILE - TILE/2) < TILE*1.5 &&
        Math.abs(po.a.y - y*TILE - TILE/2) < TILE*1.5) return false;
  for (let yy = 0; yy < MAP_H; yy++){
    for (let xx = 0; xx < MAP_W; xx++){
      if (baseTiles[yy][xx] === T.GATE && Math.abs(xx - x) <= 2 && Math.abs(yy - y) <= 2) return false;
    }
  }
  return true;
}

function generateSpawnPoints(){
  const points = [];
  for (let y = 6; y <= 24; y++)
    for (let x = 4; x <= 51; x++)
      if (canSpawnAt(x, y)) points.push({x, y});
  return points;
}

function buildSpawnAssignments(){
  const numPlayers = gameConfig.teams * gameConfig.perTeam;
  const pool = generateSpawnPoints();
  for (let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const chosen = [];
  const minDist = 10;
  for (const p of pool){
    let ok = true;
    for (const c of chosen){
      const md = Math.abs(c.x - p.x) + Math.abs(c.y - p.y);
      if (md < minDist){ ok = false; break; }
    }
    if (ok){ chosen.push(p); if (chosen.length >= numPlayers) break; }
  }
  while (chosen.length < numPlayers){
    let best = null, bestScore = -1;
    for (const p of pool){
      if (chosen.some(c => c.x === p.x && c.y === p.y)) continue;
      let minD = Infinity;
      for (const c of chosen){
        const d = Math.abs(c.x - p.x) + Math.abs(c.y - p.y);
        if (d < minD) minD = d;
      }
      if (minD > bestScore){ bestScore = minD; best = p; }
    }
    if (best) chosen.push(best); else break;
  }
  spawnAssignments = new Array(numPlayers);
  for (let i = 0; i < gameConfig.perTeam; i++){
    for (let t = 0; t < gameConfig.teams; t++){
      const idx = t * gameConfig.perTeam + i;
      if (idx >= numPlayers) continue;
      const pos = chosen[idx];
      if (pos) spawnAssignments[idx] = { x: pos.x*TILE + TILE/2, y: pos.y*TILE + TILE/2 };
    }
  }
  for (let i = 0; i < numPlayers; i++){
    if (!spawnAssignments[i]) spawnAssignments[i] = { x: 28*TILE, y: 15*TILE };
  }
}

function collideMove(e){
  e.x += e.vx;
  const y1 = Math.floor(e.y/TILE), y2 = Math.floor((e.y+e.h-1)/TILE);
  if (e.vx > 0){
    const tx = Math.floor((e.x+e.w-1)/TILE);
    for (let ty = y1; ty <= y2; ty++)
      if (isBlocking(tx,ty)){ e.x = tx*TILE - e.w; e.vx = 0; break; }
  } else if (e.vx < 0){
    const tx = Math.floor(e.x/TILE);
    for (let ty = y1; ty <= y2; ty++)
      if (isBlocking(tx,ty)){ e.x = (tx+1)*TILE; e.vx = 0; break; }
  }
  e.y += e.vy;
  const x1 = Math.floor(e.x/TILE), x2 = Math.floor((e.x+e.w-1)/TILE);
  if (e.vy > 0){
    const ty = Math.floor((e.y+e.h-1)/TILE);
    for (let tx = x1; tx <= x2; tx++)
      if (isBlocking(tx,ty)){ e.y = ty*TILE - e.h; e.vy = 0; break; }
  } else if (e.vy < 0){
    const ty = Math.floor(e.y/TILE);
    for (let tx = x1; tx <= x2; tx++)
      if (isBlocking(tx,ty)){ e.y = (ty+1)*TILE; e.vy = 0; break; }
  }
}

function toggleGate(){
  gateOpen = !gateOpen;
  for (const sw of switches){
    for (let i = 0; i < 16; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 4;
      particles.push({
        x: sw.px, y: sw.py,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 30, maxLife: 30,
        color: gateOpen ? '#22c55e' : '#dc2626',
        size: 2 + Math.random()*2
      });
    }
  }
}

function makePlayer(team, teamPos, index, isAI, difficulty, spawn, charId){
  const w = PLAYER_W, h = PLAYER_H;
  return {
    team, teamPos, index, isAI: !!isAI,
    aiDifficulty: difficulty || 'normal',
    charId: charId || 'knight',
    x:spawn.x - w/2, y:spawn.y - h/2, w, h,
    vx:0, vy:0, facing: 0,
    dashTime:0, dashCd:0, swordTime:0, swordCd:0,
    bowCd:0, charging:false, chargeTime:0, aimAngle:0,
    arrows:ARROW_MAX, hp:3, maxHp:3,
    kills:0, deaths:0, ignitedBy:null,
    frozen:0,
    dead:false, deadTimer:0, rescueTimer:0,
    rescuable:true, deathReason:'',
    onFire:0, skill:null, hurtFlash:0,
    fallTimer:0, portalCd:0,
    spawnX:spawn.x - w/2, spawnY:spawn.y - h/2,
    ax: 0, ay: 0,
    prevDash:0, prevSword:0, prevBow:0,
    _aiBowCd:0, _aiCharging:false, _aiTargetCount:0,
    _aiWanderX: spawn.x, _aiWanderY: spawn.y, _aiWanderTimer: 0,
    _aiStuckTimer: 0, _aiLastX: spawn.x, _aiLastY: spawn.y,
    rescueTarget:null, rescueStayTimer:0, rescueCooldown:0,
  };
}

function getHumanSlots(){
  const result = [];
  const counter = {};
  for (let t = 0; t < gameConfig.teams; t++) counter[t] = 0;
  for (let h = 0; h < gameConfig.humans; h++){
    const team = gameConfig.humanTeams[h] || 0;
    if (counter[team] >= gameConfig.perTeam) continue;
    const pos = counter[team]++;
    result.push(team * gameConfig.perTeam + pos);
  }
  return result;
}

function buildPlayers(){
  buildSpawnAssignments();
  players = [];
  humanSlots = getHumanSlots();
  const availableChars = CHARACTERS.map(c => c.id).filter(id => id !== myCharId);
  let idx = 0;
  for (let t = 0; t < gameConfig.teams; t++){
    for (let i = 0; i < gameConfig.perTeam; i++){
      const isAI = !humanSlots.includes(idx);
      let charId;
      if (idx === humanSlots[0]) charId = myCharId;
      else charId = availableChars[Math.floor(Math.random() * availableChars.length)] || 'knight';
      players.push(makePlayer(t, i, idx, isAI, gameConfig.aiDiff, spawnAssignments[idx], charId));
      idx++;
    }
  }
  if (isHost) myIndex = humanSlots[0] || 0;
  else myIndex = humanSlots[mySlotIndex] || 0;
  myTeam = players[myIndex] ? players[myIndex].team : 0;
  if (players[myIndex]) players[myIndex].isAI = false;
}

function resetWorld(){
  parseMap();
  arrows = []; books = []; particles = [];
  worldTime = 0; bookTimer = 240;
  buildPlayers();
  gameState.timeLeft = ROUND_FRAMES;
  gameState.ended = false;
  gameState.protectionLeft = PROTECTION_FRAMES;
  document.getElementById('protectOverlay').classList.remove('hidden');
  document.getElementById('protectTime').textContent = '15';
}

function killPlayer(p, reason, killer){
  if (p.dead) return;
  p.dead = true; p.deadTimer = 0; p.rescueTimer = 0;
  p.onFire = 0; p.frozen = 0; p.skill = null;
  p.vx = 0; p.vy = 0;
  p.charging = false; p.chargeTime = 0;
  p.rescuable = RESCUE_RULES[reason] !== false;
  p.deathReason = REASON_TEXT[reason] || '死亡';
  p.deaths++;
  if (killer !== undefined && killer !== null && killer >= 0){
    const k = players[killer];
    if (k && k.team !== p.team) k.kills++;
  }
  const col = TEAMS[p.team].hex;
  spawnParticles(p.x+p.w/2, p.y+p.h/2, p.rescuable ? col : '#64748b', p.rescuable ? 20 : 34);
}

function spawnParticles(x, y, color, n){
  for (let i = 0; i < n; i++){
    particles.push({
      x, y, vx:(Math.random()-0.5)*7, vy:(Math.random()-0.5)*7,
      life:30+Math.random()*25, maxLife:55, color, size:2+Math.random()*3
    });
  }
}

function fireArrow(p, worldAngle, power, onFire, onIce){
  const speed = 6 + power*9;
  const curve = -(0.008 - power*0.005);
  arrows.push({
    x:p.x+p.w/2, y:p.y+p.h/2,
    angle:worldAngle, speed, curve,
    vx:Math.cos(worldAngle)*speed, vy:Math.sin(worldAngle)*speed,
    owner:p.index, onFire:!!onFire, onIce:!!onIce,
    stuck:false, life:900, trail:[]
  });
}

function updateArrows(){
  const inProtection = gameState.protectionLeft > 0;
  for (let i = arrows.length-1; i >= 0; i--){
    const a = arrows[i];
    if (a.stuck){
      if (worldTime % 40 === 0)
        particles.push({ x:a.x, y:a.y, vx:0, vy:0,
          life:20, maxLife:20, color: a.onIce ? '#a5f3fc' : a.onFire ? '#fb923c' : '#fbbf24', size:2 });
      continue;
    }
    a.life--;
    if (a.life <= 0){ arrows.splice(i,1); continue; }
    a.angle += a.curve;
    a.vx = Math.cos(a.angle)*a.speed;
    a.vy = Math.sin(a.angle)*a.speed;
    a.x += a.vx; a.y += a.vy;
    a.trail.push({ x:a.x, y:a.y });
    if (a.trail.length > 10) a.trail.shift();
    if (a.onFire && worldTime % 2 === 0){
      particles.push({ x:a.x, y:a.y, vx:(Math.random()-0.5)*1.5, vy:(Math.random()-0.5)*1.5,
        life:16, maxLife:16, color:'#fb923c', size:2+Math.random()*2 });
    } else if (a.onIce && worldTime % 3 === 0){
      particles.push({ x:a.x, y:a.y, vx:(Math.random()-0.5)*1, vy:(Math.random()-0.5)*1,
        life:14, maxLife:14, color:'#a5f3fc', size:1.5+Math.random()*2 });
    }
    if (a.x < -50 || a.x > W+50 || a.y < -50 || a.y > H+50){ arrows.splice(i,1); continue; }

    // 箭矢击中开关
    let hitSwitch = false;
    for (const sw of switches){
      if (Math.hypot(a.x - sw.px, a.y - sw.py) < 20){
        toggleGate();
        arrows.splice(i,1);
        hitSwitch = true;
        break;
      }
    }
    if (hitSwitch) continue;

    const tx = Math.floor(a.x/TILE), ty = Math.floor(a.y/TILE);
    if (isBlocking(tx,ty)){
      a.stuck = true;
      a.x -= Math.cos(a.angle)*4;
      a.y -= Math.sin(a.angle)*4;
      spawnParticles(a.x, a.y, a.onFire ? '#fb923c' : a.onIce ? '#a5f3fc' : '#94a3b8', 5);
      if (a.onFire && !inProtection){
        for (let dy = -1; dy <= 1; dy++){
          for (let dx = -1; dx <= 1; dx++){
            const f = forests.get((tx+dx)+','+(ty+dy));
            if (f && f.alive && f.burn <= 0){
              f.burn = 180;
              spawnParticles((tx+dx)*TILE+TILE/2, (ty+dy)*TILE+TILE/2, '#fb923c', 8);
            }
          }
        }
      }
      continue;
    }
    const ownerTeam = players[a.owner] ? players[a.owner].team : -1;
    for (const p of players){
      if (p.index === a.owner || p.dead) continue;
      if (p.team === ownerTeam) continue;
      if (a.x > p.x && a.x < p.x+p.w && a.y > p.y && a.y < p.y+p.h){
        if (inProtection){
          a.angle += Math.PI; a.curve *= -1;
          a.owner = p.index;
          a.vx = Math.cos(a.angle) * a.speed;
          a.vy = Math.sin(a.angle) * a.speed;
          a.trail = [];
          spawnParticles(a.x, a.y, '#fbbf24', 10);
          break;
        }
        if (p.hurtFlash > 0 && !a.onFire && !a.onIce) continue;
        if (a.onFire){
          p.onFire = BURN_FRAMES; p.ignitedBy = a.owner; p.hurtFlash = 20;
          spawnParticles(p.x+p.w/2, p.y+p.h/2, '#fb923c', 12);
        } else if (a.onIce){
          p.frozen = FREEZE_FRAMES; p.hurtFlash = 20;
          p.charging = false; p.chargeTime = 0;
          spawnParticles(p.x+p.w/2, p.y+p.h/2, '#a5f3fc', 14);
        } else {
          p.hp--; p.hurtFlash = 30;
          if (p.hp <= 0) killPlayer(p, p.frozen > 0 ? 'freeze' : 'arrow', a.owner);
        }
        spawnParticles(a.x, a.y, '#f87171', 8);
        arrows.splice(i,1);
        break;
      }
    }
    for (const p of players){
      if (p.dead || p.swordTime <= 0) continue;
      const sx = p.x + p.w/2 + Math.cos(p.facing)*18;
      const sy = p.y + p.h/2 + Math.sin(p.facing)*18;
      if (Math.hypot(a.x - sx, a.y - sy) < 40){
        a.angle = Math.atan2(a.y - sy, a.x - sx);
        a.owner = p.index;
        a.speed *= 1.15;
        a.vx = Math.cos(a.angle)*a.speed;
        a.vy = Math.sin(a.angle)*a.speed;
        spawnParticles(a.x, a.y, '#facc15', 6);
      }
    }
  }
}

function spawnBook(){
  for (let attempt = 0; attempt < 100; attempt++){
    const tx = 4 + Math.floor(Math.random()*(MAP_W-8));
    const ty = 6 + Math.floor(Math.random()*(MAP_H-8));
    const t = tileAt(tx, ty);
    if (t === T.FLOOR && !isNearFountain(tx*TILE+TILE/2, ty*TILE+TILE/2)
        && !forests.has(tx+','+ty) && !crumbles.has(tx+','+ty)){
      const type = BOOK_TYPES[Math.floor(Math.random()*BOOK_TYPES.length)];
      books.push({ x:tx*TILE+TILE/2, y:ty*TILE+TILE/2, type, life:1200, bob:Math.random()*Math.PI*2 });
      return;
    }
  }
}

function updatePlayer(p){
  // 死亡：队友驻足复活
  if (p.dead){
    if (!p.rescuable) return;
    let rescuer = null;
    for (const other of players){
      if (other === p || other.team !== p.team || other.dead) continue;
      const dx = (other.x + other.w/2) - (p.x + p.w/2);
      const dy = (other.y + other.h/2) - (p.y + p.h/2);
      if (Math.hypot(dx, dy) < RESCUE_DISTANCE){ rescuer = other; break; }
    }
    if (rescuer){
      p.rescueTimer++;
      if (worldTime % 8 === 0){
        particles.push({
          x: p.x + p.w/2 + (Math.random()-0.5)*30,
          y: p.y + p.h/2 + (Math.random()-0.5)*30,
          vx: 0, vy: -1,
          life: 20, maxLife: 20, color: '#4ade80', size: 2
        });
      }
      if (p.rescueTimer >= RESCUE_FRAMES){
        p.dead = false; p.rescueTimer = 0;
        p.arrows = ARROW_MAX; p.hp = p.maxHp;
        p.x = p.spawnX; p.y = p.spawnY;
        p.vx = 0; p.vy = 0;
        p.ignitedBy = null; p.frozen = 0; p.onFire = 0;
        p.hurtFlash = 60;
        spawnParticles(p.x+p.w/2, p.y+p.h/2, '#4ade80', 30);
      }
    } else {
      p.rescueTimer = 0;
    }
    return;
  }

  if (p.portalCd > 0) p.portalCd--;
  if (p.frozen > 0){
    p.frozen--;
    p.ax = 0; p.ay = 0;
    p.charging = false; p.chargeTime = 0;
  }
  if (p.onFire > 0){
    p.onFire--;
    if (worldTime % 4 === 0){
      particles.push({
        x: p.x + p.w/2 + (Math.random()-0.5)*16,
        y: p.y + p.h/2 + (Math.random()-0.5)*16,
        vx:(Math.random()-0.5)*1, vy:-Math.random()*1.5 - 0.3,
        life:18, maxLife:18, color: Math.random()<0.5?'#fb923c':'#fbbf24',
        size:2+Math.random()*2
      });
    }
    if (p.onFire <= 0){ killPlayer(p, 'burn', p.ignitedBy); return; }
  }
  if (p.onFire <= 0){
    for (const q of players){
      if (q === p || q.dead || q.onFire <= 0) continue;
      const dx = Math.abs((p.x+p.w/2) - (q.x+q.w/2));
      const dy = Math.abs((p.y+p.h/2) - (q.y+q.h/2));
      if (dx < 42 && dy < 42){
        p.onFire = BURN_FRAMES; p.ignitedBy = q.ignitedBy; p.hurtFlash = 20;
        break;
      }
    }
  }
  if (p.onFire > 0 && isNearFountain(p.x+p.w/2, p.y+p.h/2)){
    p.onFire = 0;
    spawnParticles(p.x+p.w/2, p.y+p.h/2, '#7dd3fc', 16);
  }
  if (p.onFire <= 0 && p.frozen <= 0){
    for (let ty = Math.floor(p.y/TILE); ty <= Math.floor((p.y+p.h-1)/TILE); ty++){
      for (let tx = Math.floor(p.x/TILE); tx <= Math.floor((p.x+p.w-1)/TILE); tx++){
        const f = forests.get(tx+','+ty);
        if (f && f.burn > 0){
          p.onFire = BURN_FRAMES; p.ignitedBy = null; p.hurtFlash = 20;
          break;
        }
      }
      if (p.onFire > 0) break;
    }
  }
  if (p.skill && p.skill.type !== 'burn'){
    p.skill.timer--;
    if (p.skill.timer <= 0) p.skill = null;
  }
  if (p.hurtFlash > 0) p.hurtFlash--;
  if (p.dashCd > 0) p.dashCd--;
  if (p.swordCd > 0) p.swordCd--;
  if (p.swordTime > 0) p.swordTime--;

  let ax = p.ax || 0, ay = p.ay || 0;
  if (p.skill && p.skill.type === 'swap'){ ax = -ax; ay = -ay; }

  if (p.charging){
    const inp = p.inputs || {};
    if (ax < 0 || ay < 0) p.aimAngle -= AIM_ADJUST_SPEED * Math.max(0.3, Math.hypot(ax,ay));
    if (ax > 0 || ay > 0) p.aimAngle += AIM_ADJUST_SPEED * Math.max(0.3, Math.hypot(ax,ay));
    p.facing = p.aimAngle;
    p.vx = 0; p.vy = 0;
    if (!p._wasCharging){
      p.charging = true;
      p.chargeTime = 0;
      p.aimAngle = p.facing;
    }
    p._wasCharging = true;
    p.chargeTime = Math.min(p.chargeTime + 1, 60);
  } else if (p._wasCharging){
    // 松开
    const power = p.chargeTime / 60;
    const worldAngle = p.aimAngle;
    const inProtection = gameState.protectionLeft > 0;
    const skillType = p.skill ? p.skill.type : null;
    const onFire = skillType === 'fire' && !inProtection;
    const onIce = skillType === 'ice' && !inProtection;
    if (p.arrows > 0){
      p.arrows--;
      if (skillType === 'multi'){
        for (let k = -2; k <= 2; k++) fireArrow(p, worldAngle + k*0.14, power, onFire, onIce);
      } else if (skillType === 'double'){
        fireArrow(p, worldAngle - 0.06, power, onFire, onIce);
        fireArrow(p, worldAngle + 0.06, power, onFire, onIce);
      } else {
        fireArrow(p, worldAngle, power, onFire, onIce);
      }
    }
    p.charging = false; p.chargeTime = 0;
    p._wasCharging = false;
  } else {
    if (ax !== 0 || ay !== 0) p.facing = Math.atan2(ay, ax);
  }

  const inp2 = p.inputs || {};
  if (inp2.dash && !p.prevDash && p.dashCd <= 0 && p.dashTime <= 0 && (ax || ay)){
    p.dashTime = DASH_TIME; p.dashCd = DASH_CD;
    spawnParticles(p.x+p.w/2, p.y+p.h/2, '#60a5fa', 8);
  }
  const mag = Math.hypot(ax, ay);
  const nx = mag > 0 ? ax/mag : 0, ny = mag > 0 ? ay/mag : 0;
  if (p.dashTime > 0){
    p.dashTime--;
    p.vx = Math.cos(p.facing) * DASH_SPEED;
    p.vy = Math.sin(p.facing) * DASH_SPEED;
  } else if (p.charging){
    p.vx = 0; p.vy = 0;
  } else {
    // 摇杆可以给出 0-1 的幅度
    const ratio = Math.min(1, mag);
    p.vx = nx * MOVE_SPEED * ratio;
    p.vy = ny * MOVE_SPEED * ratio;
  }

  if (inp2.sword && !p.prevSword && p.swordCd <= 0){
    p.swordTime = 14; p.swordCd = 24;
    const sx = p.x + p.w/2 + Math.cos(p.facing) * 30;
    const sy = p.y + p.h/2 + Math.sin(p.facing) * 30;
    for (const sw of switches){
      if (Math.hypot(sx - sw.px, sy - sw.py) < 40){ toggleGate(); break; }
    }
  }

  collideMove(p);
  if (p.portalCd <= 0){
    for (const po of portals){
      if (Math.hypot(p.x+p.w/2 - po.a.x, p.y+p.h/2 - po.a.y) < 22){
        p.x = po.b.x - p.w/2; p.y = po.b.y - p.h/2;
        p.portalCd = 40;
        spawnParticles(po.a.x, po.a.y, '#c026d3', 16);
        spawnParticles(po.b.x, po.b.y, '#c026d3', 16);
        break;
      }
    }
  }
  const cx = Math.floor((p.x+p.w/2)/TILE);
  const cy = Math.floor((p.y+p.h/2)/TILE);
  if (isVoid(cx, cy)){
    p.fallTimer++;
    if (p.fallTimer > FALL_GRACE){ killPlayer(p, 'fall', null); return; }
  } else { p.fallTimer = 0; }
  if (tileAt(cx, cy) === T.CRYSTAL){
    const c = crumbles.get(cx+','+cy);
    if (c && !c.gone && c.timer === 0) c.timer = 1;
  }
  for (let i = arrows.length-1; i >= 0; i--){
    const a = arrows[i];
    if (!a.stuck) continue;
    if (Math.abs(a.x-(p.x+p.w/2)) < 30 && Math.abs(a.y-(p.y+p.h/2)) < 30){
      if (p.arrows < ARROW_MAX){
        p.arrows++;
        spawnParticles(a.x, a.y, a.onIce ? '#a5f3fc' : a.onFire ? '#fb923c' : '#fbbf24', 5);
        arrows.splice(i,1);
      }
    }
  }
  for (let i = books.length-1; i >= 0; i--){
    const b = books[i];
    if (Math.abs(b.x-(p.x+p.w/2)) < 30 && Math.abs(b.y-(p.y+p.h/2)) < 30){
      applySkill(p, b.type);
      spawnParticles(b.x, b.y, SKILLS[b.type].color, 14);
      books.splice(i,1);
    }
  }
  p.prevDash = inp2.dash;
  p.prevSword = inp2.sword; p.prevBow = inp2.bow;
}

function applySkill(p, type){
  const def = SKILLS[type];
  if (!def) return;
  p.skill = { type, timer:def.dur };
  showSkillBanner(p.index, def.name, def.color);
}
function showSkillBanner(playerIndex, skillName, skillColor){
  const el = document.getElementById('skillBanner');
  let who;
  if (playerIndex === myIndex) who = '你';
  else if (players[playerIndex] && players[playerIndex].isAI) who = 'AI·' + TEAMS[players[playerIndex].team].name;
  else who = '对手';
  el.textContent = `${who}吃到了「${skillName}」`;
  el.style.borderColor = skillColor;
  el.style.color = skillColor;
  el.style.boxShadow = `0 0 40px ${skillColor}80`;
  el.style.animation = 'none';
  void el.offsetHeight;
  el.style.animation = 'skillPop 2s ease forwards';
  el.classList.remove('hidden');
}

function updateTerrain(){
  worldTime++;
  if (gameState.protectionLeft > 0){
    gameState.protectionLeft--;
    if (gameState.protectionLeft > 0){
      document.getElementById('protectTime').textContent = Math.ceil(gameState.protectionLeft / 60);
    } else {
      document.getElementById('protectOverlay').classList.add('hidden');
    }
  }
  for (const [key, c] of crumbles){
    if (c.gone){
      c.respawn--;
      if (c.respawn <= 0){ c.gone = false; c.timer = 0; }
    } else if (c.timer > 0){
      c.timer++;
      if (c.timer > 900){
        c.gone = true; c.timer = 0; c.respawn = 900;
        const [tx, ty] = key.split(',').map(Number);
        spawnParticles(tx*TILE+TILE/2, ty*TILE+TILE/2, '#67e8f9', 14);
      }
    }
  }
  for (const [key, f] of forests){
    if (f.burn > 0){
      f.burn--;
      if (worldTime % 3 === 0){
        const [tx, ty] = key.split(',').map(Number);
        particles.push({
          x: tx*TILE + Math.random()*TILE, y: ty*TILE + Math.random()*TILE,
          vx:(Math.random()-0.5)*1.5, vy:-Math.random()*1.5 - 0.5,
          life:20, maxLife:20, color: Math.random()<0.5?'#fb923c':'#fbbf24',
          size:2+Math.random()*3
        });
      }
      if (f.burn <= 0){
        f.alive = false;
        const [tx, ty] = key.split(',').map(Number);
        spawnParticles(tx*TILE+TILE/2, ty*TILE+TILE/2, '#94a3b8', 16);
      }
    }
  }
  for (const po of portals) po.t += 0.03;
  for (const sw of switches) sw.t += 0.05;
  for (let i = particles.length-1; i >= 0; i--){
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.05;
    pt.life--;
    if (pt.life <= 0) particles.splice(i,1);
  }
  bookTimer--;
  if (bookTimer <= 0 && books.length < 5){
    spawnBook();
    bookTimer = 400 + Math.random()*300;
  }
  for (let i = books.length-1; i >= 0; i--){
    books[i].life--;
    books[i].bob += 0.08;
    if (books[i].life <= 0) books.splice(i,1);
  }
}

/* ============ AI（修复：添加漫游逻辑） ============ */
const AI_CFG = {
  easy:   { skillRange:180, keepDist:200, accuracy:0.25, reactRange:200, safeMargin:30, rescueRange:500, wanderTime:120 },
  normal: { skillRange:260, keepDist:220, accuracy:0.55, reactRange:300, safeMargin:40, rescueRange:600, wanderTime:90 },
  hard:   { skillRange:340, keepDist:230, accuracy:0.82, reactRange:400, safeMargin:50, rescueRange:700, wanderTime:60 },
  hell:   { skillRange:420, keepDist:240, accuracy:0.96, reactRange:520, safeMargin:60, rescueRange:800, wanderTime:45 },
};

function isSafeDirection(px, py, dirX, dirY, dist){
  const tx = Math.floor((px + dirX*dist)/TILE), ty = Math.floor((py + dirY*dist)/TILE);
  return !isVoid(tx, ty);
}
function nearVoid(px, py, margin){
  for (let dy = -margin; dy <= margin; dy += TILE){
    for (let dx = -margin; dx <= margin; dx += TILE){
      const tx = Math.floor((px+dx)/TILE), ty = Math.floor((py+dy)/TILE);
      if (isVoid(tx, ty)) return true;
    }
  }
  return false;
}
function isAIDanger(ai, enemies){
  if (ai.hp <= 1 || ai.onFire > 0 || ai.frozen > 0) return true;
  let close = 0;
  for (const e of enemies) if (Math.hypot(e.x - ai.x, e.y - ai.y) < 200) close++;
  return close >= 2;
}

function updateAI(ai){
  if (ai.dead || gameState.ended) return;
  ai.inputs = ai.inputs || {};
  const inp = ai.inputs;
  inp.left = inp.right = inp.up = inp.down = 0;
  inp.jump = inp.dash = inp.sword = 0;
  inp.ax = 0; inp.ay = 0;

  if (ai.frozen > 0){
    return;
  }
  const cfg = AI_CFG[ai.aiDifficulty] || AI_CFG.normal;
  if (ai._aiBowCd > 0) ai._aiBowCd--;
  if (ai.rescueCooldown > 0) ai.rescueCooldown--;

  // 找敌人
  const enemies = [];
  let enemy = null, enemyDist = Infinity;
  for (const p of players){
    if (p.team === ai.team || p.dead) continue;
    enemies.push(p);
    let d = Math.hypot(p.x - ai.x, p.y - ai.y);
    if (p._aiTargetCount > 0) d *= 1.5;
    if (d < enemyDist){ enemyDist = d; enemy = p; }
  }
  // 找倒地队友
  let downedMate = null, mateDist = Infinity;
  for (const p of players){
    if (p.team !== ai.team || p.index === ai.index) continue;
    if (p.dead && p.rescuable){
      const d = Math.hypot(p.x - ai.x, p.y - ai.y);
      if (d < mateDist){ mateDist = d; downedMate = p; }
    }
  }
  // 找落地箭
  let freeArrow = null, arrowDist = Infinity;
  for (const a of arrows){
    if (!a.stuck) continue;
    const d = Math.hypot(a.x - ai.x, a.y - ai.y);
    if (d < arrowDist){ arrowDist = d; freeArrow = a; }
  }
  // 找技能书
  let book = null, bookDist = Infinity;
  for (const b of books){
    const d = Math.hypot(b.x - ai.x, b.y - ai.y);
    if (d < bookDist){ bookDist = d; book = b; }
  }
  // 找喷泉
  let fountain = null, fDist = Infinity;
  if (ai.onFire > 0){
    for (const f of FOUNTAINS){
      const d = Math.hypot(f.x*TILE+TILE/2 - ai.x, f.y*TILE+TILE/2 - ai.y);
      if (d < fDist){ fDist = d; fountain = f; }
    }
  }
  const danger = isAIDanger(ai, enemies);
  const inProtection = gameState.protectionLeft > 0;
  let mode = 'idle', tx = null, ty = null;

  // ============== 决策优先级 ==============
  if (ai.rescueTarget && ai.rescueTarget.dead && ai.rescueTarget.rescuable){
    if (danger){
      ai.rescueTarget = null; ai.rescueStayTimer = 0;
    } else {
      const rt = ai.rescueTarget;
      const rd = Math.hypot(rt.x - ai.x, rt.y - ai.y);
      if (rd > 45){ tx = rt.x; ty = rt.y; mode = 'rescue'; }
      else { mode = 'guard'; }
    }
  }
  else if (ai.rescueTarget && !ai.rescueTarget.dead){
    ai.rescueStayTimer++;
    if (ai.rescueStayTimer > 90 || danger){
      ai.rescueTarget = null; ai.rescueStayTimer = 0;
    } else { mode = 'guard'; }
  }
  else if (downedMate && mateDist < cfg.rescueRange && !danger && ai.rescueCooldown <= 0){
    ai.rescueTarget = downedMate; ai.rescueStayTimer = 0;
    tx = downedMate.x; ty = downedMate.y; mode = 'rescue';
  }
  else if (ai.onFire > 0 && fountain){
    tx = fountain.x*TILE+TILE/2; ty = fountain.y*TILE+TILE/2; mode = 'fountain';
  }
  else if (ai.hp <= 1 && enemy && enemyDist < 220){
    tx = ai.x + Math.sign(ai.x - enemy.x) * 250;
    ty = ai.y + Math.sign(ai.y - enemy.y) * 250;
    mode = 'flee';
  }
  else if (inProtection){
    if (book && bookDist < 500){
      tx = book.x; ty = book.y; mode = 'skill';
    } else if (freeArrow && arrowDist < 400 && ai.arrows < ARROW_MAX){
      tx = freeArrow.x; ty = freeArrow.y; mode = 'collect';
    } else if (enemy){
      // 保护期内向敌人靠拢，准备结束保护就开打
      const dx = enemy.x - ai.x, dy = enemy.y - ai.y;
      const d = Math.hypot(dx, dy) || 1;
      tx = ai.x + (dx/d) * 100;
      ty = ai.y + (dy/d) * 100;
      mode = 'approach';
    } else {
      mode = 'wander';
    }
  }
  else if (enemy && enemyDist < cfg.reactRange){
    const ideal = cfg.keepDist;
    const dx = enemy.x - ai.x, dy = enemy.y - ai.y;
    const d = Math.hypot(dx, dy);
    if (d < ideal - 50){ tx = ai.x - (dx/d)*100; ty = ai.y - (dy/d)*100; }
    else if (d > ideal + 80){ tx = ai.x + (dx/d)*120; ty = ai.y + (dy/d)*120; }
    else { tx = ai.x; ty = ai.y; }
    mode = 'fight';
  }
  else if (ai.arrows < ARROW_MAX && freeArrow && arrowDist < 350){
    tx = freeArrow.x; ty = freeArrow.y; mode = 'collect';
  }
  else if (book && bookDist < cfg.skillRange){
    tx = book.x; ty = book.y; mode = 'skill';
  }
  else if (enemy){
    // 追击
    tx = enemy.x; ty = enemy.y; mode = 'chase';
  }
  else {
    // ★ 修复：没有敌人时漫游巡逻
    mode = 'wander';
  }

  // ★ 漫游逻辑
  if (mode === 'wander'){
    ai._aiWanderTimer--;
    const d = Math.hypot(tx !== null ? tx - ai.x : 0, ty !== null ? ty - ai.y : 0);
    if (!ai._aiWanderTimer || ai._aiWanderTimer <= 0 || (tx !== null && d < 60)){
      // 选择新的目标点
      for (let tries = 0; tries < 30; tries++){
        const wtx = 4 + Math.floor(Math.random() * (MAP_W - 8));
        const wty = 6 + Math.floor(Math.random() * (MAP_H - 8));
        if (tileAt(wtx, wty) === T.FLOOR && !forests.has(wtx+','+wty) && !crumbles.has(wtx+','+wty)){
          ai._aiWanderX = wtx*TILE+TILE/2;
          ai._aiWanderY = wty*TILE+TILE/2;
          break;
        }
      }
      ai._aiWanderTimer = cfg.wanderTime + Math.floor(Math.random() * 60);
    }
    tx = ai._aiWanderX;
    ty = ai._aiWanderY;
  }

  // 移动计算
  let mx = 0, my = 0;
  if (tx !== null && ty !== null){
    const dx = tx - ai.x, dy = ty - ai.y;
    if (Math.abs(dx) > 20) mx = Math.sign(dx);
    if (Math.abs(dy) > 20) my = Math.sign(dy);
    // 避免掉入深渊
    if (mx && !isSafeDirection(ai.x+ai.w/2, ai.y+ai.h/2, mx, 0, 32)){
      if (isSafeDirection(ai.x+ai.w/2, ai.y+ai.h/2, 0, 1, 32)) my = 1;
      else if (isSafeDirection(ai.x+ai.w/2, ai.y+ai.h/2, 0, -1, 32)) my = -1;
      else mx = 0;
    }
    if (my && !isSafeDirection(ai.x+ai.w/2, ai.y+ai.h/2, 0, my, 32)){
      if (isSafeDirection(ai.x+ai.w/2, ai.y+ai.h/2, 1, 0, 32)) mx = 1;
      else if (isSafeDirection(ai.x+ai.w/2, ai.y+ai.h/2, -1, 0, 32)) mx = -1;
      else my = 0;
    }
    if (nearVoid(ai.x+ai.w/2+mx*32, ai.y+ai.h/2+my*32, cfg.safeMargin)){
      mx = 0; my = 0;
    }
  }

  // 检测卡住
  const moveDist = Math.hypot(ai.x - ai._aiLastX, ai.y - ai._aiLastY);
  if (moveDist < 0.5 && (mx !== 0 || my !== 0)) ai._aiStuckTimer++;
  else ai._aiStuckTimer = 0;
  ai._aiLastX = ai.x; ai._aiLastY = ai.y;
  if (ai._aiStuckTimer > 60){
    // 卡住了，随机换个方向
    ai._aiWanderTimer = 0;
    ai._aiStuckTimer = 0;
  }

  inp.ax = mx;
  inp.ay = my;
  inp.left = mx < 0 ? 1 : 0;
  inp.right = mx > 0 ? 1 : 0;
  inp.up = my < 0 ? 1 : 0;
  inp.down = my > 0 ? 1 : 0;

  // 朝向
  if (enemy && (mode === 'fight' || mode === 'chase' || mode === 'guard' || mode === 'approach')){
    ai.facing = Math.atan2(enemy.y - ai.y, enemy.x - ai.x);
  } else if (tx !== null){
    ai.facing = Math.atan2(ty - ai.y, tx - ai.x);
  }

  // 射箭
  if ((mode === 'fight' || mode === 'chase' || mode === 'guard' || mode === 'approach') && enemy){
    if (ai._aiCharging){
      inp.bow = 1;
      const desiredAngle = Math.atan2(enemy.y - ai.y, enemy.x - ai.x);
      const err = (1 - cfg.accuracy) * 0.4 * (Math.random() - 0.5);
      ai.facing = desiredAngle + err;
      ai.aimAngle = ai.facing;
      if (ai.chargeTime >= 30 || ai.arrows <= 0){
        inp.bow = 0; ai._aiCharging = false;
        ai._aiBowCd = 45 + Math.random() * 55;
      }
    } else if (ai._aiBowCd <= 0 && ai.arrows > 0 && enemyDist < cfg.reactRange){
      ai._aiCharging = true; inp.bow = 1;
    }
  } else if (ai._aiCharging){
    inp.bow = 0; ai._aiCharging = false;
  }

  // 冲刺
  if (ai.dashCd <= 0 && (mode === 'rescue' || mode === 'collect' || mode === 'fountain')
      && tx !== null && Math.hypot(tx - ai.x, ty - ai.y) > 200){
    if (Math.random() < 0.04) inp.dash = 1;
  }
  if (enemy){
    if (!enemy._aiTargetCount) enemy._aiTargetCount = 0;
    enemy._aiTargetCount++;
    if (worldTime % 30 === 0 && enemy._aiTargetCount > 0) enemy._aiTargetCount--;
  }
}

function teamAliveCount(team){
  let n = 0;
  for (const p of players){ if (p.team === team && !p.dead) n++; }
  return n;
}
function checkGameEnd(){
  if (gameState.ended || gameState.protectionLeft > 0) return;
  gameState.timeLeft--;
  const alive = [];
  for (let t = 0; t < gameConfig.teams; t++)
    if (teamAliveCount(t) > 0) alive.push(t);
  if (alive.length <= 1 || gameState.timeLeft <= 0) endGame();
}
function endGame(){
  if (gameState.ended) return;
  gameState.ended = true;
  const stats = [];
  for (let t = 0; t < gameConfig.teams; t++){
    let alive = 0, kills = 0, totalHp = 0;
    for (const p of players){
      if (p.team !== t) continue;
      if (!p.dead){ alive++; totalHp += p.hp; }
      kills += p.kills;
    }
    stats.push({ team: t, alive, kills, totalHp });
  }
  const sorted = [...stats].sort((a,b) => b.alive - a.alive || b.kills - a.kills || b.totalHp - a.totalHp);
  showResult(sorted[0].team, sorted, players.reduce((m, p) => p.kills > m.kills ? p : m, players[0]));
}
function showResult(winnerTeam, sorted, mvp){
  const wt = TEAMS[winnerTeam];
  document.getElementById('winnerTitle').textContent = `🏆 ${wt.name} 获胜！`;
  document.getElementById('winnerTitle').style.color = wt.hex;
  document.getElementById('winnerSub').textContent =
    gameState.timeLeft <= 0 ? '时间耗尽 · 按存活数结算' : '其他阵营已全部倒下';
  const maxAlive = Math.max(1, ...sorted.map(s => s.alive));
  let html = '';
  for (const s of sorted){
    const t = TEAMS[s.team];
    const barW = (s.alive / maxAlive) * 100;
    const isW = s.team === winnerTeam;
    html += `<div class="stat-row ${isW ? 'winner-row' : ''}">
      <span class="dot" style="background:${t.hex}"></span>
      <span style="min-width:44px;font-weight:${isW?'700':'400'}">${t.name}</span>
      <span style="min-width:50px;color:#94a3b8;font-size:11px">${s.alive}/${gameConfig.perTeam} 存活</span>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:${barW}%;background:${t.hex}"></div></div>
      <span style="min-width:40px;text-align:right;color:#fbbf24;font-size:11px">${s.kills} 击杀</span>
    </div>`;
  }
  document.getElementById('statsList').innerHTML = html;
  const mt = TEAMS[mvp.team];
  const mvpName = mvp.index === myIndex ? '你' : (mvp.isAI ? 'AI·' + mt.name : mt.name + '·玩家');
  const charName = CHARACTERS.find(c => c.id === mvp.charId)?.name || '战士';
  document.getElementById('mvpName').textContent = `MVP · ${mvpName}`;
  document.getElementById('mvpName').style.color = mt.hex;
  document.getElementById('mvpStats').textContent = `${charName} · ${mvp.kills} 击杀 · ${mvp.deaths} 阵亡 · ${mt.name}`;
  document.getElementById('resultModal').classList.add('active');
}

/* ============ 渲染 ============ */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function updateCamera(){
  const me = players[myIndex];
  if (!me) return;
  const targetX = me.x + me.w/2 - VIEW_PX_W/2;
  const targetY = me.y + me.h/2 - VIEW_PX_H/2;
  camera.x += (targetX - camera.x) * 0.15;
  camera.y += (targetY - camera.y) * 0.15;
  camera.x = Math.max(0, Math.min(W - VIEW_PX_W, camera.x));
  camera.y = Math.max(0, Math.min(H - VIEW_PX_H, camera.y));
}

function drawPlayer(p){
  const team = TEAMS[p.team];
  if (p.dead){
    const cx = p.x+p.w/2, cy = p.y+p.h/2;
    const canRescue = p.rescuable;
    ctx.fillStyle = canRescue ? 'rgba(71,85,105,.9)' : 'rgba(28,25,23,.92)';
    ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = canRescue ? '#94a3b8' : '#7f1d1d';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    if (canRescue){
      const prog = p.rescueTimer / RESCUE_FRAMES;
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(cx, cy, 26, -Math.PI/2, -Math.PI/2 + Math.PI*2*prog);
      ctx.stroke();
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(Math.ceil((RESCUE_FRAMES-p.rescueTimer)/60), cx, cy);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = p.rescueTimer > 0 ? '#4ade80' : '#94a3b8';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(p.rescueTimer > 0 ? '救援中' : '待救援', cx, cy + 30);
      ctx.textAlign = 'left';
    } else {
      ctx.fillStyle = '#7f1d1d';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('☠', cx, cy);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }
    return;
  }
  const cx = p.x+p.w/2, cy = p.y+p.h/2;
  const flick = p.hurtFlash > 0 && p.hurtFlash % 4 < 2;
  const inProtection = gameState.protectionLeft > 0;

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 16, p.w/2 + 4, p.h/3, 0, 0, Math.PI*2);
  ctx.fill();

  if (inProtection){
    ctx.save();
    const pulse = 0.5 + 0.3 * Math.sin(worldTime * 0.15);
    ctx.strokeStyle = `rgba(96,165,250,${pulse})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, p.w/2 + 14, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 20; ctx.shadowColor = '#60a5fa';
    ctx.strokeStyle = `rgba(147,197,253,${pulse*0.6})`;
    ctx.beginPath(); ctx.arc(cx, cy, p.w/2 + 18, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  if (p.frozen > 0){
    ctx.save();
    ctx.shadowBlur = 26; ctx.shadowColor = '#a5f3fc';
    ctx.strokeStyle = '#a5f3fc'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, p.w/2 + 13, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  if (p.onFire > 0){
    ctx.save();
    ctx.shadowBlur = 32; ctx.shadowColor = '#f97316';
    ctx.fillStyle = 'rgba(249,115,22,.45)';
    ctx.beginPath(); ctx.arc(cx, cy, p.w/2 + 16, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    for (let i = 0; i < 8; i++){
      const ang = worldTime*0.15 + i * Math.PI/4;
      const r = p.w/2 + 14 + Math.sin(worldTime*0.3 + i)*5;
      const px = cx + Math.cos(ang)*r, py = cy + Math.sin(ang)*r;
      const alpha = 0.6 + 0.4*Math.sin(worldTime*0.4 + i);
      ctx.fillStyle = `rgba(251,146,60,${alpha})`;
      ctx.beginPath(); ctx.arc(px, py, 4.5, 0, Math.PI*2); ctx.fill();
    }
  }

  const sprKey = p.charId + '|' + team.hex;
  const spr = SPR.players[sprKey] || SPR.players['knight|' + team.hex];
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(p.facing + Math.PI/2);
  if (flick) ctx.globalAlpha = 0.5;
  ctx.drawImage(spr, -p.w/2 - PLAYER_VISUAL_PAD, -p.h/2 - PLAYER_VISUAL_PAD,
                p.w + PLAYER_VISUAL_PAD*2, p.h + PLAYER_VISUAL_PAD*2);
  ctx.restore();
  ctx.globalAlpha = 1;

  if (p.frozen > 0){
    ctx.fillStyle = '#a5f3fc';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('❄' + Math.ceil(p.frozen/60) + 's', cx, cy - p.h/2 - 16);
    ctx.textAlign = 'left';
  }
  if (p.index === myIndex){
    ctx.save();
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, p.w/2 + 12, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
    const triY = cy - p.h/2 - 26 + Math.sin(worldTime*0.1)*2;
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.moveTo(cx, triY + 10);
    ctx.lineTo(cx - 7, triY);
    ctx.lineTo(cx + 7, triY);
    ctx.closePath();
    ctx.fill();
  }
  if (p.isAI){
    ctx.fillStyle = team.hex;
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('AI', cx, cy - p.h/2 - 26);
    ctx.textAlign = 'left';
  }

  if (p.swordTime > 0){
    const sx = cx + Math.cos(p.facing) * 30;
    const sy = cy + Math.sin(p.facing) * 30;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(p.facing);
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(-5, -4, 32, 8);
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(-5, -4, 32, 2.5);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(-10, -7, 7, 14);
    ctx.restore();
    ctx.strokeStyle = 'rgba(250,204,21,.75)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, 46, p.facing - 0.6, p.facing + 0.6);
    ctx.stroke();
  }

  if (p.charging){
    const t = p.chargeTime / 60;
    const len = 70 + t * 220;
    const skillType = p.skill ? p.skill.type : null;
    const inProt = gameState.protectionLeft > 0;
    const lineColor = (skillType === 'fire' && !inProt) ? '251,146,60' :
                      (skillType === 'ice' && !inProt) ? '165,243,252' : '56,189,248';
    const ex = cx + Math.cos(p.aimAngle) * len;
    const ey = cy + Math.sin(p.aimAngle) * len;
    ctx.strokeStyle = `rgba(${lineColor},${0.6 + t*0.4})`;
    ctx.setLineDash([9,6]);
    ctx.lineWidth = 2 + t*3;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = (skillType === 'fire' && !inProt) ? '#fb923c' :
                      (skillType === 'ice' && !inProt) ? '#a5f3fc' : '#38bdf8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ex-9, ey); ctx.lineTo(ex+9, ey);
    ctx.moveTo(ex, ey-9); ctx.lineTo(ex, ey+9);
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,.75)';
    ctx.fillRect(cx-26, cy - p.h/2 - 32, 52, 8);
    ctx.fillStyle = t < 0.5 ? '#38bdf8' : t < 0.85 ? '#a78bfa' : '#f472b6';
    ctx.fillRect(cx-24, cy - p.h/2 - 30, 48*t, 4);
  }
  if (p.skill){
    const def = SKILLS[p.skill.type];
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(def.icon, cx, cy - p.h/2 - 22);
    ctx.textAlign = 'left';
    const prog = p.skill.timer / def.dur;
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(cx-16, cy - p.h/2 - 12, 32, 4);
    ctx.fillStyle = def.color;
    ctx.fillRect(cx-15, cy - p.h/2 - 11.5, 30*prog, 3);
  }
  ctx.fillStyle = 'rgba(15,23,42,.92)';
  ctx.fillRect(cx - 18, cy + p.h/2 + 8, 36, 16);
  ctx.strokeStyle = team.hex; ctx.lineWidth = 1.2;
  ctx.strokeRect(cx - 18, cy + p.h/2 + 8, 36, 16);
  ctx.fillStyle = team.hex;
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('🏹'+p.arrows, cx, cy + p.h/2 + 20);
  ctx.textAlign = 'left';
}

function drawMiniMap(){
  const scale = MINIMAP_W / W;
  const mh = H * scale;
  const mx = VIEW_PX_W - MINIMAP_W - 10;
  const my = 10;

  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = 'rgba(2,6,23,.85)';
  ctx.fillRect(mx, my, MINIMAP_W, mh);
  ctx.strokeStyle = 'rgba(148,163,184,.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(mx, my, MINIMAP_W, mh);

  // 地图
  const cell = Math.max(2, Math.ceil(MINIMAP_W / MAP_W));
  for (let ty = 0; ty < MAP_H; ty++){
    for (let tx = 0; tx < MAP_W; tx++){
      const t = baseTiles[ty][tx];
      const px = mx + tx * cell;
      const py = my + ty * cell;
      if (t === T.WALL) ctx.fillStyle = '#475569';
      else if (t === T.VOID) ctx.fillStyle = '#000814';
      else if (t === T.FOREST) ctx.fillStyle = forests.get(tx+','+ty)?.alive ? '#166534' : '#0f172a';
      else if (t === T.CRYSTAL) ctx.fillStyle = crumbles.get(tx+','+ty)?.gone ? '#0f172a' : '#0e7490';
      else if (t === T.GATE) ctx.fillStyle = gateOpen ? '#22c55e' : '#92400e';
      else ctx.fillStyle = '#4a6b8a';
      ctx.fillRect(px, py, cell, cell);
    }
  }
  // 玩家点
  for (const p of players){
    if (p.index === myIndex) continue;
    const px = mx + (p.x + p.w/2) * scale;
    const py = my + (p.y + p.h/2) * scale;
    ctx.fillStyle = TEAMS[p.team].hex;
    ctx.beginPath();
    ctx.arc(px, py, p.dead ? 2 : 3.5, 0, Math.PI*2);
    ctx.fill();
    if (p.isAI){
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }
  // 我
  const me = players[myIndex];
  if (me){
    const px = mx + (me.x + me.w/2) * scale;
    const py = my + (me.y + me.h/2) * scale;
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath(); ctx.arc(px, py, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    // 视野框
    ctx.strokeStyle = 'rgba(251,191,36,.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(
      mx + camera.x * scale,
      my + camera.y * scale,
      VIEW_PX_W * scale,
      VIEW_PX_H * scale
    );
  }
  ctx.restore();
}

function render(){
  ctx.fillStyle = '#020617';
  ctx.fillRect(0, 0, VIEW_PX_W, VIEW_PX_H);

  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  // 可见范围
  const sx = Math.max(0, Math.floor(camera.x / TILE) - 2);
  const sy = Math.max(0, Math.floor(camera.y / TILE) - 2);
  const ex = Math.min(MAP_W, Math.ceil((camera.x + VIEW_PX_W) / TILE) + 2);
  const ey = Math.min(MAP_H, Math.ceil((camera.y + VIEW_PX_H) / TILE) + 2);

  for (let y = sy; y < ey; y++){
    for (let x = sx; x < ex; x++){
      const t = baseTiles[y][x];
      if (t === T.WALL) ctx.drawImage(SPR.wall, x*TILE, y*TILE, TILE, TILE);
      else if (t === T.VOID) ctx.drawImage(SPR.void, x*TILE, y*TILE, TILE, TILE);
      else if (t === T.GATE){
        ctx.drawImage(gateOpen ? SPR.gateOpen : SPR.gateClosed, x*TILE, y*TILE, TILE, TILE);
      }
      else if (t === T.FLOOR){
        const isIsle = (y <= 4 || y >= 27) && (x <= 5 || x >= 50);
        ctx.drawImage(isIsle ? SPR.isle : SPR.floor, x*TILE, y*TILE, TILE, TILE);
      }
    }
  }
  // 开关
  for (const sw of switches){
    if (sw.px < camera.x - 40 || sw.px > camera.x + VIEW_PX_W + 40) continue;
    if (sw.py < camera.y - 40 || sw.py > camera.y + VIEW_PX_H + 40) continue;
    const img = gateOpen ? SPR.switchOn : SPR.switchOff;
    ctx.save();
    ctx.globalAlpha = 0.85 + 0.15 * Math.sin(sw.t);
    ctx.shadowBlur = 18;
    ctx.shadowColor = gateOpen ? '#22c55e' : '#dc2626';
    ctx.drawImage(img, sw.px - TILE/2, sw.py - TILE/2, TILE, TILE);
    ctx.restore();
    const ringR = TILE/2 + (sw.t % 1) * 8;
    ctx.save();
    ctx.globalAlpha = 0.5 - (sw.t % 1) * 0.4;
    ctx.strokeStyle = gateOpen ? '#22c55e' : '#dc2626';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sw.px, sw.py, ringR, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  // 喷泉
  for (const f of FOUNTAINS){
    const px = f.x*TILE, py = f.y*TILE;
    if (px < camera.x - 40 || px > camera.x + VIEW_PX_W + 40) continue;
    if (py < camera.y - 40 || py > camera.y + VIEW_PX_H + 40) continue;
    ctx.save();
    ctx.shadowBlur = 14; ctx.shadowColor = '#38bdf8';
    ctx.drawImage(SPR.fountain, px, py, TILE, TILE);
    ctx.restore();
    if (worldTime % 15 === 0){
      particles.push({
        x: f.x*TILE + TILE/2 + (Math.random()-0.5)*8,
        y: f.y*TILE + TILE/2,
        vx:(Math.random()-0.5)*0.3, vy:-0.5 - Math.random()*0.5,
        life:36, maxLife:36, color:'#bae6fd', size:1.5
      });
    }
  }
  // 传送门
  for (const po of portals){
    if (po.a.x < camera.x - 40 || po.a.x > camera.x + VIEW_PX_W + 40) continue;
    if (po.a.y < camera.y - 40 || po.a.y > camera.y + VIEW_PX_H + 40) continue;
    ctx.save();
    ctx.translate(po.a.x, po.a.y);
    ctx.rotate(po.t);
    ctx.globalAlpha = 0.9;
    ctx.shadowBlur = 16; ctx.shadowColor = '#c026d3';
    ctx.drawImage(SPR.portal, -TILE/2, -TILE/2, TILE, TILE);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  // 树林
  for (const [key, f] of forests){
    if (!f.alive) continue;
    const [tx, ty] = key.split(',').map(Number);
    if (tx*TILE < camera.x - 40 || tx*TILE > camera.x + VIEW_PX_W + 40) continue;
    if (ty*TILE < camera.y - 40 || ty*TILE > camera.y + VIEW_PX_H + 40) continue;
    if (f.burn > 0){
      ctx.save();
      ctx.shadowBlur = 16; ctx.shadowColor = '#f97316';
      ctx.drawImage(SPR.forestBurn, tx*TILE, ty*TILE, TILE, TILE);
      ctx.restore();
    } else {
      ctx.drawImage(SPR.forest, tx*TILE, ty*TILE, TILE, TILE);
    }
  }
  // 水晶
  for (const [key, c] of crumbles){
    if (c.gone) continue;
    const [tx, ty] = key.split(',').map(Number);
    if (tx*TILE < camera.x - 40 || tx*TILE > camera.x + VIEW_PX_W + 40) continue;
    if (ty*TILE < camera.y - 40 || ty*TILE > camera.y + VIEW_PX_H + 40) continue;
    let shake = 0;
    if (c.timer > 0) shake = Math.sin(worldTime*0.9) * Math.min(2, c.timer/150);
    ctx.drawImage(c.timer > 0 ? SPR.crystalWarn : SPR.crystal, tx*TILE+shake, ty*TILE, TILE, TILE);
  }
  // 技能书
  for (const b of books){
    if (b.x < camera.x - 30 || b.x > camera.x + VIEW_PX_W + 30) continue;
    if (b.y < camera.y - 30 || b.y > camera.y + VIEW_PX_H + 30) continue;
    const y = b.y + Math.sin(b.bob)*3;
    ctx.save();
    ctx.shadowBlur = 18; ctx.shadowColor = '#a78bfa';
    ctx.drawImage(SPR.book, b.x-14, y-14, 28, 28);
    ctx.restore();
  }
  // 箭
  for (const a of arrows){
    if (a.x < camera.x - 40 || a.x > camera.x + VIEW_PX_W + 40) continue;
    if (a.y < camera.y - 40 || a.y > camera.y + VIEW_PX_H + 40) continue;
    if (!a.stuck && a.trail.length > 1){
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.strokeStyle = a.onFire ? '#fb923c' : a.onIce ? '#a5f3fc' : '#cbd5e1';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(a.trail[0].x, a.trail[0].y);
      for (let i = 1; i < a.trail.length; i++) ctx.lineTo(a.trail[i].x, a.trail[i].y);
      ctx.lineTo(a.x, a.y);
      ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.translate(a.x, a.y); ctx.rotate(a.angle);
    if (a.onFire){ ctx.shadowBlur = 20; ctx.shadowColor = '#f97316'; }
    else if (a.onIce){ ctx.shadowBlur = 20; ctx.shadowColor = '#a5f3fc'; }
    const img = a.onFire ? SPR.arrowFire : a.onIce ? SPR.arrowIce : SPR.arrow;
    ctx.drawImage(img, -20, -8, 40, 16);
    ctx.restore();
  }
  // 玩家
  for (const p of players){
    if (p.x < camera.x - 60 || p.x > camera.x + VIEW_PX_W + 60) continue;
    if (p.y < camera.y - 60 || p.y > camera.y + VIEW_PX_H + 60) continue;
    drawPlayer(p);
  }
  // 粒子
  for (const pt of particles){
    if (pt.x < camera.x - 20 || pt.x > camera.x + VIEW_PX_W + 20) continue;
    if (pt.y < camera.y - 20 || pt.y > camera.y + VIEW_PX_H + 20) continue;
    ctx.globalAlpha = pt.life / pt.maxLife;
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x-pt.size/2, pt.y-pt.size/2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawMiniMap();
}

function updateHUD(){
  const hud = document.getElementById('hud');
  const teamData = [];
  for (let t = 0; t < gameConfig.teams; t++){
    let alive = 0, total = 0, kills = 0;
    for (const p of players){
      if (p.team !== t) continue;
      total++;
      if (!p.dead) alive++;
      kills += p.kills;
    }
    teamData.push({ t, alive, total, kills });
  }
  let html = '';
  for (const td of teamData){
    const team = TEAMS[td.t];
    const isMine = td.t === myTeam;
    html += `<div class="hud-item" style="${isMine?'background:rgba(59,130,246,.18);border:1px solid '+team.hex+'55':''}">
      <span class="dot" style="background:${team.hex}"></span>
      <span style="font-weight:${isMine?'700':'500'}">${team.name}</span>
      <span style="font-size:10px;color:#cbd5e1">${td.alive}/${td.total}</span>
      <span style="font-size:10px;color:#fbbf24">⚔${td.kills}</span>
    </div>`;
  }
  const me = players[myIndex];
  if (me){
    let meStatus;
    if (me.dead){
      if (me.rescuable) meStatus = '💀待救援';
      else meStatus = '☠️淘汰';
    }
    else if (me.onFire > 0) meStatus = '🔥' + Math.ceil(me.onFire/60) + 's';
    else if (me.frozen > 0) meStatus = '❄️' + Math.ceil(me.frozen/60) + 's';
    else if (me.fallTimer > 0) meStatus = '⚠️坠落';
    else meStatus = '❤'.repeat(me.hp) + '♡'.repeat(Math.max(0, me.maxHp-me.hp));
    const ch = CHARACTERS.find(c => c.id === me.charId)?.name || '';
    html += `<div class="hud-item" style="background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.3)">
      <span style="font-weight:700">你·${ch}</span>
      <span>${meStatus}</span>
      <span style="font-size:10px;color:#fbbf24">⚔${me.kills}</span>
    </div>`;
  }
  html += `<div class="hud-item" style="background:${gateOpen ? 'rgba(34,197,94,.15)' : 'rgba(220,38,38,.15)'};border:1px solid ${gateOpen ? '#22c55e' : '#dc2626'}55">
    <span style="font-weight:700">🎚️</span>
    <span style="color:${gateOpen ? '#86efac' : '#fca5a5'}">${gateOpen ? '门开' : '门关'}</span>
  </div>`;
  const tSec = Math.max(0, Math.floor(gameState.timeLeft / 60));
  const mm = String(Math.floor(tSec / 60)).padStart(2, '0');
  const ss = String(tSec % 60).padStart(2, '0');
  html += `<div class="timer ${tSec <= 30 ? 'warn' : ''}">${mm}:${ss}</div>`;
  hud.innerHTML = html;
}

/* ============ 输入（键盘 + 摇杆 + 按钮） ============ */
const keys = {};
const touchInputs = { jump:0, dash:0, sword:0, bow:0 };
const joyVec = { x: 0, y: 0, active: false };

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function readInputs(){
  // 键盘
  let kx = 0, ky = 0;
  if (keys['KeyA'] || keys['ArrowLeft']) kx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) kx += 1;
  if (keys['KeyW'] || keys['ArrowUp']) ky -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) ky += 1;
  // 摇杆
  let ax = kx + (joyVec.active ? joyVec.x : 0);
  let ay = ky + (joyVec.active ? joyVec.y : 0);
  const mag = Math.hypot(ax, ay);
  if (mag > 1){ ax /= mag; ay /= mag; }

  return {
    ax, ay,
    jump:  (keys['Space'] || touchInputs.jump) ? 1 : 0,
    dash:  (keys['ShiftLeft'] || keys['ShiftRight'] || touchInputs.dash) ? 1 : 0,
    sword: (keys['KeyJ'] || touchInputs.sword) ? 1 : 0,
    bow:   (keys['KeyK'] || touchInputs.bow) ? 1 : 0,
  };
}

/* 虚拟摇杆 */
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
let joyPointerId = null;

function updateJoy(clientX, clientY){
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = clientX - cx, dy = clientY - cy;
  const maxR = rect.width * 0.35;
  const dist = Math.hypot(dx, dy);
  if (dist > maxR){ dx = dx / dist * maxR; dy = dy / dist * maxR; }
  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyVec.x = dx / maxR;
  joyVec.y = dy / maxR;
  joyVec.active = true;
}
function resetJoy(){
  joyKnob.style.transform = 'translate(-50%, -50%)';
  joyVec.x = 0; joyVec.y = 0; joyVec.active = false;
  joyPointerId = null;
}
joyBase.addEventListener('pointerdown', e => {
  e.preventDefault();
  joyPointerId = e.pointerId;
  joyBase.setPointerCapture(e.pointerId);
  updateJoy(e.clientX, e.clientY);
});
joyBase.addEventListener('pointermove', e => {
  if (joyPointerId !== e.pointerId) return;
  e.preventDefault();
  updateJoy(e.clientX, e.clientY);
});
joyBase.addEventListener('pointerup', e => {
  if (joyPointerId !== e.pointerId) return;
  e.preventDefault();
  resetJoy();
});
joyBase.addEventListener('pointercancel', e => {
  if (joyPointerId !== e.pointerId) return;
  resetJoy();
});

document.querySelectorAll('[data-key]').forEach(btn => {
  const key = btn.dataset.key;
  const on = e => { e.preventDefault(); e.stopPropagation(); touchInputs[key] = 1; btn.classList.add('pressed'); };
  const off = e => { e.preventDefault(); e.stopPropagation(); touchInputs[key] = 0; btn.classList.remove('pressed'); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointercancel', off);
  btn.addEventListener('pointerleave', off);
  btn.addEventListener('touchstart', on, {passive: false});
  btn.addEventListener('touchend', off);
  btn.addEventListener('touchcancel', off);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});

const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (hasTouch){
  document.getElementById('mobileUI').classList.add('active');
  document.body.classList.add('touch-device');
  const kh = document.getElementById('kbHint');
  if (kh) kh.style.display = 'none';
}

function toggleFullscreen(){
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement){
    const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                el.webkitRequestFullScreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) req.call(el).catch(() => {});
    if (screen.orientation && screen.orientation.lock)
      screen.orientation.lock('landscape').catch(() => {});
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen ||
                 document.mozCancelFullScreen || document.msExitFullscreen;
    if (exit) exit.call(document).catch(() => {});
  }
}

/* ============ 设置界面 ============ */
function bindGroup(id, setter){
  document.getElementById(id).addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll(`#${id} button`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setter(btn.dataset.val);
    validateConfig();
    updateTeamPreview();
    updateHumanPickers();
  });
}
bindGroup('grpTeams', v => gameConfig.teams = parseInt(v));

function validateConfig(){
  const maxHumans = Math.min(4, gameConfig.teams * gameConfig.perTeam);
  if (gameConfig.humans > maxHumans){
    gameConfig.humans = maxHumans;
    document.querySelectorAll('#grpHumans button').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.val) === maxHumans);
    });
  }
  for (let h = 0; h < 4; h++)
    if (gameConfig.humanTeams[h] >= gameConfig.teams) gameConfig.humanTeams[h] = 0;
}
function updateTeamPreview(){
