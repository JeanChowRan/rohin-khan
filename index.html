<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<title>箭回旋 · 竞技场</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{overflow:hidden;touch-action:none;width:100vw;height:100vh;background:#030610;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.screen{display:none;width:100%;height:100%;max-width:1400px;position:relative}
.screen.active{display:flex;align-items:center;justify-content:center}
.card{background:linear-gradient(160deg,rgba(30,41,59,.94),rgba(15,23,42,.94));backdrop-filter:blur(14px);border:1px solid rgba(148,163,184,.16);border-radius:18px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6);width:min(520px,92vw);max-height:94vh;overflow-y:auto}
h1{font-size:22px;margin-bottom:4px;text-align:center;letter-spacing:3px;background:linear-gradient(180deg,#fbbf24,#ea580c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h2{font-size:10px;margin-bottom:16px;text-align:center;color:#64748b;letter-spacing:4px}
button{font-family:inherit;font-size:14px;padding:11px 18px;border:none;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;cursor:pointer;transition:all .15s;width:100%;margin-bottom:8px;font-weight:600;box-shadow:0 4px 12px rgba(37,99,235,.25)}
button.secondary{background:#334155;box-shadow:0 4px 12px rgba(0,0,0,.25)}
input{font-family:inherit;font-size:14px;padding:11px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;width:100%;margin-bottom:8px;text-transform:uppercase}
input::placeholder{color:#475569;text-transform:none}
.row{display:flex;gap:8px}.row>input{flex:2;margin-bottom:0}.row>button{flex:1;margin-bottom:0}
.room-code{font-size:32px;font-weight:800;letter-spacing:9px;text-align:center;padding:18px;background:#0f172a;border:1px dashed #334155;border-radius:12px;margin-bottom:12px;color:#60a5fa;font-family:'Courier New',monospace}
.hud{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:rgba(15,23,42,.94);border-radius:10px;margin-bottom:6px;font-size:11px;gap:6px;flex-wrap:wrap;border:1px solid rgba(148,163,184,.1)}
.hud-item{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:5px}
.dot{width:8px;height:8px;border-radius:50%}
.timer{font-family:'Courier New',monospace;font-size:15px;font-weight:800;color:#fbbf24;padding:2px 10px;background:#0f172a;border-radius:7px}
.game-view{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
canvas{display:block;flex:1;width:100%;height:100%;border-radius:12px;background:#05070f;object-fit:contain}
.hidden{display:none!important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;border:1px solid #334155;padding:10px 20px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:all .3s;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.setting-row{margin-bottom:10px}
.setting-row>label{display:block;font-size:11px;color:#94a3b8;margin-bottom:5px;text-align:center}
.btn-group{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.btn-group button{flex:1;min-width:40px;margin:0;padding:8px 5px;font-size:11px;background:#1e293b;color:#94a3b8;font-weight:600;box-shadow:none;border:1.5px solid transparent}
.btn-group button.active{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:#60a5fa}
.team-preview{display:flex;justify-content:center;gap:5px;margin-top:8px;flex-wrap:wrap}
.team-chip{display:flex;align-items:center;gap:3px;padding:4px 8px;border-radius:7px;background:#0f172a;font-size:11px;border:1px solid #1e293b}
.team-chip .dot{width:7px;height:7px}
.human-picker{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:5px}
.human-picker .label{font-size:11px;color:#94a3b8;min-width:64px;text-align:right}
.human-picker .btn-group{flex:1}
.human-picker .btn-group button{min-width:36px;padding:5px 3px;font-size:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
.modal.active{display:flex}
.modal-content{background:linear-gradient(160deg,#1e293b,#0f172a);border:2px solid rgba(148,163,184,.2);border-radius:18px;padding:22px 20px;max-width:420px;width:100%;max-height:92vh;overflow-y:auto}
.winner-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px}
.winner-sub{font-size:12px;text-align:center;color:#94a3b8;margin-bottom:16px}
.stats-list{background:#0a0e1a;border-radius:10px;padding:12px;margin-bottom:14px}
.stat-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1e293b;font-size:12px}
.stat-row:last-child{border-bottom:none}
.stat-row.winner-row{background:rgba(59,130,246,.1);margin:0 -6px;padding:6px;border-radius:6px}
.stat-bar{flex:1;height:5px;background:#1e293b;border-radius:3px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:3px}
.mvp-box{background:linear-gradient(135deg,rgba(250,204,21,.15),rgba(234,179,8,.08));border:1px solid rgba(250,204,21,.35);border-radius:10px;padding:12px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.mvp-icon{font-size:24px}
.mvp-name{font-size:14px;font-weight:700;color:#fbbf24}
.mvp-stats{font-size:11px;color:#94a3b8}
.char-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.char-card{background:linear-gradient(160deg,rgba(15,23,42,.95),rgba(30,41,59,.9));border:2px solid rgba(148,163,184,.2);border-radius:14px;padding:10px 6px 8px;cursor:pointer;text-align:center}
.char-card.selected{background:linear-gradient(160deg,rgba(250,204,21,.25),rgba(234,179,8,.15));border-color:#fbbf24}
.char-card svg{width:100%;max-width:100px;display:block;margin:0 auto}
.char-name{font-size:11px;font-weight:700;color:#cbd5e1;margin-top:4px}
.char-title{font-size:9px;color:#64748b}
.char-actions{display:flex;gap:8px}
.char-actions button{flex:1;margin-bottom:0}
.mobile-ui{position:fixed;inset:0;pointer-events:none;display:none;z-index:100}
.mobile-ui.active{display:block}
.joystick-base{position:absolute;left:max(5vw,24px);bottom:max(5vh,24px);width:min(34vw,170px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.16),rgba(30,41,59,.45));border:3px solid rgba(96,165,250,.5);pointer-events:auto;touch-action:none}
.joystick-knob{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#93c5fd,#3b82f6 65%,#1e40af);box-shadow:0 0 22px rgba(96,165,250,.75);transform:translate(-50%,-50%);pointer-events:none}
.actions{position:absolute;right:max(3vw,12px);bottom:max(3vh,12px);width:min(36vw,180px);height:min(36vw,180px);pointer-events:auto}
.actions button{position:absolute;width:48%;height:48%;border-radius:50%;border:2px solid rgba(255,255,255,.4);color:#fff;font-size:14px;font-weight:800;padding:0;margin:0;min-width:auto;box-shadow:none;display:flex;align-items:center;justify-content:center}
.actions button svg{width:52%;height:52%;pointer-events:none}
.actions button.pressed,.actions button:active{transform:scale(.88);filter:brightness(1.5)}
.actions .jump{right:26%;top:0;background:rgba(34,197,94,.55)}
.actions .dash{left:0;top:26%;background:rgba(59,130,246,.6)}
.actions .sword{right:0;top:26%;background:rgba(234,179,8,.6)}
.actions .bow{right:26%;bottom:0;background:rgba(239,68,68,.55)}
.skill-banner{position:fixed;top:20%;left:50%;padding:12px 24px;background:rgba(15,23,42,.96);border:2px solid #60a5fa;border-radius:12px;font-size:16px;font-weight:800;color:#60a5fa;pointer-events:none;z-index:1000;opacity:0;transform:translate(-50%,-50%) scale(.7)}
.protect-overlay{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(59,130,246,.9),rgba(147,51,234,.9));color:#fff;padding:5px 18px;border-radius:18px;font-size:12px;font-weight:700;z-index:150;pointer-events:none;border:1px solid rgba(255,255,255,.3)}
.protect-overlay.hidden{display:none}
.fs-btn{position:absolute;top:8px;right:8px;width:32px;height:32px;padding:0;background:rgba(30,41,59,.85);border:1px solid rgba(148,163,184,.2);border-radius:8px;color:#cbd5e1;font-size:16px;cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;box-shadow:none}
.kb-hint{display:flex;justify-content:center;gap:14px;margin-top:10px;font-size:11px;color:#64748b;flex-wrap:wrap}
.kb-hint .k{display:inline-block;background:#1e293b;border:1px solid #334155;border-radius:4px;padding:2px 6px;font-family:'Courier New',monospace;color:#cbd5e1;margin:0 2px}
</style>
</head>
<body>

<div id="wrap">

<div class="screen active" id="screen-setup">
  <div class="card">
    <h1>🏹 箭回旋</h1>
    <h2>ARROW ARENA</h2>
    <div class="setting-row"><label>阵营数量</label>
      <div class="btn-group" id="grpTeams">
        <button data-val="2" class="active">2 阵营</button>
        <button data-val="3">3 阵营</button>
        <button data-val="4">4 阵营</button>
      </div>
    </div>
    <div class="setting-row"><label>每阵营角色数</label>
      <div class="btn-group" id="grpPer">
        <button data-val="1">1</button>
        <button data-val="2" class="active">2</button>
        <button data-val="3">3</button>
        <button data-val="4">4</button>
      </div>
    </div>
    <div class="setting-row"><label>AI 难度</label>
      <div class="btn-group" id="grpAI">
        <button data-val="easy">简单</button>
        <button data-val="normal" class="active">一般</button>
        <button data-val="hard">困难</button>
        <button data-val="hell">地狱</button>
      </div>
    </div>
    <div class="setting-row"><label>真人玩家数</label>
      <div class="btn-group" id="grpHumans">
        <button data-val="1" class="active">1</button>
        <button data-val="2">2</button>
        <button data-val="3">3</button>
        <button data-val="4">4</button>
      </div>
    </div>
    <div class="setting-row"><label>真人所属阵营</label><div id="humanTeamPickers"></div></div>
    <button class="secondary" onclick="openCharSelect()" style="background:linear-gradient(135deg,#ea580c,#dc2626)">
      ⚔️ 选择角色（<span id="myCharName">圣殿骑士</span>）
    </button>
    <div class="team-preview" id="teamPreview"></div>
    <button onclick="openCreateRoom()" style="margin-top:12px">🌐 创建房间</button>
    <div class="row" style="margin-top:8px">
      <input id="joinCode" placeholder="输入房间码" maxlength="6" autocomplete="off">
      <button class="secondary" onclick="joinRoom(document.getElementById('joinCode').value)">加入</button>
    </div>
    <div class="kb-hint" id="kbHint">
      <span><span class="k">WASD</span> 移动/微调</span>
      <span><span class="k">J</span> 剑</span>
      <span><span class="k">K</span> 蓄力</span>
      <span><span class="k">Shift</span> 冲刺</span>
    </div>
  </div>
</div>

<div class="screen" id="screen-waiting">
  <div class="card">
    <h3 style="text-align:center;color:#94a3b8;margin-bottom:12px">房间码</h3>
    <div class="room-code" id="roomCodeDisplay">------</div>
    <button class="secondary" onclick="copyRoomCode()">📋 复制</button>
    <div style="margin-top:12px;font-size:12px;color:#94a3b8;text-align:center" id="waitStatus">等待队友…</div>
    <button onclick="startGame()" style="margin-top:14px">▶ 开始游戏</button>
    <button class="secondary" onclick="leaveRoom()">返回</button>
  </div>
</div>

<div class="screen" id="screen-game">
  <div class="game-view">
    <div class="hud" id="hud"></div>
    <div style="position:relative;flex:1;min-height:0">
      <canvas id="canvas" width="1120" height="616"></canvas>
      <div class="protect-overlay hidden" id="protectOverlay">🛡 <span id="protectTime">15</span>s</div>
      <button class="fs-btn" onclick="toggleFullscreen()">⛶</button>
    </div>
  </div>
</div>

<div class="modal" id="resultModal">
  <div class="modal-content">
    <div class="winner-title" id="winnerTitle">获胜！</div>
    <div class="winner-sub" id="winnerSub"></div>
    <div class="stats-list" id="statsList"></div>
    <div class="mvp-box">
      <div class="mvp-icon">⭐</div>
      <div><div class="mvp-name" id="mvpName">—</div><div class="mvp-stats" id="mvpStats">—</div></div>
    </div>
    <button onclick="rematch()">🔄 再来一局</button>
    <button class="secondary" onclick="backToSetup()">⚙ 返回设置</button>
  </div>
</div>

<div class="modal" id="charModal">
  <div class="modal-content" style="max-width:900px">
    <div style="text-align:center;font-size:20px;font-weight:800;margin-bottom:12px;color:#fbbf24">⚔️ 选择你的战士 ⚔️</div>
    <div class="char-grid" id="charGrid"></div>
    <div class="char-actions">
      <button class="secondary" onclick="closeCharSelect()">取消</button>
      <button onclick="confirmCharSelect()">确定</button>
    </div>
  </div>
</div>

<div class="skill-banner hidden" id="skillBanner"></div>
<div class="toast" id="toast"></div>

<div class="mobile-ui" id="mobileUI">
  <div class="joystick-base" id="joyBase"><div class="joystick-knob" id="joyKnob"></div></div>
  <div class="actions">
    <button class="jump" data-key="jump"><svg viewBox="0 0 24 24"><path d="M12,3 L16,10 L14,10 L14,20 L10,20 L10,10 L8,10 Z" fill="#fff"/></svg></button>
    <button class="dash" data-key="dash"><svg viewBox="0 0 24 24"><path d="M3,8 L14,8 L14,4 L21,12 L14,20 L14,16 L3,16 Z" fill="#fff"/></svg></button>
    <button class="sword" data-key="sword"><svg viewBox="0 0 24 24"><path d="M4,20 L6,22 L11,17 L13,19 L20,4 L18,2 L16,4 L14,6 L9,11 L7,9 L5,11 L9,15 L7,17 Z" fill="#fff"/></svg></button>
    <button class="bow" data-key="bow"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="12" r="1.5" fill="#fff"/></svg></button>
  </div>
</div>

</div>

<script>
/* ============ 常量 ============ */
const TILE = 28;
const MAP_W = 48, MAP_H = 26;
const W = TILE * MAP_W, H = TILE * MAP_H;
const VIEW_PX_W = 1120, VIEW_PX_H = 616;  // canvas 内部尺寸

const MOVE_SPEED = 3.6;
const DASH_SPEED = 12;
const DASH_TIME = 9;
const DASH_CD = 32;
const ARROW_MAX = 5;
const RESCUE_FRAMES = 900;
const BURN_FRAMES = 900;
const FREEZE_FRAMES = 900;
const FALL_GRACE = 70;
const ROUND_FRAMES = 300 * 60;
const PROTECTION_FRAMES = 15 * 60;
const AIM_ADJUST_SPEED = 0.032;
const RESCUE_DISTANCE = 60;
const PLAYER_W = 50, PLAYER_H = 50;
const PLAYER_VISUAL_PAD = 18;

const T = { EMPTY:0, FLOOR:1, WALL:2, VOID:3, CRYSTAL:4, FOREST:5, GATE:6 };

const SKILLS = {
  swap:   { name:'颠三倒四', icon:'🔄', color:'#a78bfa', dur:480 },
  multi:  { name:'万箭齐发', icon:'🎯', color:'#f472b6', dur:600 },
  aim:    { name:'随心所欲', icon:'👁️', color:'#38bdf8', dur:600 },
  fire:   { name:'火凤鸣鸾', icon:'🔥', color:'#fb923c', dur:900 },
  ice:    { name:'冰雪如针', icon:'❄️', color:'#a5f3fc', dur:900 },
  double: { name:'左右开弓', icon:'⚡', color:'#facc15', dur:600 },
};
const BOOK_TYPES = ['swap','multi','aim','fire','ice','double'];
const RESCUE_RULES = { arrow:true, crush:true, burn:false, fall:false, freeze:true };
const REASON_TEXT  = { arrow:'被箭射死', crush:'被压死', burn:'被烧死', fall:'坠落', freeze:'被冻结击杀' };

const TEAMS = [
  { name:'红方', hex:'#ef4444' },
  { name:'黄方', hex:'#eab308' },
  { name:'绿方', hex:'#22c55e' },
  { name:'蓝方', hex:'#3b82f6' },
];

const CHARACTERS = [
  { id:'knight',    name:'圣殿骑士', title:'KNIGHT' },
  { id:'barbarian', name:'北境蛮夷', title:'BARBARIAN' },
  { id:'roman',     name:'罗马军团', title:'ROMAN' },
  { id:'viking',    name:'维京狂战', title:'VIKING' },
  { id:'samurai',   name:'东瀛武士', title:'SAMURAI' },
  { id:'ninja',     name:'暗影忍者', title:'NINJA' },
  { id:'egyptian',  name:'沙漠法老', title:'PHARAOH' },
  { id:'persian',   name:'波斯射手', title:'PERSIAN' },
];

/* ============ 角色 SVG（简化但保留配色） ============ */
function charSVG(charId, teamHex, size) {
  size = size || 72;
  const cfgs = {
    knight:    { bg: '#cbd5e1', dark: '#475569', accent: '#7f1d1d', symbol: '†' },
    barbarian: { bg: '#a16207', dark: '#451a03', accent: '#fbbf24', symbol: '⚔' },
    roman:     { bg: '#b91c1c', dark: '#7f1d1d', accent: '#fbbf24', symbol: 'SPQR' },
    viking:    { bg: '#0e7490', dark: '#164e63', accent: '#fcd9b6', symbol: '⚓' },
    samurai:   { bg: '#991b1b', dark: '#450a0a', accent: '#fbbf24', symbol: '武' },
    ninja:     { bg: '#4c1d95', dark: '#2e1065', accent: '#f87171', symbol: '忍' },
    egyptian:  { bg: '#eab308', dark: '#713f12', accent: '#1e40af', symbol: '☥' },
    persian:   { bg: '#7c3aed', dark: '#4c1d95', accent: '#fbbf24', symbol: '☀' },
  };
  const c = cfgs[charId] || cfgs.knight;
  const idStr = charId + '_' + teamHex.slice(1);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 48 48">
    <defs>
      <radialGradient id="body_${idStr}" cx="0.38" cy="0.32">
        <stop offset="0" stop-color="${c.bg}"/>
        <stop offset="1" stop-color="${c.dark}"/>
      </radialGradient>
    </defs>
    <ellipse cx="24" cy="42" rx="14" ry="3" fill="rgba(0,0,0,.5)"/>
    <circle cx="24" cy="24" r="22" fill="${teamHex}" opacity="0.25"/>
    <circle cx="24" cy="24" r="19" fill="${c.dark}"/>
    <circle cx="24" cy="24" r="17" fill="url(#body_${idStr})"/>
    <circle cx="24" cy="24" r="13" fill="${c.accent}" opacity="0.35"/>
    <circle cx="24" cy="24" r="9" fill="${c.dark}" opacity="0.85"/>
    <!-- 眼睛 -->
    <circle cx="19" cy="22" r="2.5" fill="#0a0a0a"/>
    <circle cx="29" cy="22" r="2.5" fill="#0a0a0a"/>
    <circle cx="19.7" cy="21.3" r="0.9" fill="#fff"/>
    <circle cx="29.7" cy="21.3" r="0.9" fill="#fff"/>
    <!-- 装饰符号 -->
    <text x="24" y="40" font-size="10" font-weight="bold" fill="${c.accent}" text-anchor="middle" font-family="serif">${c.symbol}</text>
    <!-- 阵营环 -->
    <circle cx="24" cy="24" r="22" fill="none" stroke="${teamHex}" stroke-width="2" opacity="0.9"/>
    <circle cx="24" cy="24" r="20" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.35"/>
  </svg>`;
}

function svgURI(s){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)}
function makeImg(s){const i=new Image();i.src=svgURI(s);return i}

/* ============ 地图元素 SVG（精简） ============ */
const SVG_FLOOR = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
<defs><linearGradient id="flg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#6d8ba8"/><stop offset="1" stop-color="#4a6b8a"/></linearGradient></defs>
<rect width="28" height="28" fill="url(#flg)"/>
<path d="M0,14 L28,14" stroke="#3a5872" stroke-width="0.9" opacity="0.75"/>

/* ============ 地图生成（程序化，保证长度一致） ============ */
const MAP_STR = (function generateMap(){
  const map = [];
  for (let y = 0; y < MAP_H; y++){
    const row = new Array(MAP_W).fill('.');
    map.push(row);
  }
  // 边界墙
  for (let x = 0; x < MAP_W; x++){
    map[0][x] = '#';
    map[MAP_H-1][x] = '#';
  }
  for (let y = 0; y < MAP_H; y++){
    map[y][0] = '#';
    map[y][MAP_W-1] = '#';
  }
  // 四角深渊环
  for (let y = 1; y <= 4; y++){
    for (let x = 1; x <= 5; x++){
      map[y][x] = '~';
      map[y][MAP_W-1-x] = '~';
      map[MAP_H-1-y][x] = '~';
      map[MAP_H-1-y][MAP_W-1-x] = '~';
    }
  }
  // 四角小岛
  for (let y = 1; y <= 3; y++){
    for (let x = 2; x <= 4; x++){
      map[y][x] = 'o';
      map[y][MAP_W-1-x] = 'o';
      map[MAP_H-1-y][x] = 'o';
      map[MAP_H-1-y][MAP_W-1-x] = 'o';
    }
  }
  // 树林（对称分布）
  const treePos = [
    [8,7],[14,7],[20,7],[26,7],[32,7],[38,7],
    [8,13],[14,13],[20,13],[26,13],[32,13],[38,13],
    [8,18],[14,18],[20,18],[26,18],[32,18],[38,18],
  ];
  for (const [x,y] of treePos) if (map[y] && map[y][x] !== '#' && map[y][x] !== '~') map[y][x] = 'F';
  // 水晶（成对分布）
  const crystalPos = [
    [10,10],[11,10],[12,10],[35,10],[36,10],[37,10],
    [10,15],[11,15],[12,15],[35,15],[36,15],[37,15],
  ];
  for (const [x,y] of crystalPos) if (map[y] && map[y][x] === '.') map[y][x] = 'C';
  // 开关
  map[12][24] = 'S';
  return map.map(r => r.join(''));
})();

];

const FOUNTAINS = [
  { x: 14, y: 10 }, { x: 33, y: 10 },
  { x: 14, y: 15 }, { x: 33, y: 15 }

function parseMap(){
  baseTiles = []; crumbles = new Map(); forests = new Map(); switches = [];
  for (let y = 0; y < MAP_H; y++){
    const row = [];
    for (let x = 0; x < MAP_W; x++){
      const ch = MAP_STR[y][x];
      let t = T.FLOOR;
      if (ch === '#') t = T.WALL;
      else if (ch === '~') t = T.VOID;
      else if (ch === 'F'){ t = T.FOREST; forests.set(x+','+y,{alive:true,burn:0}); }
      else if (ch === 'C'){ t = T.CRYSTAL; crumbles.set(x+','+y,{gone:false,timer:0,respawn:0}); }
      else if (ch === 'G') t = T.GATE;
      else if (ch === 'S'){ t = T.FLOOR; switches.push({ x, y, px:x*TILE+TILE/2, py:y*TILE+TILE/2, t:Math.random()*6.28 }); }
      row.push(t);
    }
    baseTiles.push(row);
  }
  gateOpen = false;
}

function tileAt(tx, ty){
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return T.WALL;
  return baseTiles[ty][tx];
}

function isBlocking(tx, ty){
  const t = tileAt(tx, ty);
  if (t === T.WALL) return true;
  if (t === T.GATE) return !gateOpen;
  if (t === T.FOREST){ const f = forests.get(tx+','+ty); return f && f.alive; }
  if (t === T.CRYSTAL){ const c = crumbles.get(tx+','+ty); return c && !c.gone; }
  for (const f of FOUNTAINS) if (f.x === tx && f.y === ty) return true;
  return false;
}

function isVoid(tx, ty){ return tileAt(tx, ty) === T.VOID; }

function isNearFountain(px, py){
  for (const f of FOUNTAINS){
    const dx = px - (f.x*TILE + TILE/2);
    const dy = py - (f.y*TILE + TILE/2);
    if (dx*dx + dy*dy < (TILE*1.8)*(TILE*1.8)) return true;
  }
  return false;
}

function canSpawnAt(x, y){
  if (tileAt(x, y) !== T.FLOOR) return false;
  if (forests.has(x+','+y)) return false;
  if (crumbles.has(x+','+y)) return false;
  for (const f of FOUNTAINS)
    if (Math.abs(f.x - x) <= 1 && Math.abs(f.y - y) <= 1) return false;
  for (const po of PORTALS)
    if (Math.abs(po.a.x/28 - x) < 2 && Math.abs(po.a.y/28 - y) < 2) return false;
  return true;
}

function generateSpawnPoints(){
  const points = [];
  for (let y = 5; y <= MAP_H-6; y++)
    for (let x = 3; x <= MAP_W-4; x++)
      if (canSpawnAt(x, y)) points.push({x, y});
  return points;
}

function buildSpawnAssignments(){
  const numPlayers = gameConfig.teams * gameConfig.perTeam;
  const pool = generateSpawnPoints();
  for (let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const chosen = [];
  const minDist = 8;
  for (const p of pool){
    let ok = true;
    for (const c of chosen){
      const md = Math.abs(c.x - p.x) + Math.abs(c.y - p.y);
      if (md < minDist){ ok = false; break; }
    }
    if (ok){ chosen.push(p); if (chosen.length >= numPlayers) break; }
  }
  while (chosen.length < numPlayers){
    for (const p of pool){
      if (chosen.some(c => c.x === p.x && c.y === p.y)) continue;
      chosen.push(p);
      if (chosen.length >= numPlayers) break;
    }
    if (chosen.length < numPlayers && pool.length <= chosen.length) break;
  }
  spawnAssignments = new Array(numPlayers);
  for (let i = 0; i < numPlayers; i++){
    const pos = chosen[i] || { x: Math.floor(MAP_W/2), y: Math.floor(MAP_H/2) };
    spawnAssignments[i] = { x: pos.x*TILE + TILE/2, y: pos.y*TILE + TILE/2 };
  }
}

function collideMove(e){
  e.x += e.vx;
  const y1 = Math.floor(e.y/TILE), y2 = Math.floor((e.y+e.h-1)/TILE);
  if (e.vx > 0){
    const tx = Math.floor((e.x+e.w-1)/TILE);
    for (let ty = y1; ty <= y2; ty++)
      if (isBlocking(tx,ty)){ e.x = tx*TILE - e.w; e.vx = 0; break; }
  } else if (e.vx < 0){
    const tx = Math.floor(e.x/TILE);
    for (let ty = y1; ty <= y2; ty++)
      if (isBlocking(tx,ty)){ e.x = (tx+1)*TILE; e.vx = 0; break; }
  }
  e.y += e.vy;
  const x1 = Math.floor(e.x/TILE), x2 = Math.floor((e.x+e.w-1)/TILE);
  if (e.vy > 0){
    const ty = Math.floor((e.y+e.h-1)/TILE);
    for (let tx = x1; tx <= x2; tx++)
      if (isBlocking(tx,ty)){ e.y = ty*TILE - e.h; e.vy = 0; break; }
  } else if (e.vy < 0){
    const ty = Math.floor(e.y/TILE);
    for (let tx = x1; tx <= x2; tx++)
      if (isBlocking(tx,ty)){ e.y = (ty+1)*TILE; e.vy = 0; break; }
  }
}

function toggleGate(){
  gateOpen = !gateOpen;
  for (const sw of switches){
    for (let i = 0; i < 16; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 4;
      particles.push({
        x: sw.px, y: sw.py,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 30, maxLife: 30,
        color: gateOpen ? '#22c55e' : '#dc2626',
        size: 2 + Math.random()*2
      });
    }
  }
}

function makePlayer(team, teamPos, index, isAI, difficulty, spawn, charId){
  const w = PLAYER_W, h = PLAYER_H;
  return {
    team, teamPos, index, isAI: !!isAI,
    aiDifficulty: difficulty || 'normal',
    charId: charId || 'knight',
    x:spawn.x - w/2, y:spawn.y - h/2, w, h,
    vx:0, vy:0, facing: 0,
    dashTime:0, dashCd:0, swordTime:0, swordCd:0,
    bowCd:0, charging:false, chargeTime:0, aimAngle:0,
    arrows:ARROW_MAX, hp:3, maxHp:3,
    kills:0, deaths:0, ignitedBy:null,
    frozen:0, dead:false, deadTimer:0, rescueTimer:0,
    rescuable:true, deathReason:'',
    onFire:0, skill:null, hurtFlash:0,
    fallTimer:0, portalCd:0,
    spawnX:spawn.x - w/2, spawnY:spawn.y - h/2,
    ax: 0, ay: 0,
    prevDash:0, prevSword:0, prevBow:0,
    _wasCharging: false,
    _aiBowCd:0, _aiCharging:false, _aiTargetCount:0,
    _aiWanderX: spawn.x, _aiWanderY: spawn.y, _aiWanderTimer: 0,
    _aiStuckTimer: 0, _aiLastX: spawn.x, _aiLastY: spawn.y,
    rescueTarget:null, rescueStayTimer:0, rescueCooldown:0,
  };
}

function getHumanSlots(){
  const result = [];
  const counter = {};
  for (let t = 0; t < gameConfig.teams; t++) counter[t] = 0;
  for (let h = 0; h < gameConfig.humans; h++){
    const team = gameConfig.humanTeams[h] || 0;
    if (counter[team] >= gameConfig.perTeam) continue;
    const pos = counter[team]++;
    result.push(team * gameConfig.perTeam + pos);
  }
  return result;
}

function buildPlayers(){
  buildSpawnAssignments();
  players = [];
  humanSlots = getHumanSlots();
  const availableChars = CHARACTERS.map(c => c.id);
  let idx = 0;
  for (let t = 0; t < gameConfig.teams; t++){
    for (let i = 0; i < gameConfig.perTeam; i++){
      const isAI = !humanSlots.includes(idx);
      let charId;
      if (idx === humanSlots[0]) charId = myCharId;
      else {
        const pool = availableChars.filter(id => id !== myCharId);
        charId = pool[Math.floor(Math.random() * pool.length)] || 'knight';
      }
      players.push(makePlayer(t, i, idx, isAI, gameConfig.aiDiff, spawnAssignments[idx], charId));
      idx++;
    }
  }
  if (isHost) myIndex = humanSlots[0] || 0;
  else myIndex = humanSlots[mySlotIndex] || 0;
  myTeam = players[myIndex] ? players[myIndex].team : 0;
  if (players[myIndex]) players[myIndex].isAI = false;
  // ★ 直接对准我的玩家
  if (players[myIndex]){
    camera.x = players[myIndex].x + players[myIndex].w/2 - VIEW_PX_W/2;
    camera.y = players[myIndex].y + players[myIndex].h/2 - VIEW_PX_H/2;
    camera.x = Math.max(0, Math.min(W - VIEW_PX_W, camera.x));
    camera.y = Math.max(0, Math.min(H - VIEW_PX_H, camera.y));
  }
}

function resetWorld(){
  parseMap();
  arrows = []; books = []; particles = [];
  worldTime = 0; bookTimer = 240;
  buildPlayers();
  gameState.timeLeft = ROUND_FRAMES;
  gameState.ended = false;
  gameState.protectionLeft = PROTECTION_FRAMES;
  document.getElementById('protectOverlay').classList.remove('hidden');
  document.getElementById('protectTime').textContent = '15';
}

function killPlayer(p, reason, killer){
  if (p.dead) return;
  p.dead = true; p.deadTimer = 0; p.rescueTimer = 0;
  p.onFire = 0; p.frozen = 0; p.skill = null;
  p.vx = 0; p.vy = 0; p.ax = 0; p.ay = 0;
  p.charging = false; p.chargeTime = 0;
  p.rescuable = RESCUE_RULES[reason] !== false;
  p.deathReason = REASON_TEXT[reason] || '死亡';
  p.deaths++;
  if (killer !== undefined && killer !== null && killer >= 0){
    const k = players[killer];
    if (k && k.team !== p.team) k.kills++;
  }
  spawnParticles(p.x+p.w/2, p.y+p.h/2, TEAMS[p.team].hex, 20);
}

function spawnParticles(x, y, color, n){
  for (let i = 0; i < n; i++){
    particles.push({
      x, y, vx:(Math.random()-0.5)*7, vy:(Math.random()-0.5)*7,
      life:30+Math.random()*25, maxLife:55, color, size:2+Math.random()*3
    });
  }
}

function fireArrow(p, worldAngle, power, onFire, onIce){
  const speed = 6 + power*9;
  const curve = -(0.008 - power*0.005);
  arrows.push({
    x:p.x+p.w/2, y:p.y+p.h/2,
    angle:worldAngle, speed, curve,
    vx:Math.cos(worldAngle)*speed, vy:Math.sin(worldAngle)*speed,
    owner:p.index, onFire:!!onFire, onIce:!!onIce,
    stuck:false, life:900, trail:[]
  });
}

function updateArrows(){
  const inProtection = gameState.protectionLeft > 0;
  for (let i = arrows.length-1; i >= 0; i--){
    const a = arrows[i];
    if (a.stuck) continue;
    a.life--;
    if (a.life <= 0){ arrows.splice(i,1); continue; }
    a.angle += a.curve;
    a.vx = Math.cos(a.angle)*a.speed;
    a.vy = Math.sin(a.angle)*a.speed;
    a.x += a.vx; a.y += a.vy;
    a.trail.push({ x:a.x, y:a.y });
    if (a.trail.length > 10) a.trail.shift();
    if (a.x < -50 || a.x > W+50 || a.y < -50 || a.y > H+50){ arrows.splice(i,1); continue; }

    let hitSwitch = false;
    for (const sw of switches){
      if (Math.hypot(a.x - sw.px, a.y - sw.py) < 20){
        toggleGate();
        arrows.splice(i,1);
        hitSwitch = true;
        break;
      }
    }
    if (hitSwitch) continue;

    const tx = Math.floor(a.x/TILE), ty = Math.floor(a.y/TILE);
    if (isBlocking(tx,ty)){
      a.stuck = true;
      if (a.onFire && !inProtection){
        for (let dy = -1; dy <= 1; dy++)
          for (let dx = -1; dx <= 1; dx++){
            const f = forests.get((tx+dx)+','+(ty+dy));
            if (f && f.alive && f.burn <= 0) f.burn = 180;
          }
      }
      continue;
    }
    const ownerTeam = players[a.owner] ? players[a.owner].team : -1;
    for (const p of players){
      if (p.index === a.owner || p.dead || p.team === ownerTeam) continue;
      if (a.x > p.x && a.x < p.x+p.w && a.y > p.y && a.y < p.y+p.h){
        if (inProtection){
          a.angle += Math.PI; a.curve *= -1;
          a.owner = p.index;
          a.vx = Math.cos(a.angle) * a.speed;
          a.vy = Math.sin(a.angle) * a.speed;
          a.trail = [];
          break;
        }
        if (p.hurtFlash > 0 && !a.onFire && !a.onIce) continue;
        if (a.onFire){ p.onFire = BURN_FRAMES; p.ignitedBy = a.owner; }
        else if (a.onIce){ p.frozen = FREEZE_FRAMES; }
        else {
          p.hp--; p.hurtFlash = 30;
          if (p.hp <= 0) killPlayer(p, p.frozen > 0 ? 'freeze' : 'arrow', a.owner);
        }
        arrows.splice(i,1);
        break;
      }
    }
  }
}

function spawnBook(){
  for (let attempt = 0; attempt < 100; attempt++){
    const tx = 3 + Math.floor(Math.random()*(MAP_W-6));
    const ty = 5 + Math.floor(Math.random()*(MAP_H-8));
    if (tileAt(tx, ty) === T.FLOOR && !isNearFountain(tx*TILE+TILE/2, ty*TILE+TILE/2)
        && !forests.has(tx+','+ty) && !crumbles.has(tx+','+ty)){
      const type = BOOK_TYPES[Math.floor(Math.random()*BOOK_TYPES.length)];
      books.push({ x:tx*TILE+TILE/2, y:ty*TILE+TILE/2, type, life:1200, bob:Math.random()*Math.PI*2 });
      return;
    }
  }
}

function updatePlayer(p){
  if (p.dead){
    if (!p.rescuable) return;
    let rescuer = null;
    for (const other of players){
      if (other === p || other.team !== p.team || other.dead) continue;
      const dx = (other.x + other.w/2) - (p.x + p.w/2);
      const dy = (other.y + other.h/2) - (p.y + p.h/2);
      if (Math.hypot(dx, dy) < RESCUE_DISTANCE){ rescuer = other; break; }
    }
    if (rescuer){
      p.rescueTimer++;
      if (p.rescueTimer >= RESCUE_FRAMES){
        p.dead = false; p.rescueTimer = 0;
        p.arrows = ARROW_MAX; p.hp = p.maxHp;
        p.x = p.spawnX; p.y = p.spawnY;
        p.vx = 0; p.vy = 0; p.ax = 0; p.ay = 0;
        p.ignitedBy = null; p.frozen = 0; p.onFire = 0;
        p.hurtFlash = 60;
      }
    } else p.rescueTimer = 0;
    return;
  }

  if (p.portalCd > 0) p.portalCd--;
  if (p.frozen > 0){
    p.frozen--;
    p.ax = 0; p.ay = 0;
    p._wasCharging = false;
    p.charging = false;
  }
  if (p.onFire > 0){
    p.onFire--;
    if (p.onFire <= 0){ killPlayer(p, 'burn', p.ignitedBy); return; }
  }
  if (p.onFire > 0 && isNearFountain(p.x+p.w/2, p.y+p.h/2)){
    p.onFire = 0;
  }
  if (p.skill && p.skill.type !== 'burn'){
    p.skill.timer--;
    if (p.skill.timer <= 0) p.skill = null;
  }
  if (p.hurtFlash > 0) p.hurtFlash--;
  if (p.dashCd > 0) p.dashCd--;
  if (p.swordCd > 0) p.swordCd--;
  if (p.swordTime > 0) p.swordTime--;

  const inp = p.inputs || {};
  let ax = p.ax || 0, ay = p.ay || 0;
  if (p.skill && p.skill.type === 'swap'){ ax = -ax; ay = -ay; }

  // 蓄力
  const wantBow = inp.bow;
  if (wantBow){
    if (!p._wasCharging){
      p.charging = true;
      p.chargeTime = 0;
      p.aimAngle = p.facing;
    }
    p._wasCharging = true;
    p.chargeTime = Math.min(p.chargeTime + 1, 60);
    const mag2 = Math.hypot(ax, ay);
    if (mag2 > 0.15){
      if (ax < 0 || ay < 0) p.aimAngle -= AIM_ADJUST_SPEED * mag2;
      if (ax > 0 || ay > 0) p.aimAngle += AIM_ADJUST_SPEED * mag2;
    }
    p.facing = p.aimAngle;
    p.vx = 0; p.vy = 0;
  } else if (p._wasCharging){
    const power = p.chargeTime / 60;
    const worldAngle = p.aimAngle;
    const inProtection = gameState.protectionLeft > 0;
    const skillType = p.skill ? p.skill.type : null;
    const onFire = skillType === 'fire' && !inProtection;
    const onIce = skillType === 'ice' && !inProtection;
    if (p.arrows > 0){
      p.arrows--;
      if (skillType === 'multi'){
        for (let k = -2; k <= 2; k++) fireArrow(p, worldAngle + k*0.14, power, onFire, onIce);
      } else if (skillType === 'double'){
        fireArrow(p, worldAngle - 0.06, power, onFire, onIce);
        fireArrow(p, worldAngle + 0.06, power, onFire, onIce);
      } else {
        fireArrow(p, worldAngle, power, onFire, onIce);
      }
    }
    p.charging = false; p.chargeTime = 0;
    p._wasCharging = false;
  } else {
    if (ax !== 0 || ay !== 0) p.facing = Math.atan2(ay, ax);
  }

  // 冲刺
  if (inp.dash && !p.prevDash && p.dashCd <= 0 && p.dashTime <= 0 && (ax || ay)){
    p.dashTime = DASH_TIME; p.dashCd = DASH_CD;
  }

  const mag = Math.hypot(ax, ay);
  if (p.dashTime > 0){
    p.dashTime--;
    p.vx = Math.cos(p.facing) * DASH_SPEED;
    p.vy = Math.sin(p.facing) * DASH_SPEED;
  } else if (p.charging || p.frozen > 0){
    p.vx = 0; p.vy = 0;
  } else {
    const nx = mag > 0 ? ax/mag : 0, ny = mag > 0 ? ay/mag : 0;
    const ratio = Math.min(1, mag);
    p.vx = nx * MOVE_SPEED * ratio;
    p.vy = ny * MOVE_SPEED * ratio;
  }

  // 剑
  if (inp.sword && !p.prevSword && p.swordCd <= 0){
    p.swordTime = 14; p.swordCd = 24;
    const sx = p.x + p.w/2 + Math.cos(p.facing) * 30;
    const sy = p.y + p.h/2 + Math.sin(p.facing) * 30;
    for (const sw of switches){
      if (Math.hypot(sx - sw.px, sy - sw.py) < 40){ toggleGate(); break; }
    }
  }

  collideMove(p);

  if (p.portalCd <= 0){
    for (const po of portals){
      if (Math.hypot(p.x+p.w/2 - po.a.x, p.y+p.h/2 - po.a.y) < 22){
        p.x = po.b.x - p.w/2; p.y = po.b.y - p.h/2;
        p.portalCd = 40;
        break;
      }
    }
  }

  const cx = Math.floor((p.x+p.w/2)/TILE);
  const cy = Math.floor((p.y+p.h/2)/TILE);
  if (isVoid(cx, cy)){
    p.fallTimer++;
    if (p.fallTimer > FALL_GRACE){ killPlayer(p, 'fall', null); return; }
  } else p.fallTimer = 0;

  if (tileAt(cx, cy) === T.CRYSTAL){
    const c = crumbles.get(cx+','+cy);
    if (c && !c.gone && c.timer === 0) c.timer = 1;
  }

  // 捡箭
  for (let i = arrows.length-1; i >= 0; i--){
    const a = arrows[i];
    if (!a.stuck) continue;
    if (Math.abs(a.x-(p.x+p.w/2)) < 30 && Math.abs(a.y-(p.y+p.h/2)) < 30){
      if (p.arrows < ARROW_MAX){
        p.arrows++;
        arrows.splice(i,1);
      }
    }
  }
  // 捡书
  for (let i = books.length-1; i >= 0; i--){
    const b = books[i];
    if (Math.abs(b.x-(p.x+p.w/2)) < 30 && Math.abs(b.y-(p.y+p.h/2)) < 30){
      applySkill(p, b.type);
      books.splice(i,1);
    }
  }
  p.prevDash = inp.dash;
  p.prevSword = inp.sword; p.prevBow = inp.bow;
}

function applySkill(p, type){
  const def = SKILLS[type];
  if (!def) return;
  p.skill = { type, timer:def.dur };
  showSkillBanner(p.index, def.name, def.color);
}
function showSkillBanner(playerIndex, skillName, skillColor){
  const el = document.getElementById('skillBanner');
  let who = playerIndex === myIndex ? '你' : (players[playerIndex]?.isAI ? 'AI' : '对手');
  el.textContent = `${who}吃到了「${skillName}」`;
  el.style.borderColor = skillColor;
  el.style.color = skillColor;
  el.style.animation = 'none';
  void el.offsetHeight;
  el.style.animation = 'skillPop 2s ease forwards';
  el.classList.remove('hidden');
}

function updateTerrain(){
  worldTime++;
  if (gameState.protectionLeft > 0){
    gameState.protectionLeft--;
    if (gameState.protectionLeft > 0){
      document.getElementById('protectTime').textContent = Math.ceil(gameState.protectionLeft / 60);
    } else {
      document.getElementById('protectOverlay').classList.add('hidden');
    }
  }
  for (const [key, c] of crumbles){
    if (c.gone){
      c.respawn--;
      if (c.respawn <= 0){ c.gone = false; c.timer = 0; }
    } else if (c.timer > 0){
      c.timer++;
      if (c.timer > 900){ c.gone = true; c.timer = 0; c.respawn = 900; }
    }
  }
  for (const [, f] of forests){
    if (f.burn > 0){
      f.burn--;
      if (f.burn <= 0) f.alive = false;
    }
  }
  for (const po of portals) po.t += 0.03;
  for (const sw of switches) sw.t += 0.05;
  for (let i = particles.length-1; i >= 0; i--){
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.05;
    pt.life--;
    if (pt.life <= 0) particles.splice(i,1);
  }
  bookTimer--;
  if (bookTimer <= 0 && books.length < 5){
    spawnBook();
    bookTimer = 400 + Math.random()*300;
  }
  for (let i = books.length-1; i >= 0; i--){
    books[i].life--;
    books[i].bob += 0.08;
    if (books[i].life <= 0) books.splice(i,1);
  }
}

/* ============ AI ============ */
const AI_CFG = {
  easy:   { reactRange:200, accuracy:0.25, safeMargin:30, rescueRange:500, wanderTime:120 },
  normal: { reactRange:300, accuracy:0.55, safeMargin:40, rescueRange:600, wanderTime:90 },
  hard:   { reactRange:400, accuracy:0.82, safeMargin:50, rescueRange:700, wanderTime:60 },
  hell:   { reactRange:500, accuracy:0.96, safeMargin:60, rescueRange:800, wanderTime:45 },
};

function isSafeDirection(px, py, dirX, dirY, dist){
  const tx = Math.floor((px + dirX*dist)/TILE), ty = Math.floor((py + dirY*dist)/TILE);
  return !isVoid(tx, ty);
}
function nearVoid(px, py, margin){
  for (let dy = -margin; dy <= margin; dy += TILE){
    for (let dx = -margin; dx <= margin; dx += TILE){
      const tx = Math.floor((px+dx)/TILE), ty = Math.floor((py+dy)/TILE);
      if (isVoid(tx, ty)) return true;
    }
  }
  return false;
}

function updateAI(ai){
  if (ai.dead || gameState.ended) return;
  const inp = ai.inputs = ai.inputs || {};
  inp.left = inp.right = inp.up = inp.down = 0;
  inp.dash = inp.sword = 0;
  ai.ax = 0; ai.ay = 0;

  if (ai.frozen > 0){ inp.bow = 0; return; }

  const cfg = AI_CFG[ai.aiDifficulty] || AI_CFG.normal;
  if (ai._aiBowCd > 0) ai._aiBowCd--;
  if (ai.rescueCooldown > 0) ai.rescueCooldown--;

  // 找敌人
  let enemy = null, enemyDist = Infinity;
  for (const p of players){
    if (p.team === ai.team || p.dead) continue;
    const d = Math.hypot(p.x - ai.x, p.y - ai.y);
    if (d < enemyDist){ enemyDist = d; enemy = p; }
  }
  // 倒地队友
  let downedMate = null, mateDist = Infinity;
  for (const p of players){
    if (p.team !== ai.team || p.index === ai.index) continue;
    if (p.dead && p.rescuable){
      const d = Math.hypot(p.x - ai.x, p.y - ai.y);
      if (d < mateDist){ mateDist = d; downedMate = p; }
    }
  }
  // 落地箭
  let freeArrow = null, arrowDist = Infinity;
  for (const a of arrows){
    if (!a.stuck) continue;
    const d = Math.hypot(a.x - ai.x, a.y - ai.y);
    if (d < arrowDist){ arrowDist = d; freeArrow = a; }
  }
  // 技能书
  let book = null, bookDist = Infinity;
  for (const b of books){
    const d = Math.hypot(b.x - ai.x, b.y - ai.y);
    if (d < bookDist){ bookDist = d; book = b; }
  }
  // 喷泉
  let fountain = null, fDist = Infinity;
  if (ai.onFire > 0){
    for (const f of FOUNTAINS){
      const d = Math.hypot(f.x*TILE+TILE/2 - ai.x, f.y*TILE+TILE/2 - ai.y);
      if (d < fDist){ fDist = d; fountain = f; }
    }
  }

  const inProtection = gameState.protectionLeft > 0;
  let tx = null, ty = null, mode = 'idle';

  if (ai.rescueTarget && ai.rescueTarget.dead && ai.rescueTarget.rescuable){
    const rd = Math.hypot(ai.rescueTarget.x - ai.x, ai.rescueTarget.y - ai.y);
    if (rd > 45){ tx = ai.rescueTarget.x; ty = ai.rescueTarget.y; mode = 'rescue'; }
    else { mode = 'guard'; }
  }
  else if (downedMate && mateDist < cfg.rescueRange && ai.rescueCooldown <= 0){
    ai.rescueTarget = downedMate;
    tx = downedMate.x; ty = downedMate.y; mode = 'rescue';
  }
  else if (ai.onFire > 0 && fountain){
    tx = fountain.x*TILE+TILE/2; ty = fountain.y*TILE+TILE/2; mode = 'fountain';
  }
  else if (inProtection){
    if (book && bookDist < 500){ tx = book.x; ty = book.y; mode = 'skill'; }
    else if (enemy){ tx = enemy.x; ty = enemy.y; mode = 'approach'; }
    else mode = 'wander';
  }
  else if (enemy && enemyDist < cfg.reactRange){
    const dx = enemy.x - ai.x, dy = enemy.y - ai.y;
    const d = Math.hypot(dx, dy);
    if (d > 250){ tx = enemy.x; ty = enemy.y; }
    else if (d < 150){ tx = ai.x - dx*0.5; ty = ai.y - dy*0.5; }
    else { tx = ai.x; ty = ai.y; }
    mode = 'fight';
  }
  else if (ai.arrows < ARROW_MAX && freeArrow && arrowDist < 350){
    tx = freeArrow.x; ty = freeArrow.y; mode = 'collect';
  }
  else if (book && bookDist < 400){
    tx = book.x; ty = book.y; mode = 'skill';
  }
  else if (enemy){
    tx = enemy.x; ty = enemy.y; mode = 'chase';
  }
  else {
    mode = 'wander';
  }

  // 漫游
  if (mode === 'wander'){
    ai._aiWanderTimer--;
    const curDist = Math.hypot(ai._aiWanderX - ai.x, ai._aiWanderY - ai.y);
    if (ai._aiWanderTimer <= 0 || curDist < 80){
      for (let tries = 0; tries < 50; tries++){
        const wtx = 3 + Math.floor(Math.random() * (MAP_W - 6));
        const wty = 5 + Math.floor(Math.random() * (MAP_H - 8));
        if (tileAt(wtx, wty) === T.FLOOR && !forests.has(wtx+','+wty) && !crumbles.has(wtx+','+wty)){
          ai._aiWanderX = wtx*TILE+TILE/2;
          ai._aiWanderY = wty*TILE+TILE/2;
          break;
        }
      }
      ai._aiWanderTimer = cfg.wanderTime + Math.floor(Math.random() * 60);
    }
    tx = ai._aiWanderX;
    ty = ai._aiWanderY;
  }

  // 移动
  let mx = 0, my = 0;
  if (tx !== null && ty !== null){
    const dx = tx - ai.x, dy = ty - ai.y;
    if (Math.abs(dx) > 15) mx = Math.sign(dx);
    if (Math.abs(dy) > 15) my = Math.sign(dy);
    if (mx && !isSafeDirection(ai.x+ai.w/2, ai.y+ai.h/2, mx, 0, 30)){
      if (isSafeDirection(ai.x+ai.w/2, ai.y+ai.h/2, 0, 1, 30)) my = 1;
      else if (isSafeDirection(ai.x+ai.w/2, ai.y+ai.h/2, 0, -1, 30)) my = -1;
      else mx = 0;
    }
    if (my && !isSafeDirection(ai.x+ai.w/2, ai.y+ai.h/2, 0, my, 30)){
      if (isSafeDirection(ai.x+ai.w/2, ai.y+ai.h/2, 1, 0, 30)) mx = 1;
      else if (isSafeDirection(ai.x+ai.w/2, ai.y+ai.h/2, -1, 0, 30)) mx = -1;
      else my = 0;
    }
    if (nearVoid(ai.x+ai.w/2+mx*30, ai.y+ai.h/2+my*30, cfg.safeMargin)){ mx = 0; my = 0; }
  }

  // 卡住检测
  const moveDist = Math.hypot(ai.x - ai._aiLastX, ai.y - ai._aiLastY);
  if (moveDist < 0.5 && (mx !== 0 || my !== 0)) ai._aiStuckTimer++;
  else ai._aiStuckTimer = 0;
  ai._aiLastX = ai.x; ai._aiLastY = ai.y;
  if (ai._aiStuckTimer > 60){ ai._aiWanderTimer = 0; ai._aiStuckTimer = 0; }

  ai.ax = mx; ai.ay = my;
  inp.left = mx < 0 ? 1 : 0;
  inp.right = mx > 0 ? 1 : 0;
  inp.up = my < 0 ? 1 : 0;
  inp.down = my > 0 ? 1 : 0;

  // 朝向
  if (enemy && (mode === 'fight' || mode === 'chase' || mode === 'approach')){
    ai.facing = Math.atan2(enemy.y - ai.y, enemy.x - ai.x);
  } else if (tx !== null){
    ai.facing = Math.atan2(ty - ai.y, tx - ai.x);
  }

  // 射箭
  if ((mode === 'fight' || mode === 'chase' || mode === 'approach') && enemy){
    if (ai._aiCharging){
      inp.bow = 1;
      const desiredAngle = Math.atan2(enemy.y - ai.y, enemy.x - ai.x);
      const err = (1 - cfg.accuracy) * 0.4 * (Math.random() - 0.5);
      ai.facing = desiredAngle + err;
      ai.aimAngle = ai.facing;
      if (ai.chargeTime >= 30 || ai.arrows <= 0){
        inp.bow = 0; ai._aiCharging = false;
        ai._aiBowCd = 45 + Math.random() * 55;
      }
    } else if (ai._aiBowCd <= 0 && ai.arrows > 0 && enemyDist < cfg.reactRange){
      ai._aiCharging = true; inp.bow = 1;
    }
  } else if (ai._aiCharging){
    inp.bow = 0; ai._aiCharging = false;
  }
}

function teamAliveCount(team){
  let n = 0;
  for (const p of players){ if (p.team === team && !p.dead) n++; }
  return n;
}
function checkGameEnd(){
  if (gameState.ended || gameState.protectionLeft > 0) return;
  gameState.timeLeft--;
  const alive = [];
  for (let t = 0; t < gameConfig.teams; t++)
    if (teamAliveCount(t) > 0) alive.push(t);
  if (alive.length <= 1 || gameState.timeLeft <= 0) endGame();
}
function endGame(){
  if (gameState.ended) return;
  gameState.ended = true;
  const stats = [];
  for (let t = 0; t < gameConfig.teams; t++){
    let alive = 0, kills = 0, totalHp = 0;
    for (const p of players){
      if (p.team !== t) continue;
      if (!p.dead){ alive++; totalHp += p.hp; }
      kills += p.kills;
    }
    stats.push({ team: t, alive, kills, totalHp });
  }
  const sorted = [...stats].sort((a,b) => b.alive - a.alive || b.kills - a.kills || b.totalHp - a.totalHp);
  const mvp = players.reduce((m, p) => p.kills > m.kills ? p : m, players[0]);
  const wt = TEAMS[sorted[0].team];
  document.getElementById('winnerTitle').textContent = `🏆 ${wt.name} 获胜！`;
  document.getElementById('winnerTitle').style.color = wt.hex;
  document.getElementById('winnerSub').textContent = gameState.timeLeft <= 0 ? '时间到' : '其他阵营全灭';
  const maxAlive = Math.max(1, ...sorted.map(s => s.alive));
  let html = '';
  for (const s of sorted){
    const t = TEAMS[s.team];
    html += `<div class="stat-row ${s.team === sorted[0].team ? 'winner-row' : ''}">
      <span class="dot" style="background:${t.hex}"></span>
      <span style="min-width:44px">${t.name}</span>
      <span style="min-width:50px;color:#94a3b8;font-size:11px">${s.alive}/${gameConfig.perTeam}</span>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:${(s.alive/maxAlive)*100}%;background:${t.hex}"></div></div>
      <span style="min-width:40px;text-align:right;color:#fbbf24;font-size:11px">${s.kills}⚔</span>
    </div>`;
  }
  document.getElementById('statsList').innerHTML = html;
  const mt = TEAMS[mvp.team];
  const mvpName = mvp.index === myIndex ? '你' : (mvp.isAI ? 'AI' : '对手');
  document.getElementById('mvpName').textContent = `MVP · ${mvpName}`;
  document.getElementById('mvpName').style.color = mt.hex;
  document.getElementById('mvpStats').textContent = `${mvp.kills}击杀 · ${mvp.deaths}阵亡`;
  document.getElementById('resultModal').classList.add('active');
}

/* ============ 渲染 ============ */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function updateCamera(){
  const me = players[myIndex];
  if (!me) return;
  const targetX = me.x + me.w/2 - VIEW_PX_W/2;
  const targetY = me.y + me.h/2 - VIEW_PX_H/2;
  camera.x += (targetX - camera.x) * 0.2;
  camera.y += (targetY - camera.y) * 0.2;
  camera.x = Math.max(0, Math.min(W - VIEW_PX_W, camera.x));
  camera.y = Math.max(0, Math.min(H - VIEW_PX_H, camera.y));
}

function drawPlayer(p){
  const team = TEAMS[p.team];
  const cx = p.x+p.w/2, cy = p.y+p.h/2;

  if (p.dead){
    const canRescue = p.rescuable;
    ctx.fillStyle = canRescue ? 'rgba(71,85,105,.9)' : 'rgba(28,25,23,.92)';
    ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = canRescue ? '#94a3b8' : '#7f1d1d';
    ctx.lineWidth = 2.5; ctx.stroke();
    if (canRescue){
      const prog = p.rescueTimer / RESCUE_FRAMES;
      ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(cx, cy, 26, -Math.PI/2, -Math.PI/2 + Math.PI*2*prog);
      ctx.stroke();
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(Math.ceil((RESCUE_FRAMES-p.rescueTimer)/60), cx, cy);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    } else {
      ctx.fillStyle = '#7f1d1d';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('☠', cx, cy);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }
    return;
  }

  const flick = p.hurtFlash > 0 && p.hurtFlash % 4 < 2;
  const inProtection = gameState.protectionLeft > 0;

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 16, p.w/2 + 4, p.h/3, 0, 0, Math.PI*2);
  ctx.fill();

  if (inProtection){
    ctx.save();
    ctx.strokeStyle = 'rgba(96,165,250,0.7)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, p.w/2 + 14, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  if (p.frozen > 0){
    ctx.save();
    ctx.strokeStyle = '#a5f3fc'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, p.w/2 + 13, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  if (p.onFire > 0){
    ctx.save();
    ctx.fillStyle = 'rgba(249,115,22,.45)';
    ctx.beginPath(); ctx.arc(cx, cy, p.w/2 + 16, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  const sprKey = p.charId + '|' + team.hex;
  const spr = SPR.players[sprKey];
  if (spr && spr.complete){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(p.facing + Math.PI/2);
    if (flick) ctx.globalAlpha = 0.5;
    ctx.drawImage(spr, -p.w/2 - PLAYER_VISUAL_PAD, -p.h/2 - PLAYER_VISUAL_PAD,
                  p.w + PLAYER_VISUAL_PAD*2, p.h + PLAYER_VISUAL_PAD*2);
    ctx.restore();
    ctx.globalAlpha = 1;
  } else {
    // 图片未加载完成的兜底
    ctx.fillStyle = team.hex;
    ctx.beginPath(); ctx.arc(cx, cy, p.w/2, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  }

  if (p.index === myIndex){
    ctx.save();
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, p.w/2 + 12, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  if (p.swordTime > 0){
    const sx = cx + Math.cos(p.facing) * 30;
    const sy = cy + Math.sin(p.facing) * 30;
    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(p.facing);
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(-5, -4, 32, 8);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(-10, -7, 7, 14);
    ctx.restore();
  }
  if (p.charging){
    const len = 70 + (p.chargeTime/60) * 200;
    const ex = cx + Math.cos(p.aimAngle) * len;
    const ey = cy + Math.sin(p.aimAngle) * len;
    ctx.strokeStyle = 'rgba(56,189,248,.85)';
    ctx.setLineDash([8,5]);
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  if (p.skill){
    const def = SKILLS[p.skill.type];
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(def.icon, cx, cy - p.h/2 - 22);
    ctx.textAlign = 'left';
  }
}

function drawMiniMap(){
  const mmScale = 260 / W;
  const mh = H * mmScale;
  const mx = VIEW_PX_W - 260 - 10;
  const my = 10;

  ctx.save();
  ctx.fillStyle = 'rgba(2,6,23,.9)';
  ctx.fillRect(mx, my, 260, mh);
  ctx.strokeStyle = 'rgba(148,163,184,.6)';
  ctx.lineWidth = 2;
  ctx.strokeRect(mx, my, 260, mh);

  const cw = 260 / MAP_W;
  const ch = mh / MAP_H;
  for (let ty = 0; ty < MAP_H; ty++){
    for (let tx = 0; tx < MAP_W; tx++){
      const t = baseTiles[ty][tx];
      const px = mx + tx * cw;
      const py = my + ty * ch;
      if (t === T.WALL) ctx.fillStyle = '#334155';
      else if (t === T.VOID) ctx.fillStyle = '#000';
      else if (t === T.FOREST){
        const f = forests.get(tx+','+ty);
        ctx.fillStyle = f && f.alive ? '#166534' : '#0f172a';
      }
      else if (t === T.CRYSTAL){
        const c = crumbles.get(tx+','+ty);
        ctx.fillStyle = c && !c.gone ? '#0e7490' : '#0f172a';
      }
      else if (t === T.GATE) ctx.fillStyle = gateOpen ? '#22c55e' : '#92400e';
      else ctx.fillStyle = '#4a6b8a';
      ctx.fillRect(px, py, cw + 0.5, ch + 0.5);
    }
  }

  // ★ 所有玩家（含自己），先画其他玩家
  for (let i = 0; i < players.length; i++){
    const p = players[i];
    if (i === myIndex) continue;
    const px = mx + (p.x + p.w/2) * mmScale;
    const py = my + (p.y + p.h/2) * mmScale;
    ctx.fillStyle = TEAMS[p.team].hex;
    ctx.beginPath(); ctx.arc(px, py, p.dead ? 3 : 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
  }

  // 自己最后画，最显眼
  const me = players[myIndex];
  if (me){
    const px = mx + (me.x + me.w/2) * mmScale;
    const py = my + (me.y + me.h/2) * mmScale;
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    // 视野框
    ctx.strokeStyle = 'rgba(251,191,36,.6)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(
      mx + camera.x * mmScale,
      my + camera.y * mmScale,
      VIEW_PX_W * mmScale,
      VIEW_PX_H * mmScale
    );
  }
  ctx.restore();
}

function render(){
  ctx.fillStyle = '#020617';
  ctx.fillRect(0, 0, VIEW_PX_W, VIEW_PX_H);

  ctx.save();
  ctx.translate(-Math.round(camera.x), -Math.round(camera.y));

  const sx = Math.max(0, Math.floor(camera.x / TILE) - 2);
  const sy = Math.max(0, Math.floor(camera.y / TILE) - 2);
  const ex = Math.min(MAP_W, Math.ceil((camera.x + VIEW_PX_W) / TILE) + 2);
  const ey = Math.min(MAP_H, Math.ceil((camera.y + VIEW_PX_H) / TILE) + 2);

  // 瓦片
  for (let y = sy; y < ey; y++){
    for (let x = sx; x < ex; x++){
      const t = baseTiles[y][x];
      if (t === T.WALL) ctx.drawImage(SPR.wall, x*TILE, y*TILE, TILE, TILE);
      else if (t === T.VOID) ctx.drawImage(SPR.void, x*TILE, y*TILE, TILE, TILE);
      else if (t === T.GATE) ctx.drawImage(gateOpen ? SPR.gateOpen : SPR.gateClosed, x*TILE, y*TILE, TILE, TILE);
      else if (t === T.FLOOR){
        const isIsle = (y <= 4 || y >= MAP_H-5) && (x <= 5 || x >= MAP_W-6);
        ctx.drawImage(isIsle ? SPR.isle : SPR.floor, x*TILE, y*TILE, TILE, TILE);
      }
    }
  }
  // 开关
  for (const sw of switches){
    if (sw.px < camera.x - 40 || sw.px > camera.x + VIEW_PX_W + 40) continue;
    if (sw.py < camera.y - 40 || sw.py > camera.y + VIEW_PX_H + 40) continue;
    ctx.save();
    ctx.globalAlpha = 0.85 + 0.15 * Math.sin(sw.t);
    ctx.drawImage(gateOpen ? SPR.switchOn : SPR.switchOff, sw.px - TILE/2, sw.py - TILE/2, TILE, TILE);
    ctx.restore();
  }
  // 喷泉
  for (const f of FOUNTAINS){
    const px = f.x*TILE, py = f.y*TILE;
    if (px < camera.x - 40 || px > camera.x + VIEW_PX_W + 40) continue;
    if (py < camera.y - 40 || py > camera.y + VIEW_PX_H + 40) continue;
    ctx.drawImage(SPR.fountain, px, py, TILE, TILE);
  }
  // 传送门
  for (const po of portals){
    if (po.a.x < camera.x - 40 || po.a.x > camera.x + VIEW_PX_W + 40) continue;
    if (po.a.y < camera.y - 40 || po.a.y > camera.y + VIEW_PX_H + 40) continue;
    ctx.save();
    ctx.translate(po.a.x, po.a.y);
    ctx.rotate(po.t);
    ctx.drawImage(SPR.portal, -TILE/2, -TILE/2, TILE, TILE);
    ctx.restore();
  }
  // 树林
  for (const [key, f] of forests){
    if (!f.alive) continue;
    const [tx, ty] = key.split(',').map(Number);
    if (tx*TILE < camera.x - 40 || tx*TILE > camera.x + VIEW_PX_W + 40) continue;
    if (ty*TILE < camera.y - 40 || ty*TILE > camera.y + VIEW_PX_H + 40) continue;
    ctx.drawImage(f.burn > 0 ? SPR.forestBurn : SPR.forest, tx*TILE, ty*TILE, TILE, TILE);
  }
  // 水晶
  for (const [key, c] of crumbles){
    if (c.gone) continue;
    const [tx, ty] = key.split(',').map(Number);
    if (tx*TILE < camera.x - 40 || tx*TILE > camera.x + VIEW_PX_W + 40) continue;
    if (ty*TILE < camera.y - 40 || ty*TILE > camera.y + VIEW_PX_H + 40) continue;
    ctx.drawImage(c.timer > 0 ? SPR.crystalWarn : SPR.crystal, tx*TILE, ty*TILE, TILE, TILE);
  }
  // 技能书
  for (const b of books){
    if (b.x < camera.x - 30 || b.x > camera.x + VIEW_PX_W + 30) continue;
    if (b.y < camera.y - 30 || b.y > camera.y + VIEW_PX_H + 30) continue;
    const y = b.y + Math.sin(b.bob)*3;
    ctx.drawImage(SPR.book, b.x-14, y-14, 28, 28);
  }
  // 箭
  for (const a of arrows){
    if (a.x < camera.x - 40 || a.x > camera.x + VIEW_PX_W + 40) continue;
    if (a.y < camera.y - 40 || a.y > camera.y + VIEW_PX_H + 40) continue;
    ctx.save();
    ctx.translate(a.x, a.y); ctx.rotate(a.angle);
    const img = a.onFire ? SPR.arrowFire : a.onIce ? SPR.arrowIce : SPR.arrow;
    ctx.drawImage(img, -20, -8, 40, 16);
    ctx.restore();
  }
  // 玩家
  for (const p of players){
    if (p.x + p.w < camera.x - 60 || p.x > camera.x + VIEW_PX_W + 60) continue;
    if (p.y + p.h < camera.y - 60 || p.y > camera.y + VIEW_PX_H + 60) continue;
    drawPlayer(p);
  }
  // 粒子
  for (const pt of particles){
    if (pt.x < camera.x - 20 || pt.x > camera.x + VIEW_PX_W + 20) continue;
    if (pt.y < camera.y - 20 || pt.y > camera.y + VIEW_PX_H + 20) continue;
    ctx.globalAlpha = pt.life / pt.maxLife;
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x-pt.size/2, pt.y-pt.size/2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawMiniMap();
}

function updateHUD(){
  const hud = document.getElementById('hud');
  let html = '';
  for (let t = 0; t < gameConfig.teams; t++){
    let alive = 0, kills = 0;
    for (const p of players){
      if (p.team !== t) continue;
      if (!p.dead) alive++;
      kills += p.kills;
    }
    const team = TEAMS[t];
    const isMine = t === myTeam;
    html += `<div class="hud-item" style="${isMine?'background:rgba(59,130,246,.18);border:1px solid '+team.hex+'55':''}">
      <span class="dot" style="background:${team.hex}"></span>
      <span style="font-weight:${isMine?'700':'500'}">${team.name}</span>
      <span style="font-size:10px;color:#cbd5e1">${alive}/${gameConfig.perTeam}</span>
      <span style="font-size:10px;color:#fbbf24">⚔${kills}</span>
    </div>`;
  }
  const me = players[myIndex];
  if (me){
    let s;
    if (me.dead) s = me.rescuable ? '💀待救' : '☠️淘汰';
    else if (me.onFire > 0) s = '🔥' + Math.ceil(me.onFire/60) + 's';
    else if (me.frozen > 0) s = '❄️' + Math.ceil(me.frozen/60) + 's';
    else s = '❤'.repeat(me.hp) + '♡'.repeat(Math.max(0, me.maxHp-me.hp));
    const ch = CHARACTERS.find(c => c.id === me.charId)?.name || '';
    html += `<div class="hud-item" style="background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.3)">
      <span style="font-weight:700">你·${ch}</span>
      <span>${s}</span>
      <span style="font-size:10px;color:#fbbf24">⚔${me.kills}</span>
    </div>`;
  }
  html += `<div class="hud-item" style="background:${gateOpen?'rgba(34,197,94,.15)':'rgba(220,38,38,.15)'};border:1px solid ${gateOpen?'#22c55e':'#dc2626'}55">
    <span>🎚️</span><span style="color:${gateOpen?'#86efac':'#fca5a5'}">${gateOpen?'开':'关'}</span>
  </div>`;
  const tSec = Math.max(0, Math.floor(gameState.timeLeft / 60));
  const mm = String(Math.floor(tSec / 60)).padStart(2, '0');
  const ss = String(tSec % 60).padStart(2, '0');
  html += `<div class="timer ${tSec <= 30 ? 'warn' : ''}">${mm}:${ss}</div>`;
  hud.innerHTML = html;
}

/* ============ 输入 ============ */
const keys = {};
const touchInputs = { jump:0, dash:0, sword:0, bow:0 };
const joyVec = { x: 0, y: 0, active: false };

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function readInputs(){
  let kx = 0, ky = 0;
  if (keys['KeyA'] || keys['ArrowLeft']) kx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) kx += 1;
  if (keys['KeyW'] || keys['ArrowUp']) ky -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) ky += 1;
  let ax = kx + (joyVec.active ? joyVec.x : 0);
  let ay = ky + (joyVec.active ? joyVec.y : 0);
  const mag = Math.hypot(ax, ay);
  if (mag > 1){ ax /= mag; ay /= mag; }
  return {
    ax, ay,
    jump:  (keys['Space'] || touchInputs.jump) ? 1 : 0,
    dash:  (keys['ShiftLeft'] || keys['ShiftRight'] || touchInputs.dash) ? 1 : 0,
    sword: (keys['KeyJ'] || touchInputs.sword) ? 1 : 0,
    bow:   (keys['KeyK'] || touchInputs.bow) ? 1 : 0,
  };
}

const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
let joyPointerId = null;
function updateJoy(clientX, clientY){
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = clientX - cx, dy = clientY - cy;
  const maxR = rect.width * 0.35;
  const dist = Math.hypot(dx, dy);
  if (dist > maxR){ dx = dx / dist * maxR; dy = dy / dist * maxR; }
  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyVec.x = dx / maxR;
  joyVec.y = dy / maxR;
  joyVec.active = true;
}
function resetJoy(){
  joyKnob.style.transform = 'translate(-50%, -50%)';
  joyVec.x = 0; joyVec.y = 0; joyVec.active = false;
  joyPointerId = null;
}
joyBase.addEventListener('pointerdown', e => {
  e.preventDefault(); joyPointerId = e.pointerId;
  joyBase.setPointerCapture(e.pointerId);
  updateJoy(e.clientX, e.clientY);
});
joyBase.addEventListener('pointermove', e => {
  if (joyPointerId !== e.pointerId) return;
  e.preventDefault(); updateJoy(e.clientX, e.clientY);
});
joyBase.addEventListener('pointerup', e => {
  if (joyPointerId !== e.pointerId) return;
  e.preventDefault(); resetJoy();
});
joyBase.addEventListener('pointercancel', e => {
  if (joyPointerId !== e.pointerId) return; resetJoy();
});

document.querySelectorAll('[data-key]').forEach(btn => {
  const key = btn.dataset.key;
  const on = e => { e.preventDefault(); e.stopPropagation(); touchInputs[key] = 1; btn.classList.add('pressed'); };
  const off = e => { e.preventDefault(); e.stopPropagation(); touchInputs[key] = 0; btn.classList.remove('pressed'); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointercancel', off);
  btn.addEventListener('pointerleave', off);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});

const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (hasTouch){
  document.getElementById('mobileUI').classList.add('active');
  document.body.classList.add('touch-device');
  const kh = document.getElementById('kbHint');
  if (kh) kh.style.display = 'none';
}

function toggleFullscreen(){
  const el = document.documentElement;
  if (!document.fullscreenElement){
    (el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen)?.call(el).catch(()=>{});
    if (screen.orientation?.lock) screen.orientation.lock('landscape').catch(()=>{});
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen)?.call(document).catch(()=>{});
  }
}

/* ============ 设置界面 ============ */
function bindGroup(id, setter){
  document.getElementById(id).addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll(`#${id} button`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setter(btn.dataset.val);
    validateConfig(); updateTeamPreview(); updateHumanPickers();
  });
}
bindGroup('grpTeams', v => gameConfig.teams = parseInt(v));
bindGroup('grpPer', v => gameConfig.perTeam = parseInt(v));
bindGroup('grpAI', v => gameConfig.aiDiff = v);
bindGroup('grpHumans', v => gameConfig.humans = parseInt(v));

function validateConfig(){
  const maxH = Math.min(4, gameConfig.teams * gameConfig.perTeam);
  if (gameConfig.humans > maxH){
    gameConfig.humans = maxH;
    document.querySelectorAll('#grpHumans button').forEach(b => b.classList.toggle('active', parseInt(b.dataset.val) === maxH));
  }
  for (let h = 0; h < 4; h++)
    if (gameConfig.humanTeams[h] >= gameConfig.teams) gameConfig.humanTeams[h] = 0;
}
function updateTeamPreview(){
  const el = document.getElementById('teamPreview');
  let html = '';
  for (let t = 0; t < gameConfig.teams; t++){
    html += `<div class="team-chip" style="border-color:${TEAMS[t].hex}55">
      <span class="dot" style="background:${TEAMS[t].hex}"></span>
      <span>${TEAMS[t].name}</span>
      <span style="color:#64748b">×${gameConfig.perTeam}</span>
    </div>`;
  }
  el.innerHTML = html;
}
function updateHumanPickers(){
  const el = document.getElementById('humanTeamPickers');
  let html = '';
  for (let h = 0; h < gameConfig.humans; h++){
    const cur = gameConfig.humanTeams[h] || 0;
    html += `<div class="human-picker"><span class="label">玩家${h+1}${h===0?'(你)':''}</span>
      <div class="btn-group" data-human="${h}">`;
    for (let t = 0; t < gameConfig.teams; t++){
      html += `<button data-val="${t}" class="${cur === t ? 'active' : ''}">${TEAMS[t].name[0]}方</button>`;
    }
    html += `</div></div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll('.btn-group').forEach(grp => {
    grp.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const h = parseInt(grp.dataset.human);
      gameConfig.humanTeams[h] = parseInt(btn.dataset.val);
      updateHumanPickers();
    });
  });
}
validateConfig();
updateTeamPreview();
updateHumanPickers();
document.getElementById('myCharName').textContent = CHARACTERS.find(c => c.id === myCharId).name;

function openCharSelect(){
  charSelectTemp = myCharId;
  renderCharGrid();
  document.getElementById('charModal').classList.add('active');
}
function closeCharSelect(){ document.getElementById('charModal').classList.remove('active'); }
function confirmCharSelect(){
  if (charSelectTemp) myCharId = charSelectTemp;
  document.getElementById('myCharName').textContent = CHARACTERS.find(c => c.id === myCharId).name;
  closeCharSelect();
}
function renderCharGrid(){
  const grid = document.getElementById('charGrid');
  const previewTeamHex = TEAMS[gameConfig.humanTeams[0] || 0].hex;
  let html = '';
  for (const c of CHARACTERS){
    const sel = c.id === charSelectTemp ? 'selected' : '';
    html += `<div class="char-card ${sel}" data-char="${c.id}">
      ${charSVG(c.id, previewTeamHex, 100)}
      <div class="char-name">${c.name}</div>
      <div class="char-title">${c.title}</div>
    </div>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.char-card').forEach(card => {
    card.addEventListener('click', () => {
      charSelectTemp = card.dataset.char;
      grid.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
    });
  });
}

/* ============ 网络 ============ */
let peer = null, conn = null, isHost = false, roomCode = null;
let remoteInputs = { ax:0, ay:0, jump:0, dash:0, sword:0, bow:0 };
let remoteConnected = false;

function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function openCreateRoom(){
  roomCode = genCode();
  peer = new Peer('arrowarena-' + roomCode);
  peer.on('open', () => {
    isHost = true;
    showScreen('waiting');
    document.getElementById('roomCodeDisplay').textContent = roomCode;
  });
  peer.on('connection', c => {
    if (conn && conn.open){ c.close(); return; }
    conn = c;
    conn.on('open', () => {
      remoteConnected = true;
      conn.send({ type:'welcome', config: gameConfig, slot: 1, charId: myCharId });
      document.getElementById('waitStatus').innerHTML = '✅ 队友已加入';
    });
    conn.on('data', d => {
      if (d.type === 'input') remoteInputs = d.inputs;
    });
    conn.on('close', () => { remoteConnected = false; toast('队友断开'); });
  });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') openCreateRoom();
    else { toast('网络错误：' + err.message); leaveRoom(); }
  });
}
function joinRoom(code){
  code = (code || '').toUpperCase().trim();
  if (code.length !== 6) return toast('请输入 6 位房间码');
  peer = new Peer();
  peer.on('open', () => {
    isHost = false;
    conn = peer.connect('arrowarena-' + code);
    conn.on('open', () => { remoteConnected = true; });
    conn.on('data', d => {
      if (d.type === 'welcome'){
        gameConfig = d.config;
        mySlotIndex = d.slot;
        if (d.charId) myCharId = d.charId;
        startGame();
      } else if (d.type === 'snap'){
        applySnapshot(d.snap);
      } else if (d.type === 'rematch'){
        resetWorld(); lastTime = performance.now();
        document.getElementById('resultModal').classList.remove('active');
      }
    });
    conn.on('close', () => { toast('断开连接'); leaveRoom(); });
  });
  peer.on('error', err => {
    if (err.type === 'peer-unavailable') toast('房间不存在');
    else toast('连接失败');
    cleanup();
  });
}
function startGame(){
  resetWorld();
  showScreen('game');
  lastTime = performance.now();
  document.getElementById('resultModal').classList.remove('active');
}
function copyRoomCode(){
  if (!roomCode) return;
  if (navigator.clipboard) navigator.clipboard.writeText(roomCode).then(() => toast('已复制'));
  else toast(roomCode);
}
function cleanup(){
  if (conn){ try { conn.close(); } catch(e){} conn = null; }
  if (peer){ try { peer.destroy(); } catch(e){} peer = null; }
  isHost = false; remoteConnected = false; roomCode = null;
}
function leaveRoom(){
  cleanup();
  players = []; arrows = []; books = []; particles = [];
  document.getElementById('resultModal').classList.remove('active');
  showScreen('setup');
  document.getElementById('joinCode').value = '';
}
function rematch(){
  document.getElementById('resultModal').classList.remove('active');
  if (isHost){
    resetWorld(); lastTime = performance.now();
    if (conn && conn.open) conn.send({ type:'rematch' });
  }
}
function backToSetup(){
  document.getElementById('resultModal').classList.remove('active');
  leaveRoom();
}

function makeSnapshot(){
  return {
    t: worldTime, timeLeft: gameState.timeLeft, ended: gameState.ended,
    protectionLeft: gameState.protectionLeft, gateOpen,
    players: players.map(p => ({
      x:p.x, y:p.y, vx:p.vx, vy:p.vy, facing:p.facing, aimAngle:p.aimAngle,
      dead:p.dead, deadTimer:p.deadTimer, rescueTimer:p.rescueTimer,
      rescuable:p.rescuable, deathReason:p.deathReason,
      onFire:p.onFire, frozen:p.frozen, arrows:p.arrows, hp:p.hp,
      kills:p.kills, deaths:p.deaths, charId:p.charId, team:p.team,
      skill:p.skill ? { type:p.skill.type, timer:p.skill.timer } : null,
      hurtFlash:p.hurtFlash, dashTime:p.dashTime, swordTime:p.swordTime,
      charging:p.charging, chargeTime:p.chargeTime, fallTimer:p.fallTimer
    })),
    arrows: arrows.map(a => ({
      x:a.x, y:a.y, vx:a.vx, vy:a.vy, angle:a.angle, speed:a.speed, curve:a.curve,
      onFire:a.onFire, onIce:a.onIce, stuck:a.stuck, owner:a.owner, life:a.life,
      trail:a.trail.slice(-5)
    })),
    crumbles: [...crumbles].map(([k,v]) => [k, v.gone, v.timer, v.respawn]),
    forests: [...forests].map(([k,v]) => [k, v.alive, v.burn]),
    books: books.map(b => ({ x:b.x, y:b.y, type:b.type, life:b.life, bob:b.bob })),
    particles: particles.slice(0, 40).map(p => ({
      x:p.x, y:p.y, vx:p.vx, vy:p.vy, life:p.life, maxLife:p.maxLife, color:p.color, size:p.size
    })),
  };
}
function applySnapshot(s){
  worldTime = s.t;
  gameState.timeLeft = s.timeLeft;
  gameState.protectionLeft = s.protectionLeft;
  gateOpen = s.gateOpen;
  if (s.protectionLeft > 0){
    document.getElementById('protectOverlay').classList.remove('hidden');
    document.getElementById('protectTime').textContent = Math.ceil(s.protectionLeft / 60);
  } else document.getElementById('protectOverlay').classList.add('hidden');
  for (let i = 0; i < s.players.length && i < players.length; i++){
    const src = s.players[i], dst = players[i];
    if (i === myIndex){
      const dx = src.x - dst.x, dy = src.y - dst.y;
      if (Math.hypot(dx, dy) > 80){ dst.x = src.x; dst.y = src.y; }
      else { dst.x += dx * 0.18; dst.y += dy * 0.18; }
    } else { dst.x = src.x; dst.y = src.y; }
    dst.vx = src.vx; dst.vy = src.vy; dst.facing = src.facing;
    dst.aimAngle = src.aimAngle || 0;
    dst.dead = src.dead; dst.deadTimer = src.deadTimer; dst.rescueTimer = src.rescueTimer || 0;
    dst.rescuable = src.rescuable; dst.deathReason = src.deathReason;
    dst.onFire = src.onFire; dst.frozen = src.frozen;
    dst.arrows = src.arrows; dst.hp = src.hp;
    dst.kills = src.kills; dst.deaths = src.deaths;
    dst.charId = src.charId || dst.charId;
    dst.skill = src.skill ? { type:src.skill.type, timer:src.skill.timer } : null;
    dst.hurtFlash = src.hurtFlash; dst.dashTime = src.dashTime;
    dst.swordTime = src.swordTime;
    dst.charging = src.charging; dst.chargeTime = src.chargeTime;
    dst.fallTimer = src.fallTimer || 0;
  }
  arrows = s.arrows.map(a => ({ ...a, trail: a.trail || [] }));
  for (const [k, gone, timer, respawn] of s.crumbles){
    const c = crumbles.get(k);
    if (c){ c.gone = gone; c.timer = timer; c.respawn = respawn; }
  }
  for (const [k, alive, burn] of s.forests){
    const f = forests.get(k);
    if (f){ f.alive = alive; f.burn = burn; }
  }
  books = s.books.map(b => ({ ...b }));
  particles = s.particles.map(p => ({ ...p }));
  if (s.ended && !gameState.ended){ gameState.ended = true; endGame(); }
}

/* ============ 主循环 ============ */
let lastTime = 0, acc = 0;
const STEP = 1000/60;

function loop(now){
  requestAnimationFrame(loop);
  if (!document.getElementById('screen-game').classList.contains('active')) return;
  if (!players.length) return;
  const dt = Math.min(now - lastTime, 100);
  lastTime = now;
  acc += dt;
  let iter = 0;
  while (acc >= STEP && iter < 4){
    acc -= STEP; iter++;
    if (!gameState.ended){
      if (isHost){
        for (const p of players){
          if (p.index === myIndex){
            const inp = readInputs();
            p.ax = inp.ax; p.ay = inp.ay; p.inputs = inp;
          } else if (p.isAI) updateAI(p);
          else if (remoteConnected && humanSlots[mySlotIndex] === p.index){
            p.ax = remoteInputs.ax || 0; p.ay = remoteInputs.ay || 0;
            p.inputs = remoteInputs;
          } else {
            p.ax = 0; p.ay = 0; p.inputs = {};
          }
        }
        updateTerrain();
        for (const p of players) updatePlayer(p);
        updateArrows();
        checkGameEnd();
        if (conn && conn.open && remoteConnected) conn.send({ type:'snap', snap: makeSnapshot() });
      } else {
        if (conn && conn.open) conn.send({ type:'input', inputs: readInputs() });
        const me = players[myIndex];
        if (me && !me.dead){
          const inp = readInputs();
          me.ax = inp.ax; me.ay = inp.ay; me.inputs = inp;
        }
        for (let i = particles.length-1; i >= 0; i--){
          const pt = particles[i];
          pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.05; pt.life--;
          if (pt.life <= 0) particles.splice(i,1);
        }
        for (const b of books) b.bob += 0.08;
        worldTime++;
      }
    }
  }
  updateCamera();
  render();
  updateHUD();
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

document.getElementById('joinCode').addEventListener('keydown', e => {
  if (e.key === 'Enter') joinRoom(e.target.value);
});
document.getElementById('joinCode').addEventListener('input', e => {
  e.target.value = e.target.value.toUpperCase();
});

loadSprites();
parseMap();
requestAnimationFrame(loop);
</script>
