<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<meta name="x5-orientation" content="landscape">
<title>洛宾汗 · Robin Khan</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none}
html,body{overflow:hidden;touch-action:none;width:100vw;height:100vh;
background:#030610;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{display:none;width:100%;height:100%;max-width:1400px;position:relative}
.screen.active{display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{background:linear-gradient(160deg,rgba(30,41,59,.94),rgba(15,23,42,.94));backdrop-filter:blur(14px);
border:1px solid rgba(148,163,184,.16);border-radius:18px;padding:20px 22px;
box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
width:min(520px,92vw);max-height:94vh;overflow-y:auto}
h1{font-size:22px;margin-bottom:4px;text-align:center;letter-spacing:3px;
background:linear-gradient(180deg,#fbbf24,#ea580c);-webkit-background-clip:text;background-clip:text;
-webkit-text-fill-color:transparent}
h2{font-size:10px;margin-bottom:16px;text-align:center;color:#64748b;font-weight:400;letter-spacing:4px}
h3{font-size:12px;color:#94a3b8;margin:12px 0 6px;text-align:center;font-weight:500}
button{font-family:inherit;font-size:14px;padding:11px 18px;border:none;border-radius:10px;
background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;cursor:pointer;
transition:all .15s;width:100%;margin-bottom:8px;font-weight:600;letter-spacing:.5px;
box-shadow:0 4px 12px rgba(37,99,235,.25)}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(59,130,246,.4)}
button:disabled{opacity:.4;cursor:not-allowed}
button.secondary{background:#334155;box-shadow:0 4px 12px rgba(0,0,0,.25)}
input{font-family:inherit;font-size:14px;padding:11px;border-radius:10px;border:1px solid #334155;
background:#0f172a;color:#e2e8f0;width:100%;margin-bottom:8px;text-transform:uppercase}
input:focus{outline:none;border-color:#3b82f6}
input::placeholder{color:#475569;text-transform:none}
.row{display:flex;gap:8px}
.row>input{flex:2;margin-bottom:0}
.row>button{flex:1;margin-bottom:0}
.room-code{font-size:32px;font-weight:800;letter-spacing:9px;text-align:center;padding:18px;
background:#0f172a;border:1px dashed #334155;border-radius:12px;margin-bottom:12px;
color:#60a5fa;font-family:'Courier New',monospace;text-indent:9px}
.hud{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;
background:rgba(15,23,42,.94);border-radius:10px;margin-bottom:6px;font-size:11px;gap:6px;flex-wrap:wrap;
border:1px solid rgba(148,163,184,.1)}
.hud-item{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:5px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.timer{font-family:'Courier New',monospace;font-size:15px;font-weight:800;color:#fbbf24;
padding:2px 10px;background:#0f172a;border-radius:7px;letter-spacing:1px}
.timer.warn{color:#ef4444;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.game-view{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
canvas{display:block;flex:1;width:100%;height:100%;border-radius:12px;
box-shadow:0 8px 30px rgba(0,0,0,.55);background:#05070f;object-fit:contain}
.hidden{display:none!important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
background:#1e293b;border:1px solid #334155;padding:10px 20px;border-radius:9px;font-size:13px;
opacity:0;pointer-events:none;transition:all .3s;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.legend{font-size:10px;color:#64748b;text-align:center;line-height:1.6;margin-top:8px}
.setting-row{margin-bottom:10px}
.setting-row>label{display:block;font-size:11px;color:#94a3b8;margin-bottom:5px;
text-align:center;font-weight:500;letter-spacing:1px}
.btn-group{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.btn-group button{flex:1;min-width:40px;margin:0;padding:8px 5px;font-size:11px;
background:#1e293b;border:1.5px solid transparent;color:#94a3b8;font-weight:600;box-shadow:none}
.btn-group button.active{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;
border-color:#60a5fa;box-shadow:0 3px 12px rgba(59,130,246,.4)}
.btn-group button:hover:not(.active){background:#334155;color:#cbd5e1;transform:none;box-shadow:none}
.team-preview{display:flex;justify-content:center;gap:5px;margin-top:8px;flex-wrap:wrap}
.team-chip{display:flex;align-items:center;gap:3px;padding:4px 8px;border-radius:7px;
background:#0f172a;font-size:11px;border:1px solid #1e293b}
.team-chip .dot{width:7px;height:7px}
.human-picker{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:5px}
.human-picker .label{font-size:11px;color:#94a3b8;min-width:64px;text-align:right}
.human-picker .btn-group{flex:1}
.human-picker .btn-group button{min-width:36px;padding:5px 3px;font-size:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);
display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
.modal.active{display:flex;animation:fadeIn .25s ease}
.modal-content{background:linear-gradient(160deg,#1e293b,#0f172a);
border:2px solid rgba(148,163,184,.2);border-radius:18px;padding:22px 20px;
max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.8);max-height:92vh;overflow-y:auto}
.winner-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px;letter-spacing:2px}
.winner-sub{font-size:12px;text-align:center;color:#94a3b8;margin-bottom:16px}
.stats-list{background:#0a0e1a;border-radius:10px;padding:12px;margin-bottom:14px}
.stat-row{display:flex;align-items:center;gap:8px;padding:6px 0;
border-bottom:1px solid #1e293b;font-size:12px}
.stat-row:last-child{border-bottom:none}
.stat-row.winner-row{background:rgba(59,130,246,.1);margin:0 -6px;padding:6px;border-radius:6px}
.stat-bar{flex:1;height:5px;background:#1e293b;border-radius:3px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.mvp-box{background:linear-gradient(135deg,rgba(250,204,21,.15),rgba(234,179,8,.08));
border:1px solid rgba(250,204,21,.35);border-radius:10px;padding:12px;margin-bottom:14px;
display:flex;align-items:center;gap:10px}
.mvp-icon{font-size:24px;filter:drop-shadow(0 0 8px rgba(250,204,21,.6))}
.mvp-info{flex:1}
.mvp-name{font-size:14px;font-weight:700;color:#fbbf24;margin-bottom:2px}
.mvp-stats{font-size:11px;color:#94a3b8}

/* 角色选择盘 */
.char-select-panel{width:min(1000px,96vw);max-height:94vh;padding:20px;
background:linear-gradient(160deg,rgba(30,41,59,.97),rgba(15,23,42,.97));
backdrop-filter:blur(16px);border:2px solid rgba(250,204,21,.25);border-radius:20px;
box-shadow:0 30px 80px rgba(0,0,0,.8),0 0 60px rgba(250,204,21,.15);overflow-y:auto}
.char-select-title{text-align:center;font-size:22px;font-weight:800;letter-spacing:6px;
margin-bottom:4px;background:linear-gradient(180deg,#fbbf24,#ea580c);
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.char-select-sub{text-align:center;font-size:11px;color:#64748b;letter-spacing:3px;margin-bottom:16px}
.char-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.char-card{position:relative;background:linear-gradient(160deg,rgba(15,23,42,.95),rgba(30,41,59,.9));
border:2px solid rgba(148,163,184,.2);border-radius:14px;padding:10px 6px 8px;
cursor:pointer;transition:all .18s;text-align:center;overflow:hidden}
.char-card:hover{transform:translateY(-3px);border-color:rgba(96,165,250,.5);
box-shadow:0 8px 24px rgba(59,130,246,.3)}
.char-card.selected{background:linear-gradient(160deg,rgba(250,204,21,.25),rgba(234,179,8,.15));
border-color:#fbbf24;box-shadow:0 0 24px rgba(250,204,21,.5),inset 0 0 20px rgba(250,204,21,.15)}
.char-card.selected::after{content:'';position:absolute;inset:0;border-radius:12px;
background:radial-gradient(circle at 50% 30%,rgba(250,204,21,.2),transparent 70%);
pointer-events:none}
.char-card svg{width:100%;height:auto;max-width:100px;display:block;margin:0 auto}
.char-name{font-size:11px;font-weight:700;color:#cbd5e1;margin-top:4px;letter-spacing:1px}
.char-title{font-size:9px;color:#64748b;margin-top:1px;letter-spacing:1px}
.char-card.selected .char-name{color:#fbbf24}
.char-actions{display:flex;gap:8px}
.char-actions button{flex:1;margin-bottom:0}

.mobile-ui{position:fixed;inset:0;pointer-events:none;display:none;z-index:100}
.mobile-ui.active{display:block}
.dpad{position:absolute;left:max(3vw,12px);bottom:max(3vh,12px);
width:min(32vw,170px);height:min(32vw,170px);pointer-events:auto}
.dpad button{position:absolute;width:34%;height:34%;border:none;border-radius:14px;
background:rgba(59,130,246,.4);border:2px solid rgba(96,165,250,.6);
color:#e0f2fe;padding:0;margin:0;font-weight:700;
backdrop-filter:blur(4px);transition:all .06s;line-height:1;min-width:auto;box-shadow:none;
display:flex;align-items:center;justify-content:center;
touch-action:none;-webkit-touch-callout:none;outline:none}
.dpad button.pressed,.dpad button:active{background:rgba(59,130,246,.75);transform:scale(.92);
border-color:#93c5fd;box-shadow:0 0 18px rgba(96,165,250,.7)}
.dpad button svg{width:58%;height:58%;pointer-events:none;
filter:drop-shadow(0 0 4px rgba(224,242,254,.6))}
.dpad .up{left:33%;top:0}
.dpad .down{left:33%;bottom:0}
.dpad .left{left:0;top:33%}
.dpad .right{right:0;top:33%}

.actions{position:absolute;right:max(3vw,12px);bottom:max(3vh,12px);
width:min(36vw,180px);height:min(36vw,180px);pointer-events:auto}
.actions button{position:absolute;width:48%;height:48%;border-radius:50%;
border:2px solid rgba(255,255,255,.4);color:#fff;font-size:14px;font-weight:800;
padding:0;margin:0;backdrop-filter:blur(4px);transition:all .06s;min-width:auto;box-shadow:none;
display:flex;align-items:center;justify-content:center;
touch-action:none;-webkit-touch-callout:none;outline:none}
.actions button svg{width:52%;height:52%;pointer-events:none;filter:drop-shadow(0 0 3px rgba(255,255,255,.6))}
.actions button.pressed,.actions button:active{transform:scale(.88);filter:brightness(1.5)}
.actions .jump{right:26%;top:0;background:rgba(34,197,94,.55)}
.actions .dash{left:0;top:26%;background:rgba(59,130,246,.6)}
.actions .sword{right:0;top:26%;background:rgba(234,179,8,.6)}
.actions .bow{right:26%;bottom:0;background:rgba(239,68,68,.55)}

.skill-banner{position:fixed;top:20%;left:50%;padding:12px 24px;
background:rgba(15,23,42,.96);border:2px solid #60a5fa;border-radius:12px;
font-size:16px;font-weight:800;letter-spacing:2px;color:#60a5fa;
pointer-events:none;z-index:1000;opacity:0;transform:translate(-50%,-50%) scale(.7)}
@keyframes skillPop{
0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
30%,80%{opacity:1;transform:translate(-50%,-50%) scale(1)}
100%{opacity:0;transform:translate(-50%,-50%) scale(1)}
}
.protect-overlay{position:absolute;top:8px;left:50%;transform:translateX(-50%);
background:linear-gradient(135deg,rgba(59,130,246,.9),rgba(147,51,234,.9));
color:#fff;padding:5px 18px;border-radius:18px;font-size:12px;font-weight:700;
letter-spacing:2px;z-index:150;pointer-events:none;
box-shadow:0 0 20px rgba(59,130,246,.7);border:1px solid rgba(255,255,255,.3)}
.protect-overlay.hidden{display:none}
.fs-btn{position:absolute;top:8px;right:8px;width:32px;height:32px;padding:0;
background:rgba(30,41,59,.85);border:1px solid rgba(148,163,184,.2);
border-radius:8px;color:#cbd5e1;font-size:16px;line-height:1;cursor:pointer;
margin:0;min-width:auto;z-index:20;display:flex;align-items:center;justify-content:center;box-shadow:none}
.rotate-hint{position:fixed;inset:0;background:#05070f;z-index:9999;display:none;
align-items:center;justify-content:center;flex-direction:column;gap:20px;
color:#94a3b8;font-size:14px;letter-spacing:2px;text-align:center;padding:20px}
.rotate-hint .icon{font-size:60px;animation:rotateAnim 2s ease-in-out infinite}
@keyframes rotateAnim{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:800px){body.touch-device .rotate-hint{display:flex}}
.kb-hint{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:11px;color:#64748b;flex-wrap:wrap}
.kb-hint .k{display:inline-block;background:#1e293b;border:1px solid #334155;border-radius:4px;
padding:2px 6px;font-family:'Courier New',monospace;color:#cbd5e1;margin:0 2px}
</style>
</head>
<body>

<div class="rotate-hint">
  <div class="icon">📱</div>
  <div>请旋转至横屏游玩</div>
</div>

<div id="wrap">

<div class="screen active" id="screen-setup">
  <div class="card">
    <h1>🏹 箭回旋</h1>
    <h2>ARROW ARENA · 竞技场</h2>
    <div class="setting-row">
      <label>阵营数量</label>
      <div class="btn-group" id="grpTeams">
        <button data-val="2" class="active">2 阵营</button>
        <button data-val="3">3 阵营</button>
        <button data-val="4">4 阵营</button>
      </div>
    </div>
    <div class="setting-row">
      <label>每阵营角色数</label>
      <div class="btn-group" id="grpPer">
        <button data-val="1">1</button>
        <button data-val="2" class="active">2</button>
        <button data-val="3">3</button>
        <button data-val="4">4</button>
        <button data-val="5">5</button>
      </div>
    </div>
    <div class="setting-row">
      <label>AI 难度</label>
      <div class="btn-group" id="grpAI">
        <button data-val="easy">简单</button>
        <button data-val="normal" class="active">一般</button>
        <button data-val="hard">困难</button>
        <button data-val="hell">地狱</button>
      </div>
    </div>
    <div class="setting-row">
      <label>真人玩家数</label>
      <div class="btn-group" id="grpHumans">
        <button data-val="1" class="active">1</button>
        <button data-val="2">2</button>
        <button data-val="3">3</button>
        <button data-val="4">4</button>
      </div>
    </div>
    <div class="setting-row" id="humanTeamsRow">
      <label>真人所属阵营</label>
      <div id="humanTeamPickers"></div>
    </div>
    <button class="secondary" onclick="openCharSelect()" style="background:linear-gradient(135deg,#ea580c,#dc2626)">
      ⚔️ 选择你的角色（<span id="myCharName">圣殿骑士</span>）
    </button>
    <div class="team-preview" id="teamPreview"></div>
    <button onclick="openCreateRoom()" style="margin-top:12px">🌐 创建房间</button>
    <div class="row" style="margin-top:8px">
      <input id="joinCode" placeholder="输入 6 位房间码" maxlength="6" autocomplete="off">
      <button class="secondary" onclick="joinRoom(document.getElementById('joinCode').value)">加入</button>
    </div>
    <div class="legend">
      每局 5 分钟 · 开局 15 秒保护 · 死亡 15 秒自动复活<br>
      💧 喷泉灭火 · 🌀 传送门 · 掉入深渊/烧死永久淘汰
    </div>
    <div class="kb-hint" id="kbHint">
      <span><span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span> 移动</span>
      <span><span class="k">J</span> 剑</span>
      <span><span class="k">K</span> 蓄力射箭</span>
      <span><span class="k">Shift</span> 冲刺</span>
    </div>
  </div>
</div>

<div class="screen" id="screen-waiting">
  <div class="card">
    <h3>房间码 · 分享给队友</h3>
    <div class="room-code" id="roomCodeDisplay">------</div>
    <button class="secondary" onclick="copyRoomCode()">📋 复制房间码</button>
    <div style="margin-top:12px;font-size:12px;color:#94a3b8;text-align:center" id="waitStatus">
      等待队友加入（或直接开始 AI 对战）…
    </div>
    <button onclick="startGame()" style="margin-top:14px">▶ 开始游戏</button>
    <button class="secondary" onclick="leaveRoom()">返回设置</button>
  </div>
</div>

<div class="screen" id="screen-game">
  <div class="game-view">
    <div class="hud" id="hud"></div>
    <div style="position:relative;flex:1;min-height:0">
      <canvas id="canvas" width="1120" height="616"></canvas>
      <div class="protect-overlay hidden" id="protectOverlay">🛡 保护期 <span id="protectTime">15</span>s</div>
      <button class="fs-btn" onclick="toggleFullscreen()" title="全屏">⛶</button>
    </div>
  </div>
</div>

<div class="modal" id="resultModal">
  <div class="modal-content">
    <div class="winner-title" id="winnerTitle">阵营获胜！</div>
    <div class="winner-sub" id="winnerSub"></div>
    <div class="stats-list" id="statsList"></div>
    <div class="mvp-box">
      <div class="mvp-icon">⭐</div>
      <div class="mvp-info">
        <div class="mvp-name" id="mvpName">—</div>
        <div class="mvp-stats" id="mvpStats">—</div>
      </div>
    </div>
    <button onclick="rematch()">🔄 再来一局</button>
    <button class="secondary" onclick="backToSetup()">⚙ 返回设置</button>
  </div>
</div>

<div class="modal" id="charModal">
  <div class="char-select-panel">
    <div class="char-select-title">⚔️ 选择你的战士 ⚔️</div>
    <div class="char-select-sub">SELECT YOUR FIGHTER</div>
    <div class="char-grid" id="charGrid"></div>
    <div class="char-actions">
      <button class="secondary" onclick="closeCharSelect()">取消</button>
      <button onclick="confirmCharSelect()">✓ 确定</button>
    </div>
  </div>
</div>

<div class="skill-banner hidden" id="skillBanner"></div>
<div class="toast" id="toast"></div>

<div class="mobile-ui" id="mobileUI">
  <div class="dpad">
    <button class="up" data-key="up"><svg viewBox="0 0 24 24"><polygon points="12,3 22,21 2,21" fill="#e0f2fe"/></svg></button>
    <button class="down" data-key="down"><svg viewBox="0 0 24 24"><polygon points="12,21 22,3 2,3" fill="#e0f2fe"/></svg></button>
    <button class="left" data-key="left"><svg viewBox="0 0 24 24"><polygon points="3,12 21,2 21,22" fill="#e0f2fe"/></svg></button>
    <button class="right" data-key="right"><svg viewBox="0 0 24 24"><polygon points="21,12 3,2 3,22" fill="#e0f2fe"/></svg></button>
  </div>
  <div class="actions">
    <button class="jump" data-key="jump"><svg viewBox="0 0 24 24"><path d="M12,3 L16,10 L14,10 L14,20 L10,20 L10,10 L8,10 Z" fill="#fff"/></svg></button>
    <button class="dash" data-key="dash"><svg viewBox="0 0 24 24"><path d="M3,8 L14,8 L14,4 L21,12 L14,20 L14,16 L3,16 Z" fill="#fff"/></svg></button>
    <button class="sword" data-key="sword"><svg viewBox="0 0 24 24"><path d="M4,20 L6,22 L11,17 L13,19 L20,4 L18,2 L16,4 L14,6 L9,11 L7,9 L5,11 L9,15 L7,17 Z" fill="#fff"/></svg></button>
    <button class="bow" data-key="bow"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="12" r="1.5" fill="#fff"/></svg></button>
  </div>
</div>

</div>

<script>
/* ================= 常量 ================= */
const TILE = 28;
const MAP_W = 40, MAP_H = 22;
const W = TILE * MAP_W, H = TILE * MAP_H;

const MOVE_SPEED = 3.6;
const DASH_SPEED = 12;
const DASH_TIME = 9;
const DASH_CD = 32;
const ARROW_MAX = 5;
const RESPAWN_FRAMES = 900;
const BURN_FRAMES = 900;
const FREEZE_FRAMES = 900;
const FALL_GRACE = 70;
const ROUND_FRAMES = 300 * 60;
const PROTECTION_FRAMES = 15 * 60;

/* ================= 地图解析 ================= */
function parseMap(){
  baseTiles = []; crumbles = new Map(); forests = new Map(); movers = []; portals = [];
  for (let y = 0; y < MAP_H; y++){
    const row = [];
    for (let x = 0; x < MAP_W; x++){
      const ch = MAP_STR[y][x];
      let t = T.FLOOR;
      if (ch === '#') t = T.WALL;
      else if (ch === '~') t = T.VOID;
      else if (ch === 'F'){ t = T.FOREST; forests.set(x+','+y,{alive:true,burn:0}); }
      else if (ch === 'C'){ t = T.CRYSTAL; crumbles.set(x+','+y,{gone:false,timer:0,respawn:0}); }
      row.push(t);
    }
    baseTiles.push(row);
  }
  for (const cfg of MOVERS_CFG){
    movers.push({
      kind: cfg.kind, ox: cfg.ox, oy: cfg.oy,
      w: cfg.w, h: cfg.h, range: cfg.range, speed: cfg.speed,
      t: Math.random()*6.28, px: cfg.ox*TILE, py: cfg.oy*TILE
    });
  }
  for (const p of PORTALS){
    portals.push({ a: {x:p.a.x*TILE+TILE/2, y:p.a.y*TILE+TILE/2}, b: {x:p.b.x*TILE+TILE/2, y:p.b.y*TILE+TILE/2}, t: Math.random()*6.28 });
    portals.push({ a: {x:p.b.x*TILE+TILE/2, y:p.b.y*TILE+TILE/2}, b: {x:p.a.x*TILE+TILE/2, y:p.a.y*TILE+TILE/2}, t: Math.random()*6.28 });
  }
}

function tileAt(tx, ty){
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return T.WALL;
  return baseTiles[ty][tx];
}

function isBlocking(tx, ty){
  const t = tileAt(tx, ty);
  if (t === T.WALL) return true;
  if (t === T.FOREST){
    const f = forests.get(tx+','+ty);
    return f && f.alive;
  }
  if (t === T.CRYSTAL){
    const c = crumbles.get(tx+','+ty);
    return c && !c.gone;
  }
  for (const f of FOUNTAINS){
    if (f.x === tx && f.y === ty) return true;
  }
  return false;
}

function isVoid(tx, ty){ return tileAt(tx, ty) === T.VOID; }

function isNearFountain(px, py){
  for (const f of FOUNTAINS){
    const dx = px - (f.x*TILE + TILE/2);
    const dy = py - (f.y*TILE + TILE/2);
    if (dx*dx + dy*dy < (TILE*1.8)*(TILE*1.8)) return true;
  }
  return false;
}

function canSpawnAt(x, y){
  if (tileAt(x, y) !== T.FLOOR) return false;
  if (forests.has(x+','+y)) return false;
  if (crumbles.has(x+','+y)) return false;
  for (const f of FOUNTAINS)
    if (Math.abs(f.x - x) <= 2 && Math.abs(f.y - y) <= 2) return false;
  for (const po of PORTALS)
    if (Math.abs(po.a.x - x*TILE - TILE/2) < TILE*1.5 &&
        Math.abs(po.a.y - y*TILE - TILE/2) < TILE*1.5) return false;
  return true;
}

function generateSpawnPoints(){
  const points = [];
  for (let y = 7; y <= 13; y++)
    for (let x = 6; x <= 33; x++)
      if (canSpawnAt(x, y)) points.push({x, y});
  for (let y = 1; y <= 4; y++){
    for (let x = 3; x <= 5; x++) if (canSpawnAt(x, y)) points.push({x, y});
    for (let x = 34; x <= 36; x++) if (canSpawnAt(x, y)) points.push({x, y});
  }
  for (let y = 16; y <= 20; y++){
    for (let x = 3; x <= 5; x++) if (canSpawnAt(x, y)) points.push({x, y});
    for (let x = 34; x <= 36; x++) if (canSpawnAt(x, y)) points.push({x, y});
  }
  return points;
}

function buildSpawnAssignments(){
  const numPlayers = gameConfig.teams * gameConfig.perTeam;
  const pool = generateSpawnPoints();
  for (let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const chosen = [];
  const minDist = 8;
  for (const p of pool){
    let ok = true;
    for (const c of chosen){
      const md = Math.abs(c.x - p.x) + Math.abs(c.y - p.y);
      if (md < minDist){ ok = false; break; }
    }
    if (ok){ chosen.push(p); if (chosen.length >= numPlayers) break; }
  }
  while (chosen.length < numPlayers){
    let best = null, bestScore = -1;
    for (const p of pool){
      if (chosen.some(c => c.x === p.x && c.y === p.y)) continue;
      let minD = Infinity;
      for (const c of chosen){
        const d = Math.abs(c.x - p.x) + Math.abs(c.y - p.y);
        if (d < minD) minD = d;
      }
      if (minD > bestScore){ bestScore = minD; best = p; }
    }
    if (best) chosen.push(best); else break;
  }
  spawnAssignments = new Array(numPlayers);
  for (let i = 0; i < gameConfig.perTeam; i++){
    for (let t = 0; t < gameConfig.teams; t++){
      const idx = t * gameConfig.perTeam + i;
      if (idx >= numPlayers) continue;
      const pos = chosen[idx];
      if (pos) spawnAssignments[idx] = { x: pos.x*TILE + TILE/2, y: pos.y*TILE + TILE/2 };
    }
  }
  for (let i = 0; i < numPlayers; i++){
    if (!spawnAssignments[i]) spawnAssignments[i] = { x: 20*TILE, y: 10*TILE };
  }
}

function collideMove(e){
  e.x += e.vx;
  const y1 = Math.floor(e.y/TILE), y2 = Math.floor((e.y+e.h-1)/TILE);
  if (e.vx > 0){
    const tx = Math.floor((e.x+e.w-1)/TILE);
    for (let ty = y1; ty <= y2; ty++)
      if (isBlocking(tx,ty)){ e.x = tx*TILE - e.w; e.vx = 0; break; }
  } else if (e.vx < 0){
    const tx = Math.floor(e.x/TILE);
    for (let ty = y1; ty <= y2; ty++)
      if (isBlocking(tx,ty)){ e.x = (tx+1)*TILE; e.vx = 0; break; }
  }
  e.y += e.vy;
  const x1 = Math.floor(e.x/TILE), x2 = Math.floor((e.x+e.w-1)/TILE);
  if (e.vy > 0){
    const ty = Math.floor((e.y+e.h-1)/TILE);
    for (let tx = x1; tx <= x2; tx++)
      if (isBlocking(tx,ty)){ e.y = ty*TILE - e.h; e.vy = 0; break; }
  } else if (e.vy < 0){
    const ty = Math.floor(e.y/TILE);
    for (let tx = x1; tx <= x2; tx++)
      if (isBlocking(tx,ty)){ e.y = (ty+1)*TILE; e.vy = 0; break; }
  }
}
