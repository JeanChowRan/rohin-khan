/* ============ 快照（游戏内同步） ============ */
function makeSnapshot(){
  return {
    t: worldTime, timeLeft: gameState.timeLeft, ended: gameState.ended,
    protectionLeft: gameState.protectionLeft, gateOpen,
    players: players.map(p => ({
      x:p.x, y:p.y, vx:p.vx, vy:p.vy, facing:p.facing, aimAngle:p.aimAngle,
      dead:p.dead, deadTimer:p.deadTimer, rescueTimer:p.rescueTimer,
      rescuable:p.rescuable, deathReason:p.deathReason,
      onFire:p.onFire, frozen:p.frozen, arrows:p.arrows, hp:p.hp,
      kills:p.kills, deaths:p.deaths, charId:p.charId, team:p.team,
      skill:p.skill ? { type:p.skill.type, timer:p.skill.timer } : null,
      hurtFlash:p.hurtFlash, dashTime:p.dashTime, swordTime:p.swordTime,
      charging:p.charging, chargeTime:p.chargeTime, fallTimer:p.fallTimer
    })),
    arrows: arrows.map(a => ({
      x:a.x, y:a.y, vx:a.vx, vy:a.vy, angle:a.angle, speed:a.speed, curve:a.curve,
      onFire:a.onFire, onIce:a.onIce, stuck:a.stuck, owner:a.owner, life:a.life,
      trail:a.trail.slice(-5)
    })),
    books: books.map(b => ({ x:b.x, y:b.y, type:b.type, life:b.life, bob:b.bob })),
    particles: particles.slice(0, 30).map(p => ({
      x:p.x, y:p.y, vx:p.vx, vy:p.vy, life:p.life, maxLife:p.maxLife, color:p.color, size:p.size
    }))
  };
}
function applySnapshot(s){
  worldTime = s.t;
  gameState.timeLeft = s.timeLeft;
  gameState.protectionLeft = s.protectionLeft;
  gateOpen = s.gateOpen;
  if (s.protectionLeft > 0){
    document.getElementById('protectOverlay').classList.remove('hidden');
    document.getElementById('protectTime').textContent = Math.ceil(s.protectionLeft / 60);
  } else document.getElementById('protectOverlay').classList.add('hidden');
  for (let i = 0; i < s.players.length && i < players.length; i++){
    const src = s.players[i], dst = players[i];
    if (i === myIndex){
      const dx = src.x - dst.x, dy = src.y - dst.y;
      if (Math.hypot(dx, dy) > 80){ dst.x = src.x; dst.y = src.y; }
      else { dst.x += dx * 0.18; dst.y += dy * 0.18; }
    } else { dst.x = src.x; dst.y = src.y; }
    dst.vx = src.vx; dst.vy = src.vy; dst.facing = src.facing;
    dst.aimAngle = src.aimAngle || 0;
    dst.dead = src.dead; dst.deadTimer = src.deadTimer; dst.rescueTimer = src.rescueTimer || 0;
    dst.rescuable = src.rescuable; dst.deathReason = src.deathReason;
    dst.onFire = src.onFire; dst.frozen = src.frozen;
    dst.arrows = src.arrows; dst.hp = src.hp;
    dst.kills = src.kills; dst.deaths = src.deaths;
    dst.charId = src.charId || dst.charId;
    dst.skill = src.skill ? { type:src.skill.type, timer:src.skill.timer } : null;
    dst.hurtFlash = src.hurtFlash; dst.dashTime = src.dashTime;
    dst.swordTime = src.swordTime;
    dst.charging = src.charging; dst.chargeTime = src.chargeTime;
    dst.fallTimer = src.fallTimer || 0;
  }
  arrows = s.arrows.map(a => ({ ...a, trail: a.trail || [] }));
  books = s.books.map(b => ({ ...b }));
  particles = s.particles.map(p => ({ ...p }));
  if (s.ended && !gameState.ended){ gameState.ended = true; endGame(); }
}

/* ============ 主循环 ============ */
let lastTime = 0, acc = 0;
const STEP = 1000/60;
function loop(now){
  requestAnimationFrame(loop);
  if (!document.getElementById('screen-game').classList.contains('active')) return;
  if (!players.length) return;
  const dt = Math.min(now - lastTime, 100);
  lastTime = now;
  acc += dt;
  let iter = 0;
  while (acc >= STEP && iter < 4){
    acc -= STEP; iter++;
    if (!gameState.ended){
      if (isHostRoom){
        for (const p of players){
          if (p.index === myIndex){
            const inp = readInputs();
            p.ax = inp.ax; p.ay = inp.ay; p.inputs = inp;
          } else if (p.isAI) updateAI(p);
          else {
            p.ax = remoteInputs.ax || 0; p.ay = remoteInputs.ay || 0;
            p.inputs = remoteInputs;
          }
        }
        updateTerrain();
        for (const p of players) updatePlayer(p);
        updateArrows();
        checkGameEnd();
        if (clientConns.length) {
          const snap = makeSnapshot();
          for (const x of clientConns){
            try { x.conn.send({ type:'snap', snap }); } catch(e){}
          }
        }
      } else {
        // 客户端：只发输入，等快照
        if (conn && conn.open){
          try { conn.send({ type:'input', inputs: readInputs() }); } catch(e){}
        }
        // 本地粒子
        for (let i = particles.length-1; i >= 0; i--){
          const pt = particles[i];
          pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.05; pt.life--;
          if (pt.life <= 0) particles.splice(i,1);
        }
        for (const b of books) b.bob += 0.08;
        worldTime++;
      }
    }
  }
  updateCamera();
  render();
  updateHUD();
}

/* ============ 网络消息路由（客户端） ============ */
// 已在 joinRoomByCode 中处理，这里补充对 snap 的接收
function setupClientSnapHandler(){
  if (!conn) return;
  conn.on('data', d => {
    if (d.type === 'snap') applySnapshot(d.snap);
  });
}

/* ============ 屏幕切换 ============ */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ============ 事件绑定 ============ */
document.getElementById('joinCode').addEventListener('keydown', e => {
  if (e.key === 'Enter') joinRoomByCode();
});
document.getElementById('joinCode').addEventListener('input', e => {
  e.target.value = e.target.value.toUpperCase();
});

/* ============ 启动 ============ */
loadSprites();
parseMap();
requestAnimationFrame(loop);
</script>
</body>
</html>
