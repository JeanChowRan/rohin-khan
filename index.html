<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>箭回旋 · 天空版</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow:hidden;touch-action:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
background:#05070f;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.screen{display:none;width:100%;max-width:940px}
.screen.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:rgba(30,41,59,.9);backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.12);
border-radius:18px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.5);max-width:500px;margin:0 auto}
h1{font-size:26px;margin-bottom:6px;text-align:center;letter-spacing:3px}
h2{font-size:11px;margin-bottom:22px;text-align:center;color:#64748b;font-weight:400;letter-spacing:4px}
h3{font-size:13px;color:#94a3b8;margin:16px 0 8px;text-align:center;font-weight:500}
button{font-family:inherit;font-size:15px;padding:13px 20px;border:none;border-radius:11px;
background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;cursor:pointer;transition:all .18s;
width:100%;margin-bottom:10px;font-weight:600;letter-spacing:.5px}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px rgba(59,130,246,.35)}
button:disabled{opacity:.4;cursor:not-allowed}
button.secondary{background:#334155}
button.secondary:hover:not(:disabled){background:#475569}
input{font-family:inherit;font-size:15px;padding:13px;border-radius:11px;border:1px solid #334155;
background:#0f172a;color:#e2e8f0;width:100%;margin-bottom:10px;text-transform:uppercase}
input:focus{outline:none;border-color:#3b82f6}
input::placeholder{color:#475569;text-transform:none}
.row{display:flex;gap:10px}
.row>input{flex:2;margin-bottom:0}
.row>button{flex:1;margin-bottom:0}
.room-code{font-size:36px;font-weight:800;letter-spacing:10px;text-align:center;padding:22px;
background:#0f172a;border:1px dashed #334155;border-radius:12px;margin-bottom:14px;
color:#60a5fa;font-family:'Courier New',monospace;text-indent:10px}
.hud{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;
background:rgba(15,23,42,.92);border-radius:12px;margin-bottom:8px;font-size:12px;gap:8px;flex-wrap:wrap}
.hud-item{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.timer{font-family:'Courier New',monospace;font-size:16px;font-weight:800;color:#fbbf24;
padding:4px 12px;background:#0f172a;border-radius:8px;letter-spacing:2px}
.timer.warn{color:#ef4444;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
canvas{display:block;width:100%;height:auto;border-radius:14px;
box-shadow:0 12px 40px rgba(0,0,0,.6);background:#05070f}
.hidden{display:none!important}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
background:#1e293b;border:1px solid #334155;padding:12px 24px;border-radius:10px;font-size:14px;
opacity:0;pointer-events:none;transition:all .3s;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.legend{font-size:11px;color:#64748b;text-align:center;line-height:1.8;margin-top:10px}

/* 设置控件 */
.setting-row{margin-bottom:18px}
.setting-row>label{display:block;font-size:13px;color:#94a3b8;margin-bottom:8px;
text-align:center;font-weight:500;letter-spacing:1px}
.btn-group{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.btn-group button{flex:1;min-width:52px;margin:0;padding:10px 8px;font-size:13px;
background:#1e293b;border:1.5px solid transparent;color:#94a3b8;font-weight:600}
.btn-group button.active{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;
border-color:#60a5fa;box-shadow:0 4px 14px rgba(59,130,246,.4)}
.btn-group button:hover:not(.active){background:#334155;color:#cbd5e1;transform:none;box-shadow:none}
.team-preview{display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.team-chip{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:8px;
background:#0f172a;font-size:12px;border:1px solid #1e293b}
.team-chip .dot{width:8px;height:8px}

/* 结算弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);
display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}
.modal.active{display:flex;animation:fadeIn .3s ease}
.modal-content{background:linear-gradient(160deg,#1e293b,#0f172a);
border:2px solid rgba(148,163,184,.2);border-radius:20px;padding:28px 24px;
max-width:460px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.8);max-height:90vh;overflow-y:auto}
.winner-title{font-size:24px;font-weight:800;text-align:center;margin-bottom:4px;letter-spacing:2px}
.winner-sub{font-size:13px;text-align:center;color:#94a3b8;margin-bottom:20px}
.stats-list{background:#0a0e1a;border-radius:12px;padding:14px;margin-bottom:16px}
.stat-row{display:flex;align-items:center;gap:10px;padding:8px 0;
border-bottom:1px solid #1e293b;font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-row.winner-row{background:rgba(59,130,246,.1);margin:0 -8px;padding:8px;border-radius:8px}
.stat-bar{flex:1;height:6px;background:#1e293b;border-radius:3px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:3px;transition:width .6s}
.mvp-box{background:linear-gradient(135deg,rgba(250,204,21,.15),rgba(234,179,8,.08));
border:1px solid rgba(250,204,21,.35);border-radius:12px;padding:14px;margin-bottom:16px;
display:flex;align-items:center;gap:12px}
.mvp-icon{font-size:28px;filter:drop-shadow(0 0 10px rgba(250,204,21,.6))}
.mvp-info{flex:1}
.mvp-name{font-size:15px;font-weight:700;color:#fbbf24;margin-bottom:2px}
.mvp-stats{font-size:12px;color:#94a3b8}

/* 移动端控制 */
.mobile-ui{position:fixed;inset:0;pointer-events:none;display:none;z-index:100}
.mobile-ui.active{display:block}
.dpad{position:absolute;left:max(4vw,16px);bottom:max(4vh,16px);
width:min(34vw,170px);height:min(34vw,170px);pointer-events:auto}
.dpad button{position:absolute;width:34%;height:34%;border:none;border-radius:14px;
background:rgba(59,130,246,.35);border:1.5px solid rgba(96,165,250,.55);
color:#e0f2fe;font-size:22px;padding:0;margin:0;font-weight:700;
backdrop-filter:blur(4px);transition:all .08s;line-height:1;min-width:auto}
.dpad button.pressed,.dpad button:active{background:rgba(59,130,246,.65);transform:scale(.94)}
.dpad .up{left:33%;top:0}
.dpad .down{left:33%;bottom:0}
.dpad .left{left:0;top:33%}
.dpad .right{right:0;top:33%}
.actions{position:absolute;right:max(4vw,16px);bottom:max(4vh,16px);
width:min(38vw,190px);height:min(38vw,190px);pointer-events:auto}
.actions button{position:absolute;width:48%;height:48%;border-radius:50%;
border:2px solid rgba(255,255,255,.3);color:#fff;font-size:15px;font-weight:800;
padding:0;margin:0;backdrop-filter:blur(4px);transition:all .08s;min-width:auto}
.actions button.pressed,.actions button:active{transform:scale(.9);filter:brightness(1.4)}
.actions .jump{right:26%;top:0;background:rgba(34,197,94,.5)}
.actions .dash{left:0;top:26%;background:rgba(59,130,246,.5)}
.actions .sword{right:0;top:26%;background:rgba(234,179,8,.55)}
.actions .bow{right:26%;bottom:0;background:rgba(239,68,68,.5)}

.skill-banner{position:fixed;top:26%;left:50%;padding:14px 28px;
background:rgba(15,23,42,.96);border:2px solid #60a5fa;border-radius:14px;
font-size:17px;font-weight:800;letter-spacing:2px;color:#60a5fa;
pointer-events:none;z-index:1000;opacity:0;transform:translate(-50%,-50%) scale(.7)}
@keyframes skillPop{
0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
30%,80%{opacity:1;transform:translate(-50%,-50%) scale(1)}
100%{opacity:0;transform:translate(-50%,-50%) scale(1)}
}
@media (max-width:900px){body{padding:6px}.card{padding:18px}h1{font-size:22px}}
</style>
</head>
<body>

<!-- 设置界面 -->
<div class="screen active" id="screen-setup">
  <div class="card">
    <h1>🏹 箭回旋</h1>
    <h2>SKY ARENA · 设置</h2>

    <div class="setting-row">
      <label>阵营数量</label>
      <div class="btn-group" id="grpTeams">
        <button data-val="2" class="active">2</button>
        <button data-val="3">3</button>
        <button data-val="4">4</button>
      </div>
    </div>

    <div class="setting-row">
      <label>每阵营角色数</label>
      <div class="btn-group" id="grpPer">
        <button data-val="1">1</button>
        <button data-val="2" class="active">2</button>
        <button data-val="3">3</button>
        <button data-val="4">4</button>
        <button data-val="5">5</button>
      </div>
    </div>

    <div class="setting-row">
      <label>AI 难度</label>
      <div class="btn-group" id="grpAI">
        <button data-val="easy">简单</button>
        <button data-val="normal" class="active">一般</button>
        <button data-val="hard">困难</button>
        <button data-val="hell">地狱</button>
      </div>
    </div>

    <div class="team-preview" id="teamPreview"></div>

    <button onclick="openCreateRoom()" style="margin-top:16px">🌐 创建房间</button>

    <div class="row" style="margin-top:10px">
      <input id="joinCode" placeholder="输入 6 位房间码" maxlength="6" autocomplete="off">
      <button class="secondary" onclick="joinRoom(document.getElementById('joinCode').value)">加入</button>
    </div>

    <div class="legend">
      每局 5 分钟 · 存活人数最多的阵营获胜 · 击杀最多的玩家为 MVP<br>
      射死/压死可救 · 烧死/坠落永久淘汰
    </div>
  </div>
</div>

<!-- 等待室 -->
<div class="screen" id="screen-waiting">
  <div class="card">
    <h3>房间码 · 分享给队友</h3>
    <div class="room-code" id="roomCodeDisplay">------</div>
    <button class="secondary" onclick="copyRoomCode()">📋 复制房间码</button>
    <div style="margin-top:14px;font-size:13px;color:#94a3b8;text-align:center" id="waitStatus">
      等待队友加入（或直接开始 AI 对战）…
    </div>
    <button onclick="startGame()" style="margin-top:16px">▶ 开始游戏</button>
    <button class="secondary" onclick="leaveRoom()">返回设置</button>
  </div>
</div>

<!-- 游戏 -->
<div class="screen" id="screen-game">
  <div class="hud" id="hud"></div>
  <canvas id="canvas" width="896" height="504"></canvas>
  <button class="secondary" onclick="leaveRoom()" style="margin-top:8px">退出游戏</button>
</div>

<!-- 结算弹窗 -->
<div class="modal" id="resultModal">
  <div class="modal-content">
    <div class="winner-title" id="winnerTitle">阵营获胜！</div>
    <div class="winner-sub" id="winnerSub"></div>
    <div class="stats-list" id="statsList"></div>
    <div class="mvp-box" id="mvpBox">
      <div class="mvp-icon">⭐</div>
      <div class="mvp-info">
        <div class="mvp-name" id="mvpName">—</div>
        <div class="mvp-stats" id="mvpStats">—</div>
      </div>
    </div>
    <button onclick="rematch()">🔄 再来一局</button>
    <button class="secondary" onclick="backToSetup()">⚙ 返回设置</button>
  </div>
</div>

<div class="skill-banner hidden" id="skillBanner"></div>
<div class="toast" id="toast"></div>

<!-- 移动端控制 -->
<div class="mobile-ui" id="mobileUI">
  <div class="dpad">
    <button class="up" data-key="up">▲</button>
    <button class="left" data-key="left">◀</button>
    <button class="right" data-key="right">▶</button>
    <button class="down" data-key="down">▼</button>
  </div>
  <div class="actions">
    <button class="jump" data-key="jump">跳</button>
    <button class="dash" data-key="dash">冲</button>
    <button class="sword" data-key="sword">剑</button>
    <button class="bow" data-key="bow">弓</button>
  </div>
</div>

/* ================================================================
   世界状态
   ================================================================ */
let baseTiles = [];
let crumbles = new Map();
let bridges = [];
let movers = [];
let players = [];
let arrows = [];
let books = [];
let particles = [];
let clouds = [];
let stars = [];
let worldTime = 0;
let bookTimer = 240;

/* 游戏配置与状态 */
let gameConfig = { teams: 2, perTeam: 2, aiDiff: 'normal' };
let gameState = { phase: 'setup', timeLeft: ROUND_FRAMES, ended: false };
let myIndex = 0;
let myTeam = 0;

/* ================================================================
   地图解析
   ================================================================ */
function parseMap(){
  baseTiles = []; crumbles = new Map(); bridges = []; movers = [];
  for (let y = 0; y < MAP_H; y++){
    const row = [];
    for (let x = 0; x < MAP_W; x++){
      const ch = MAP_STR[y][x];
      let t = T.EMPTY;
      if (ch === '#') t = T.STONE;
      else if (ch === 'P') t = T.PLATFORM;
      else if (ch === 'C'){ t = T.CRYSTAL; crumbles.set(x+','+y,{gone:false,timer:0,respawn:0}); }
      row.push(t);
    }
    baseTiles.push(row);
  }
  for (let y = 0; y < MAP_H; y++){
    let start = -1;
    for (let x = 0; x <= MAP_W; x++){
      const isB = x < MAP_W && MAP_STR[y][x] === 'B';
      if (isB && start < 0) start = x;
      if (!isB && start >= 0){
        bridges.push({ ox:start, oy:y, w:x-start, h:1, range:2, speed:0.014,
          t:Math.random()*6.28, px:start*TILE, py:y*TILE, _dx:0 });
        start = -1;
      }
    }
  }
  for (let y = 0; y < MAP_H; y++){
    for (let x = 0; x < MAP_W; x++){
      const ch = MAP_STR[y][x];
      if (ch === 'H') movers.push({ kind:'hwall', ox:x, oy:y, w:1, h:3,
        range:2, speed:0.012, t:Math.random()*6.28, px:x*TILE, py:y*TILE });
      else if (ch === 'V') movers.push({ kind:'vwall', ox:x, oy:y, w:3, h:1,
        range:1, speed:0.014, t:Math.random()*6.28, px:x*TILE, py:y*TILE });
    }
  }
}

function isSolid(tx, ty){
  if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return true;
  const t = baseTiles[ty][tx];
  if (t === T.STONE || t === T.PLATFORM) return true;
  if (t === T.CRYSTAL){
    const c = crumbles.get(tx+','+ty);
    return c && !c.gone;
  }
  const tpx = tx*TILE, tpy = ty*TILE;
  for (const b of bridges){
    if (tpx+TILE > b.px && tpx < b.px+b.w*TILE &&
        tpy+TILE > b.py && tpy < b.py+b.h*TILE) return true;
  }
  return false;
}

/* ================================================================
   碰撞
   ================================================================ */
function collideX(e){
  const y1 = Math.floor(e.y/TILE), y2 = Math.floor((e.y+e.h-1)/TILE);
  if (e.vx > 0){
    const tx = Math.floor((e.x+e.w-1)/TILE);
    for (let ty = y1; ty <= y2; ty++)
      if (isSolid(tx,ty)){ e.x = tx*TILE-e.w; e.vx = 0; return true; }
  } else if (e.vx < 0){
    const tx = Math.floor(e.x/TILE);
    for (let ty = y1; ty <= y2; ty++)
      if (isSolid(tx,ty)){ e.x = (tx+1)*TILE; e.vx = 0; return true; }
  }
  return false;
}
function collideY(e){
  const x1 = Math.floor(e.x/TILE), x2 = Math.floor((e.x+e.w-1)/TILE);
  e.onGround = false;
  if (e.vy > 0){
    const ty = Math.floor((e.y+e.h-1)/TILE);
    for (let tx = x1; tx <= x2; tx++)
      if (isSolid(tx,ty)){ e.y = ty*TILE-e.h; e.vy = 0; e.onGround = true; return true; }
  } else if (e.vy < 0){
    const ty = Math.floor(e.y/TILE);
    for (let tx = x1; tx <= x2; tx++)
      if (isSolid(tx,ty)){ e.y = (ty+1)*TILE; e.vy = 0; return true; }
  }
  return false;
}

/* ================================================================
   玩家
   ================================================================ */
function teamSpawn(team, pos){
  const positions = [
    { x:2,  y:15 }, { x:29, y:15 },
    { x:2,  y:14 }, { x:29, y:14 },
  ];
  const p = positions[team % 4];
  const jitter = pos * 24;
  const dir = (team % 2 === 0) ? 1 : -1;
  return { x: (p.x*TILE) + dir*jitter, y: p.y*TILE - 26 };
}

function makePlayer(team, teamPos, index, isAI, difficulty){
  const sp = teamSpawn(team, teamPos);
  return {
    team, teamPos, index, isAI: !!isAI,
    aiDifficulty: difficulty || 'normal',
    x:sp.x, y:sp.y, w:18, h:26,
    vx:0, vy:0, facing: team % 2 === 0 ? 1 : -1,
    onGround:false, jumps:0, maxJumps:2,
    dashTime:0, dashCd:0, swordTime:0, swordCd:0,
    bowCd:0, charging:false, chargeTime:0, aimAngle:0,
    arrows:ARROW_MAX, hp:3, maxHp:3,
    kills:0, deaths:0, ignitedBy:null,
    dead:false, deadTimer:0, rescueTimer:0,
    rescuable:true, deathReason:'',
    onFire:0, skill:null, hurtFlash:0,
    spawnX:sp.x, spawnY:sp.y,
    inputs:{ left:0,right:0,up:0,down:0,jump:0,dash:0,sword:0,bow:0 },
    prevJump:0, prevDash:0, prevSword:0, prevBow:0,
    _aiBowCd:0, _aiJumpCd:0, _aiCharging:false, _aiThinkCd:0,
  };
}

function buildPlayers(){
  players = [];
  let idx = 0;
  const humanIndices = new Set();
  // 房主固定索引 0；加入者固定索引 = perTeam（阵营 1 的第 0 位）
  humanIndices.add(0);
  if (!isHost) {
    // 加入者视角
  } else if (remoteConnected) {
    humanIndices.add(gameConfig.perTeam);
  }

  for (let t = 0; t < gameConfig.teams; t++){
    for (let i = 0; i < gameConfig.perTeam; i++){
      const isAI = !humanIndices.has(idx);
      players.push(makePlayer(t, i, idx, isAI, gameConfig.aiDiff));
      idx++;
    }
  }
  // 设置 myIndex
  if (isHost) myIndex = 0;
  else myIndex = gameConfig.perTeam;
  myTeam = players[myIndex] ? players[myIndex].team : 0;
  players[myIndex].isAI = false;
}

function resetWorld(){
  parseMap();
  arrows = []; books = []; particles = [];
  worldTime = 0; bookTimer = 240;
  clouds = []; stars = [];
  for (let i = 0; i < 12; i++)
    clouds.push({ x:Math.random()*W, y:20+Math.random()*220,
      s:0.5+Math.random()*1.1, sp:0.06+Math.random()*0.12 });
  for (let i = 0; i < 70; i++)
    stars.push({ x:Math.random()*W, y:Math.random()*H*0.75,
      r:0.5+Math.random()*1.3, tw:Math.random()*6.28 });
  buildPlayers();
  gameState.timeLeft = ROUND_FRAMES;
  gameState.ended = false;
}

/* ================================================================
   死亡 / 击杀
   ================================================================ */
function killPlayer(p, reason, killer){
  if (p.dead) return;
  p.dead = true; p.deadTimer = 0; p.rescueTimer = 0;
  p.onFire = 0; p.skill = null; p.vx = 0; p.vy = 0;
  p.charging = false; p.chargeTime = 0; p.aimAngle = 0;
  p.rescuable = RESCUE_RULES[reason] !== false;
  p.deathReason = REASON_TEXT[reason] || '死亡';
  p.deaths++;
  // 击杀归属：箭矢或火焰
  if (killer !== undefined && killer !== null){
    const k = players[killer];
    if (k && k.team !== p.team) k.kills++;
  }
  const col = TEAMS[p.team].hex;
  spawnParticles(p.x+p.w/2, p.y+p.h/2, p.rescuable ? col : '#64748b',
    p.rescuable ? 20 : 34);
}

/* ================================================================
   粒子
   ================================================================ */
function spawnParticles(x, y, color, n){
  for (let i = 0; i < n; i++){
    particles.push({
      x, y, vx:(Math.random()-0.5)*7, vy:(Math.random()-0.5)*7-2,
      life:30+Math.random()*25, maxLife:55, color, size:2+Math.random()*3
    });
  }
}

/* ================================================================
   箭矢
   ================================================================ */
function fireArrow(p, worldAngle, power, onFire){
  const speed = 5.5 + power*9.5;
  const curve = -(0.03 - power*0.022);
  arrows.push({
    x:p.x+p.w/2, y:p.y+p.h/2-2,
    angle:worldAngle, speed, curve,
    vx:Math.cos(worldAngle)*speed, vy:Math.sin(worldAngle)*speed,
    owner:p.index, onFire:!!onFire,
    stuck:false, life:800, trail:[]
  });
}

function updateArrows(){
  for (let i = arrows.length-1; i >= 0; i--){
    const a = arrows[i];
    if (a.stuck){
      if (worldTime % 40 === 0)
        particles.push({ x:a.x, y:a.y, vx:0, vy:-0.8,
          life:20, maxLife:20, color:'#fbbf24', size:2 });
      continue;
    }
    a.life--;
    if (a.life <= 0){ arrows.splice(i,1); continue; }
    a.angle += a.curve;
    a.vx = Math.cos(a.angle)*a.speed;
    a.vy = Math.sin(a.angle)*a.speed;
    a.x += a.vx; a.y += a.vy;
    a.trail.push({ x:a.x, y:a.y });
    if (a.trail.length > 10) a.trail.shift();
    if (a.onFire && worldTime % 2 === 0){
      particles.push({ x:a.x, y:a.y, vx:(Math.random()-0.5)*1.5, vy:-Math.random()*1.5,
        life:16, maxLife:16, color:'#fb923c', size:2+Math.random()*2 });
    }
    if (a.x < -50 || a.x > W+50 || a.y > H+100){ arrows.splice(i,1); continue; }
    const tx = Math.floor(a.x/TILE), ty = Math.floor(a.y/TILE);
    if (isSolid(tx,ty)){
      a.stuck = true;
      a.x -= Math.cos(a.angle)*4; a.y -= Math.sin(a.angle)*4;
      spawnParticles(a.x, a.y, a.onFire ? '#fb923c' : '#94a3b8', 5);
      continue;
    }
    const ownerTeam = players[a.owner] ? players[a.owner].team : -1;
    for (const p of players){
      if (p.index === a.owner || p.dead) continue;
      if (p.team === ownerTeam) continue;
      if (p.hurtFlash > 0 && !a.onFire) continue;
      if (a.x > p.x && a.x < p.x+p.w && a.y > p.y && a.y < p.y+p.h){
        if (a.onFire){
          p.onFire = BURN_FRAMES;
          p.ignitedBy = a.owner;
          p.hurtFlash = 20;
        } else {
          p.hp--;
          p.vx += Math.sign(a.vx)*4; p.vy = -3;
          p.hurtFlash = 30;
          if (p.hp <= 0) killPlayer(p, 'arrow', a.owner);
        }
        spawnParticles(a.x, a.y, '#f87171', 8);
        arrows.splice(i,1);
        break;
      }
    }
    // 剑格挡
    for (const p of players){
      if (p.dead || p.swordTime <= 0) continue;
      const sx = p.x + (p.facing > 0 ? p.w : -22);
      const sy = p.y + 4;
      if (a.x > sx && a.x < sx+22 && a.y > sy && a.y < sy+20){
        a.angle = Math.PI - a.angle; a.curve *= -1;
        a.owner = p.index; a.speed *= 1.15;
        a.vx = Math.cos(a.angle)*a.speed;
        a.vy = Math.sin(a.angle)*a.speed;
        spawnParticles(a.x, a.y, '#facc15', 6);
      }
    }
  }
}

/* ================================================================
   技能书
   ================================================================ */
function spawnBook(){
  for (let attempt = 0; attempt < 80; attempt++){
    const tx = 2+Math.floor(Math.random()*(MAP_W-4));
    const ty = 2+Math.floor(Math.random()*(MAP_H-5));
    if (!isSolid(tx,ty) && !isSolid(tx,ty+1) && baseTiles[ty][tx] !== T.CRYSTAL){
      const types = BOOK_TYPES.filter(k => k !== 'burn' || Math.random() < 0.25);
      const type = types[Math.floor(Math.random()*types.length)];
      books.push({ x:tx*TILE+TILE/2, y:ty*TILE+TILE/2,
        type, life:1200, bob:Math.random()*Math.PI*2 });
      return;
    }
  }
}

/* ================================================================
   玩家更新
   ================================================================ */
function updatePlayer(p){
  if (p.dead){
    p.deadTimer++;
    if (!p.rescuable) return;
    // 找同阵营队友
    for (const other of players){
      if (other.index === p.index || other.dead || other.team !== p.team) continue;
      const overlap = p.x < other.x+other.w && p.x+p.w > other.x &&
                      p.y < other.y+other.h && p.y+p.h > other.y;
      if (overlap){
        p.rescueTimer++;
        if (p.rescueTimer >= RESCUE_FRAMES){
          p.dead = false; p.rescueTimer = 0;
          p.arrows = ARROW_MAX; p.hp = p.maxHp;
          p.x = p.spawnX; p.y = p.spawnY;
          p.vx = 0; p.vy = 0;
          p.ignitedBy = null;
          spawnParticles(p.x+p.w/2, p.y+p.h/2, '#4ade80', 24);
        }
        return;
      }
    }
    p.rescueTimer = 0;
    return;
  }

  if (p.onFire > 0){
    p.onFire--;
    if (p.onFire <= 0){
      killPlayer(p, 'burn', p.ignitedBy);
      return;
    }
    if (worldTime % 5 === 0)
      spawnParticles(p.x+p.w/2, p.y+p.h/2, '#fb923c', 1);
  }

  if (p.skill && p.skill.type !== 'burn'){
    p.skill.timer--;
    if (p.skill.timer <= 0) p.skill = null;
  }
  if (p.hurtFlash > 0) p.hurtFlash--;
  if (p.dashCd > 0) p.dashCd--;
  if (p.swordCd > 0) p.swordCd--;
  if (p.bowCd > 0) p.bowCd--;
  if (p.swordTime > 0) p.swordTime--;

  const inp = p.inputs;
  let ax = 0;
  if (inp.left) ax -= 1;
  if (inp.right) ax += 1;
  if (p.skill && p.skill.type === 'swap') ax = -ax;
  if (ax !== 0) p.facing = ax;

  p.vy += GRAVITY;
  if (p.vy > MAX_FALL) p.vy = MAX_FALL;

  if (inp.dash && !p.prevDash && p.dashCd <= 0 && p.dashTime <= 0){
    p.dashTime = DASH_TIME; p.dashCd = DASH_CD;
    spawnParticles(p.x+p.w/2, p.y+p.h/2, '#60a5fa', 8);
  }
  if (p.dashTime > 0){
    p.dashTime--;
    p.vx = p.facing * DASH_SPEED;
  } else {
    const target = ax * MOVE_SPEED;
    p.vx += (target - p.vx) * 0.45;
    if (Math.abs(p.vx) < 0.15) p.vx = 0;
  }

  const jumpPressed = inp.jump && !p.prevJump;
  if (jumpPressed){
    if (p.onGround){
      p.vy = JUMP_V; p.jumps = 1;
      if (p.dashTime > 0) p.vx = p.facing * DASH_SPEED * 1.2;
    } else if (p.jumps < p.maxJumps){
      p.vy = JUMP_V * 0.88; p.jumps++;
    }
  }
  if (p.onGround) p.jumps = 0;

  if (inp.sword && !p.prevSword && p.swordCd <= 0){
    p.swordTime = 14; p.swordCd = 24;
  }

  // 射箭
  const skillType = p.skill ? p.skill.type : null;
  if (inp.bow){
    if (!p.charging){ p.charging = true; p.chargeTime = 0; p.aimAngle = 0; }
    p.chargeTime = Math.min(p.chargeTime + 1, 60);
    if (inp.up) p.aimAngle -= 0.024;
    if (inp.down) p.aimAngle += 0.024;
    p.aimAngle = Math.max(-1.05, Math.min(0.9, p.aimAngle));
  } else if (p.charging){
    const power = p.chargeTime / 60;
    const worldAngle = p.facing > 0 ? p.aimAngle : Math.PI + p.aimAngle;
    const onFire = skillType === 'fire';
    if (p.arrows > 0){
      p.arrows--;
      if (skillType === 'multi'){
        for (let k = -2; k <= 2; k++) fireArrow(p, worldAngle + k*0.14, power, onFire);
      } else if (skillType === 'double'){
        fireArrow(p, worldAngle - 0.06, power, onFire);
        fireArrow(p, worldAngle + 0.06, power, onFire);
      } else {
        fireArrow(p, worldAngle, power, onFire);
      }
    }
    p.charging = false; p.chargeTime = 0; p.aimAngle = 0;
  }

  p.x += p.vx; collideX(p);
  p.y += p.vy; collideY(p);

  for (const b of bridges){
    const onTop = p.x < b.px + b.w*TILE && p.x + p.w > b.px &&
                  Math.abs((p.y+p.h) - b.py) < 5 && p.vy >= 0;
    if (onTop && b._dx) p.x += b._dx;
  }
  if (p.onGround){
    const cx = Math.floor((p.x+p.w/2)/TILE);
    const cy = Math.floor((p.y+p.h)/TILE);
    const c = crumbles.get(cx+','+cy);
    if (c && !c.gone && c.timer === 0) c.timer = 1;
  }
  if (p.y > H + 60){ killPlayer(p, 'fall', null); return; }
  for (const m of movers){
    const mw = m.w*TILE, mh = m.h*TILE;
    if (p.x < m.px + mw && p.x + p.w > m.px &&
        p.y < m.py + mh && p.y + p.h > m.py){
      killPlayer(p, 'crush', null);
      return;
    }
  }
  // 捡箭
  for (let i = arrows.length-1; i >= 0; i--){
    const a = arrows[i];
    if (!a.stuck) continue;
    if (Math.abs(a.x-(p.x+p.w/2)) < 20 && Math.abs(a.y-(p.y+p.h/2)) < 20){
      if (p.arrows < ARROW_MAX){
        p.arrows++;
        spawnParticles(a.x, a.y, '#fbbf24', 5);
        arrows.splice(i,1);
      }
    }
  }
  // 捡技能书
  for (let i = books.length-1; i >= 0; i--){
    const b = books[i];
    if (p.x < b.x+14 && p.x+p.w > b.x-14 && p.y < b.y+14 && p.y+p.h > b.y-14){
      applySkill(p, b.type);
      spawnParticles(b.x, b.y, SKILLS[b.type].color, 14);
      books.splice(i,1);
    }
  }
  p.prevJump = inp.jump; p.prevDash = inp.dash;
  p.prevSword = inp.sword; p.prevBow = inp.bow;
}

function applySkill(p, type){
  const def = SKILLS[type];
  if (!def) return;
  if (type === 'burn'){
    p.onFire = BURN_FRAMES; p.skill = null;
    showSkillBanner(p.index, def.name, def.color);
    return;
  }
  p.skill = { type, timer:def.dur };
  showSkillBanner(p.index, def.name, def.color);
}

function showSkillBanner(playerIndex, skillName, skillColor){
  const el = document.getElementById('skillBanner');
  let who;
  if (playerIndex === myIndex) who = '你';
  else if (players[playerIndex] && players[playerIndex].isAI)
    who = 'AI·' + TEAMS[players[playerIndex].team].name;
  else who = '对手';
  el.textContent = `${who}吃到了「${skillName}」`;
  el.style.borderColor = skillColor;
  el.style.color = skillColor;
  el.style.boxShadow = `0 0 40px ${skillColor}80`;
  el.style.animation = 'none';
  void el.offsetHeight;
  el.style.animation = 'skillPop 2s ease forwards';
  el.classList.remove('hidden');
}

/* ================================================================
   地形更新
   ================================================================ */
function updateTerrain(){
  worldTime++;
  for (const [key, c] of crumbles){
    if (c.gone){
      c.respawn--;
      if (c.respawn <= 0){ c.gone = false; c.timer = 0; }
    } else if (c.timer > 0){
      c.timer++;
      if (c.timer > 900){
        c.gone = true; c.timer = 0; c.respawn = 900;
        const [tx, ty] = key.split(',').map(Number);
        spawnParticles(tx*TILE+TILE/2, ty*TILE+TILE/2, '#67e8f9', 14);
      }
    }
  }
  for (const b of bridges){
    const oldPx = b.px;
    b.t += b.speed;
    b.px = (b.ox + Math.sin(b.t)*b.range) * TILE;
    b._dx = b.px - oldPx;
  }
  for (const m of movers){
    m.t += m.speed;
    if (m.kind === 'hwall'){ m.px = (m.ox + Math.sin(m.t)*m.range)*TILE; m.py = m.oy*TILE; }
    else { m.px = m.ox*TILE; m.py = (m.oy + Math.sin(m.t)*m.range)*TILE; }
  }
  for (let i = particles.length-1; i >= 0; i--){
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.15;
    pt.life--;
    if (pt.life <= 0) particles.splice(i,1);
  }
  for (const c of clouds){ c.x += c.sp; if (c.x > W+100) c.x = -100; }
  bookTimer--;
  if (bookTimer <= 0 && books.length < 4){
    spawnBook();
    bookTimer = 400 + Math.random()*300;
  }
  for (let i = books.length-1; i >= 0; i--){
    books[i].life--;
    books[i].bob += 0.08;
    if (books[i].life <= 0) books.splice(i,1);
  }
}

/* ================================================================
   AI 决策（克制跳跃 + 阵营感知）
   ================================================================ */
const AI_CFG = {
  easy:   { skillRange:180, keepDist:220, accuracy:0.25, reactRange:200, jumpChance:0.002 },
  normal: { skillRange:240, keepDist:230, accuracy:0.55, reactRange:280, jumpChance:0.005 },
  hard:   { skillRange:320, keepDist:240, accuracy:0.82, reactRange:360, jumpChance:0.008 },
  hell:   { skillRange:420, keepDist:250, accuracy:0.96, reactRange:480, jumpChance:0.012 },
};

/* 判断 AI 是否真的需要跳跃 */
function aiNeedJump(ai, targetY){
  if (!ai.onGround || ai._aiJumpCd > 0) return false;

  // 目标明显在上方
  if (targetY !== null && targetY < ai.y - 30) return true;

  // 前方有墙 → 跳
  const aheadX = ai.x + (ai.facing > 0 ? ai.w + 2 : -2);
  const tx = Math.floor(aheadX / TILE);
  const feetY = Math.floor((ai.y + ai.h - 1) / TILE);
  const headY = Math.floor(ai.y / TILE);
  if (isSolid(tx, feetY) || isSolid(tx, headY)) return true;

  // 前方是缺口（脚下同层空、下方也没有地面）→ 跳
  const belowY = feetY + 1;
  const belowY2 = feetY + 2;
  if (!isSolid(tx, feetY) && !isSolid(tx, belowY) && !isSolid(tx, belowY2)
      && Math.abs(ai.vx) > 0.4) return true;

  return false;
}

function updateAI(ai){
  if (ai.dead || gameState.ended) return;
  const cfg = AI_CFG[ai.aiDifficulty] || AI_CFG.normal;
  const inp = ai.inputs;
  inp.left = inp.right = inp.up = inp.down = 0;
  inp.jump = inp.dash = inp.sword = 0;

  if (ai._aiBowCd > 0) ai._aiBowCd--;
  if (ai._aiJumpCd > 0) ai._aiJumpCd--;
  if (ai._aiThinkCd > 0) ai._aiThinkCd--;

  // 找最近的敌方（阵营不同）
  let enemy = null, enemyDist = Infinity;
  for (const p of players){
    if (p.team === ai.team || p.dead) continue;
    const d = Math.hypot(p.x - ai.x, p.y - ai.y);
    if (d < enemyDist){ enemyDist = d; enemy = p; }
  }
  // 找最近的倒下的队友（需要营救）
  let downedMate = null, mateDist = Infinity;
  for (const p of players){
    if (p.team !== ai.team || p.index === ai.index) continue;
    if (p.dead && p.rescuable){
      const d = Math.hypot(p.x - ai.x, p.y - ai.y);
      if (d < mateDist){ mateDist = d; downedMate = p; }
    }
  }
  // 找最近的技能书
  let book = null, bookDist = Infinity;
  for (const b of books){
    const d = Math.hypot(b.x - ai.x, b.y - ai.y);
    if (d < bookDist){ bookDist = d; book = b; }
  }

  // ---- 目标决策 ----
  let targetX = null, targetY = null;

  // 1) 优先救队友（如果在附近）
  if (downedMate && mateDist < 200){
    targetX = downedMate.x;
    targetY = downedMate.y;
  }
  // 2) 血量低且敌人在附近 → 逃跑
  else if (ai.hp <= 1 && enemy && enemyDist < 220){
    targetX = ai.x + Math.sign(ai.x - enemy.x) * 200;
    targetY = null;
  }
  // 3) 附近有书 → 捡书
  else if (book && bookDist < cfg.skillRange){
    targetX = book.x;
    targetY = book.y;
  }
  // 4) 和敌人交战
  else if (enemy && enemyDist < cfg.reactRange){
    if (enemyDist < 130){
      targetX = ai.x - Math.sign(enemy.x - ai.x) * 40; // 后退
    } else if (enemyDist > 340){
      targetX = enemy.x; // 前进
    } else {
      targetX = ai.x; // 站桩
    }
  }
  // 5) 追击远处敌人
  else if (enemy){
    targetX = enemy.x;
  }

  // ---- 移动 ----
  if (targetX !== null){
    const dx = targetX - ai.x;
    if (dx < -8) inp.left = 1;
    else if (dx > 8) inp.right = 1;
  }

  // ---- 跳跃（克制） ----
  if (aiNeedJump(ai, targetY)){
    // 只有一定概率才真正跳（模拟人类手滑/犹豫）
    if (Math.random() < 0.7 + cfg.jumpChance * 20){
      inp.jump = 1;
      ai._aiJumpCd = 35;
    }
  }

  // ---- 朝向 ----
  if (enemy && Math.abs(enemy.x - ai.x) > 15){
    ai.facing = enemy.x > ai.x ? 1 : -1;
  } else if (targetX !== null && Math.abs(targetX - ai.x) > 15){
    ai.facing = targetX > ai.x ? 1 : -1;
  }

  // ---- 射箭 ----
  if (ai._aiCharging){
    inp.bow = 1;
    if (enemy){
      const dx = enemy.x - ai.x;
      const dy = enemy.y - ai.y;
      const baseAngle = Math.atan2(dy, Math.abs(dx));
      const err = (1 - cfg.accuracy) * 0.4 * (Math.random() - 0.5);
      ai.aimAngle = Math.max(-1.0, Math.min(0.85, baseAngle * 0.9 + err));
    }
    if (ai.chargeTime >= 32 || ai.arrows <= 0 || !enemy){
      inp.bow = 0;
      ai._aiCharging = false;
      ai._aiBowCd = 55 + Math.random() * 55;
    }
  } else if (ai._aiBowCd <= 0 && ai.arrows > 0 && enemy &&
             enemyDist < cfg.reactRange && Math.abs(enemy.y - ai.y) < 120){
    ai._aiCharging = true;
    inp.bow = 1;
  }

  // ---- 冲刺（罕见） ----
  if (ai.dashCd <= 0 && enemyDist > 320 && Math.random() < 0.004){
    inp.dash = 1;
  }
}

/* ================================================================
   游戏结束判定
   ================================================================ */
function teamAliveCount(team){
  let n = 0;
  for (const p of players){
    if (p.team === team && !p.dead) n++;
  }
  return n;
}

function checkGameEnd(){
  if (gameState.ended) return;
  gameState.timeLeft--;

  // 判定阵营存活（所有玩家都倒下 → 淘汰）
  const alive = [];
  for (let t = 0; t < gameConfig.teams; t++){
    if (teamAliveCount(t) > 0) alive.push(t);
  }
  if (alive.length <= 1 || gameState.timeLeft <= 0){
    endGame();
  }
}

function endGame(){
  if (gameState.ended) return;
  gameState.ended = true;

  // 计算每队数据
  const stats = [];
  for (let t = 0; t < gameConfig.teams; t++){
    let alive = 0, kills = 0, totalHp = 0;
    for (const p of players){
      if (p.team !== t) continue;
      if (!p.dead){ alive++; totalHp += p.hp; }
      kills += p.kills;
    }
    stats.push({ team: t, alive, kills, totalHp });
  }
  // 排序：存活数 > 总击杀 > 血量
  const sorted = [...stats].sort((a,b) =>
    b.alive - a.alive || b.kills - a.kills || b.totalHp - a.totalHp);
  const winnerTeam = sorted[0].team;

  // MVP：击杀最多
  let mvp = players[0];
  for (const p of players){
    if (p.kills > mvp.kills) mvp = p;
  }

  showResult(winnerTeam, sorted, mvp);
}

function showResult(winnerTeam, sorted, mvp){
  const wt = TEAMS[winnerTeam];
  document.getElementById('winnerTitle').textContent = `🏆 ${wt.name} 获胜！`;
  document.getElementById('winnerTitle').style.color = wt.hex;

  let sub = gameState.timeLeft <= 0 ? '时间耗尽 · 按存活数结算' : '其他阵营已全部倒下';
  document.getElementById('winnerSub').textContent = sub;

  // 阵营统计
  const maxAlive = Math.max(1, ...sorted.map(s => s.alive));
  let html = '';
  for (const s of sorted){
    const t = TEAMS[s.team];
    const barW = (s.alive / maxAlive) * 100;
    const isW = s.team === winnerTeam;
    html += `<div class="stat-row ${isW ? 'winner-row' : ''}">
      <span class="dot" style="background:${t.hex}"></span>
      <span style="min-width:48px;font-weight:${isW?'700':'400'}">${t.name}</span>
      <span style="min-width:44px;color:#94a3b8;font-size:12px">${s.alive}/${gameConfig.perTeam} 存活</span>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:${barW}%;background:${t.hex}"></div></div>
      <span style="min-width:44px;text-align:right;color:#fbbf24;font-size:12px">${s.kills} 击杀</span>
    </div>`;
  }
  document.getElementById('statsList').innerHTML = html;

  // MVP
  const mt = TEAMS[mvp.team];
  const mvpName = mvp.index === myIndex ? '你' :
    (mvp.isAI ? 'AI·' + mt.name : mt.name + '·玩家');
  document.getElementById('mvpName').textContent = `MVP · ${mvpName}`;
  document.getElementById('mvpName').style.color = mt.hex;
  document.getElementById('mvpStats').textContent =
    `${mvp.kills} 击杀 · ${mvp.deaths} 阵亡 · ${mt.name}`;

  document.getElementById('resultModal').classList.add('active');
}

/* ================================================================
   渲染
   ================================================================ */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function drawCloud(c){
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = '#cbd5e1';
  ctx.beginPath();
  ctx.arc(c.x, c.y, 22*c.s, 0, Math.PI*2);
  ctx.arc(c.x+22*c.s, c.y+4*c.s, 16*c.s, 0, Math.PI*2);
  ctx.arc(c.x-22*c.s, c.y+4*c.s, 16*c.s, 0, Math.PI*2);
  ctx.arc(c.x+8*c.s, c.y-10*c.s, 14*c.s, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawPlayer(p){
  const team = TEAMS[p.team];

  if (p.dead){
    const cx = p.x+p.w/2, cy = p.y+p.h/2;
    const canRescue = p.rescuable;
    ctx.fillStyle = canRescue ? '#475569' : '#1c1917';
    ctx.fillRect(cx-9, cy-10, 18, 22);
    ctx.beginPath(); ctx.arc(cx, cy-10, 9, Math.PI, 0); ctx.fill();
    if (!canRescue){
      ctx.globalAlpha = 0.55; ctx.fillStyle = '#0a0a0a';
      ctx.beginPath(); ctx.arc(cx, cy-10, 8, Math.PI, 0); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = canRescue ? '#94a3b8' : '#7f1d1d';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(canRescue ? 'RIP' : '☠', cx, cy+2);
    ctx.textAlign = 'left';
    if (canRescue && p.rescueTimer > 0){
      const prog = p.rescueTimer / RESCUE_FRAMES;
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(cx-20, cy-30, 40, 7);
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(cx-19, cy-29, 38*prog, 5);
    }
    // 阵营色小旗
    ctx.fillStyle = team.hex;
    ctx.fillRect(cx-2, cy-22, 4, 8);
    return;
  }

  const flick = p.hurtFlash > 0 && p.hurtFlash % 4 < 2;

  if (p.onFire > 0){
    ctx.save();
    ctx.shadowBlur = 20; ctx.shadowColor = '#f97316';
    ctx.fillStyle = 'rgba(249,115,22,.3)';
    ctx.beginPath(); ctx.arc(p.x+p.w/2, p.y+p.h/2, 22, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#fb923c';
    for (let i = 0; i < 3; i++){
      const fy = p.y + (worldTime*2 + i*8) % 26;
      ctx.globalAlpha = 0.8 - i*0.2;
      ctx.fillRect(p.x + 4 + i*5, p.y + 24 - fy, 2, 4);
    }
    ctx.globalAlpha = 1;
  }
  if (p.dashTime > 0){
    ctx.globalAlpha = 0.35; ctx.fillStyle = '#60a5fa';
    ctx.fillRect(p.x - p.facing*8, p.y, p.w, p.h);
    ctx.globalAlpha = 1;
  }

  ctx.save();
  ctx.translate(p.x + p.w/2, p.y);
  if (p.facing < 0) ctx.scale(-1, 1);
  if (flick) ctx.globalAlpha = 0.5;
  ctx.drawImage(SPR.player[p.team], -p.w/2, 0, p.w, p.h);
  ctx.restore();
  ctx.globalAlpha = 1;

  // 名字标（己方高亮）
  const isMe = p.index === myIndex;
  if (isMe){
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('▼', p.x+p.w/2, p.y-20);
    ctx.textAlign = 'left';
  }
  // AI 标记
  if (p.isAI){
    ctx.fillStyle = team.hex;
    ctx.font = 'bold 8px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('AI', p.x+p.w/2, p.y-24);
    ctx.textAlign = 'left';
  }

  if (p.swordTime > 0){
    const sx = p.facing > 0 ? p.x + p.w : p.x - 20;
    const sy = p.y + 4;
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(sx, sy+6, 20, 4);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(sx + (p.facing > 0 ? 0 : 16), sy+3, 4, 10);
    ctx.strokeStyle = 'rgba(250,204,21,.7)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(p.x+p.w/2, p.y+p.h/2, 26,
            p.facing > 0 ? -1 : Math.PI-1,
            p.facing > 0 ? 0.6 : Math.PI+0.6);
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  if (p.charging){
    const t = p.chargeTime / 60;
    const worldAngle = p.facing > 0 ? p.aimAngle : Math.PI + p.aimAngle;
    const len = 50 + t * 180;
    ctx.strokeStyle = `rgba(56,189,248,${0.55 + t*0.45})`;
    ctx.setLineDash([6,4]);
    ctx.lineWidth = 1 + t*2;
    ctx.beginPath();
    ctx.moveTo(p.x+p.w/2, p.y+p.h/2);
    ctx.lineTo(p.x+p.w/2 + Math.cos(worldAngle)*len,
               p.y+p.h/2 + Math.sin(worldAngle)*len);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth = 1;
    const ex = p.x+p.w/2 + Math.cos(worldAngle)*len;
    const ey = p.y+p.h/2 + Math.sin(worldAngle)*len;
    ctx.strokeStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(ex-5, ey); ctx.lineTo(ex+5, ey);
    ctx.moveTo(ex, ey-5); ctx.lineTo(ex, ey+5);
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(p.x-4, p.y-22, p.w+8, 5);
    ctx.fillStyle = t < 0.5 ? '#38bdf8' : t < 0.85 ? '#a78bfa' : '#f472b6';
    ctx.fillRect(p.x-3, p.y-21, (p.w+6)*t, 3);
  }

  if (p.skill){
    const def = SKILLS[p.skill.type];
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(def.icon, p.x+p.w/2, p.y-8);
    ctx.textAlign = 'left';
    const prog = p.skill.timer / def.dur;
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(p.x-2, p.y-16, p.w+4, 4);
    ctx.fillStyle = def.color;
    ctx.fillRect(p.x-1, p.y-15, (p.w+2)*prog, 2);
  }

  ctx.fillStyle = 'rgba(15,23,42,.85)';
  ctx.fillRect(p.x-2, p.y+p.h+2, 22, 11);
  ctx.fillStyle = team.hex;
  ctx.font = 'bold 9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('🏹'+p.arrows, p.x+9, p.y+p.h+10);
  ctx.textAlign = 'left';
}

function render(){
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0, '#050a1f');
  sky.addColorStop(0.45, '#0f2a5c');
  sky.addColorStop(1, '#2c5faa');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  for (const s of stars){
    const alpha = 0.25 + 0.75 * Math.abs(Math.sin(worldTime*0.02 + s.tw));
    ctx.globalAlpha = alpha * 0.7;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.shadowBlur = 40; ctx.shadowColor = 'rgba(226,232,240,.6)';
  ctx.fillStyle = '#f1f5f9';
  ctx.beginPath(); ctx.arc(W-140, 70, 28, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#cbd5e1'; ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.arc(W-148, 64, 5, 0, Math.PI*2);
  ctx.arc(W-132, 78, 3.5, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;

  for (const c of clouds) drawCloud(c);

  for (let y = 0; y < MAP_H; y++){
    for (let x = 0; x < MAP_W; x++){
      const t = baseTiles[y][x];
      if (t === T.STONE) ctx.drawImage(SPR.stone, x*TILE, y*TILE, TILE, TILE);
      else if (t === T.PLATFORM) ctx.drawImage(SPR.platform, x*TILE, y*TILE, TILE, TILE);
    }
  }
  for (const [key, c] of crumbles){
    if (c.gone) continue;
    const [tx, ty] = key.split(',').map(Number);
    let shake = 0;
    if (c.timer > 0) shake = Math.sin(worldTime*0.9) * Math.min(2, c.timer/150);
    const img = c.timer > 0 ? SPR.crystalWarn : SPR.crystal;
    ctx.drawImage(img, tx*TILE+shake, ty*TILE, TILE, TILE);
  }
  for (const b of bridges){
    for (let i = 0; i < b.w; i++)
      ctx.drawImage(SPR.bridge, b.px+i*TILE, b.py, TILE, TILE);
  }
  for (const m of movers){
    const mw = m.w*TILE, mh = m.h*TILE;
    if (m.kind === 'hwall'){
      for (let j = 0; j < m.h; j++){
        const part = j === 0 ? 0 : j === m.h-1 ? 56 : 28;
        ctx.drawImage(SPR.wallH, 0, part, 28, 28, m.px, m.py+j*TILE, TILE, TILE);
      }
    } else {
      for (let i = 0; i < m.w; i++){
        const part = i === 0 ? 0 : i === m.w-1 ? 56 : 28;
        ctx.drawImage(SPR.wallV, part, 0, 28, 28, m.px+i*TILE, m.py, TILE, TILE);
      }
    }
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.25*Math.sin(worldTime*0.2);
    ctx.shadowBlur = 18; ctx.shadowColor = '#ef4444';
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
    ctx.strokeRect(m.px+1, m.py+1, mw-2, mh-2);
    ctx.restore();
  }
  for (const b of books){
    const y = b.y + Math.sin(b.bob)*3;
    ctx.save();
    ctx.shadowBlur = 18; ctx.shadowColor = '#a78bfa';
    ctx.drawImage(SPR.book, b.x-12, y-12, 24, 24);
    ctx.restore();
  }
  for (const a of arrows){
    if (!a.stuck && a.trail.length > 1){
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = a.onFire ? '#fb923c' : '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(a.trail[0].x, a.trail[0].y);
      for (let i = 1; i < a.trail.length; i++)
        ctx.lineTo(a.trail[i].x, a.trail[i].y);
      ctx.lineTo(a.x, a.y);
      ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.translate(a.x, a.y); ctx.rotate(a.angle);
    if (a.onFire){ ctx.shadowBlur = 14; ctx.shadowColor = '#f97316'; }
    const img = a.onFire ? SPR.arrowFire : SPR.arrow;
    ctx.drawImage(img, -8, -3, 16, 6);
    ctx.restore();
    if (a.stuck){
      ctx.save();
      ctx.globalAlpha = 0.4 + 0.3*Math.sin(worldTime*0.15);
      ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(a.x, a.y, 12, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }

  // 玩家（己方最后画，始终可见）
  const sorted = [...players].sort((a,b) => {
    if (a.index === myIndex) return 1;
    if (b.index === myIndex) return -1;
    return a.y - b.y;
  });
  for (const p of sorted) drawPlayer(p);

  for (const pt of particles){
    const alpha = pt.life / pt.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x-pt.size/2, pt.y-pt.size/2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
}

/* ================================================================
   HUD
   ================================================================ */
function updateHUD(){
  const hud = document.getElementById('hud');
  // 每队汇总
  const teamData = [];
  for (let t = 0; t < gameConfig.teams; t++){
    let alive = 0, total = 0, kills = 0;
    for (const p of players){
      if (p.team !== t) continue;
      total++;
      if (!p.dead) alive++;
      kills += p.kills;
    }
    teamData.push({ t, alive, total, kills });
  }
  let html = '';
  for (const td of teamData){
    const team = TEAMS[td.t];
    const isMine = td.t === myTeam;
    html += `<div class="hud-item" style="${isMine?'background:rgba(59,130,246,.18);border:1px solid '+team.hex+'55':''}">
      <span class="dot" style="background:${team.hex}"></span>
      <span style="font-weight:${isMine?'700':'500'}">${team.name}</span>
      <span style="font-size:11px;color:#cbd5e1">${td.alive}/${td.total}</span>
      <span style="font-size:11px;color:#fbbf24">⚔${td.kills}</span>
    </div>`;
  }
  // 自己 HP + 击杀
  const me = players[myIndex];
  if (me){
    let meStatus;
    if (me.dead) meStatus = me.rescuable ? '💀待救援' : '☠️淘汰';
    else if (me.onFire > 0) meStatus = '🔥' + Math.ceil(me.onFire/60) + 's';
    else meStatus = '❤'.repeat(me.hp) + '♡'.repeat(Math.max(0, me.maxHp-me.hp));
    html += `<div class="hud-item" style="background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.3)">
      <span style="font-weight:700">你</span>
      <span>${meStatus}</span>
      <span style="font-size:11px;color:#fbbf24">⚔${me.kills}</span>
    </div>`;
  }
  const tSec = Math.max(0, Math.floor(gameState.timeLeft / 60));
  const mm = String(Math.floor(tSec / 60)).padStart(2, '0');
  const ss = String(tSec % 60).padStart(2, '0');
  html += `<div class="timer ${tSec <= 30 ? 'warn' : ''}">${mm}:${ss}</div>`;
  hud.innerHTML = html;
}

/* ================================================================
   输入
   ================================================================ */
const keys = {};
const mobileInputs = { left:0,right:0,up:0,down:0,jump:0,dash:0,sword:0,bow:0 };

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))
    e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function readInputs(){
  return {
    left:  (keys['KeyA'] || keys['ArrowLeft'] || mobileInputs.left) ? 1 : 0,
    right: (keys['KeyD'] || keys['ArrowRight'] || mobileInputs.right) ? 1 : 0,
    up:    (keys['KeyW'] || keys['ArrowUp'] || mobileInputs.up) ? 1 : 0,
    down:  (keys['KeyS'] || keys['ArrowDown'] || mobileInputs.down) ? 1 : 0,
    jump:  (keys['Space'] || mobileInputs.jump) ? 1 : 0,
    dash:  (keys['ShiftLeft'] || keys['ShiftRight'] || mobileInputs.dash) ? 1 : 0,
    sword: (keys['KeyJ'] || mobileInputs.sword) ? 1 : 0,
    bow:   (keys['KeyK'] || mobileInputs.bow) ? 1 : 0,
  };
}

document.querySelectorAll('[data-key]').forEach(btn => {
  const key = btn.dataset.key;
  const on = e => { e.preventDefault(); mobileInputs[key] = 1; btn.classList.add('pressed'); };
  const off = e => { e.preventDefault(); mobileInputs[key] = 0; btn.classList.remove('pressed'); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointercancel', off);
  btn.addEventListener('pointerleave', off);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});
const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (hasTouch) document.getElementById('mobileUI').classList.add('active');

/* ================================================================
   设置界面交互
   ================================================================ */
function bindGroup(id, setter){
  document.getElementById(id).addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll(`#${id} button`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setter(btn.dataset.val);
    updateTeamPreview();
  });
}
bindGroup('grpTeams', v => gameConfig.teams = parseInt(v));
bindGroup('grpPer', v => gameConfig.perTeam = parseInt(v));
bindGroup('grpAI', v => gameConfig.aiDiff = v);

function updateTeamPreview(){
  const el = document.getElementById('teamPreview');
  let html = '';
  for (let t = 0; t < gameConfig.teams; t++){
    html += `<div class="team-chip" style="border-color:${TEAMS[t].hex}55">
      <span class="dot" style="background:${TEAMS[t].hex}"></span>
      <span>${TEAMS[t].name}</span>
      <span style="color:#64748b">×${gameConfig.perTeam}</span>
    </div>`;
  }
  el.innerHTML = html;
}
updateTeamPreview();

/* ================================================================
   网络
   ================================================================ */
let peer = null, conn = null, isHost = false, roomCode = null;
let remoteInputs = { left:0,right:0,up:0,down:0,jump:0,dash:0,sword:0,bow:0 };
let remoteConnected = false;

function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function openCreateRoom(){
  roomCode = genCode();
  peer = new Peer('arrowsky-' + roomCode);
  peer.on('open', () => {
    isHost = true;
    showScreen('waiting');
    document.getElementById('roomCodeDisplay').textContent = roomCode;
    document.getElementById('waitStatus').textContent = '等待队友加入（或直接开始 AI 对战）…';
  });
  peer.on('connection', c => {
    if (conn && conn.open){ c.close(); return; }
    conn = c;
    conn.on('open', () => {
      remoteConnected = true;
      conn.send({ type:'welcome', config: gameConfig });
      document.getElementById('waitStatus').innerHTML = '✅ 队友已加入！<br>点击开始游戏';
    });
    conn.on('data', d => {
      if (d.type === 'input') remoteInputs = d.inputs;
    });
    conn.on('close', () => {
      remoteConnected = false;
      toast('队友已断开连接');
    });
  });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') openCreateRoom();
    else { toast('网络错误：' + err.message); leaveRoom(); }
  });
}

function joinRoom(code){
  code = (code || '').toUpperCase().trim();
  if (code.length !== 6) return toast('请输入 6 位房间码');
  peer = new Peer();
  peer.on('open', () => {
    isHost = false;
    conn = peer.connect('arrowsky-' + code);
    conn.on('open', () => { remoteConnected = true; });
    conn.on('data', d => {
      if (d.type === 'welcome'){
        gameConfig = d.config;
        startGame();
      } else if (d.type === 'snap'){
        applySnapshot(d.snap);
      }
    });
    conn.on('close', () => { toast('与房主的连接已断开'); leaveRoom(); });
  });
  peer.on('error', err => {
    if (err.type === 'peer-unavailable') toast('房间不存在或已关闭');
    else toast('连接失败：' + err.message);
    cleanup();
  });
}

function startGame(){
  resetWorld();
  showScreen('game');
  lastTime = performance.now();
  document.getElementById('resultModal').classList.remove('active');
}

function copyRoomCode(){
  if (!roomCode) return;
  if (navigator.clipboard){
    navigator.clipboard.writeText(roomCode).then(() => toast('已复制：' + roomCode));
  } else {
    const ta = document.createElement('textarea');
    ta.value = roomCode;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('已复制：' + roomCode);
  }
}

function cleanup(){
  if (conn){ try { conn.close(); } catch(e){} conn = null; }
  if (peer){ try { peer.destroy(); } catch(e){} peer = null; }
  isHost = false; remoteConnected = false; roomCode = null;
}

function leaveRoom(){
  cleanup();
  players = []; arrows = []; books = []; particles = [];
  document.getElementById('resultModal').classList.remove('active');
  showScreen('setup');
  document.getElementById('joinCode').value = '';
}

function rematch(){
  document.getElementById('resultModal').classList.remove('active');
  if (isHost){
    resetWorld();
    lastTime = performance.now();
    if (conn && conn.open){
      conn.send({ type:'rematch' });
    }
  }
}

function backToSetup(){
  document.getElementById('resultModal').classList.remove('active');
  leaveRoom();
}

/* ================================================================
   快照
   ================================================================ */
function makeSnapshot(){
  return {
    t: worldTime,
    timeLeft: gameState.timeLeft,
    ended: gameState.ended,
    players: players.map(p => ({
      x:p.x, y:p.y, vx:p.vx, vy:p.vy, facing:p.facing,
      dead:p.dead, deadTimer:p.deadTimer, rescueTimer:p.rescueTimer,
      rescuable:p.rescuable, deathReason:p.deathReason,
      onFire:p.onFire, arrows:p.arrows, hp:p.hp,
      kills:p.kills, deaths:p.deaths,
      skill:p.skill ? { type:p.skill.type, timer:p.skill.timer } : null,
      hurtFlash:p.hurtFlash, dashTime:p.dashTime,
      swordTime:p.swordTime, charging:p.charging, chargeTime:p.chargeTime,
      aimAngle:p.aimAngle
    })),
    arrows: arrows.map(a => ({
      x:a.x, y:a.y, vx:a.vx, vy:a.vy, angle:a.angle, speed:a.speed, curve:a.curve,
      onFire:a.onFire, stuck:a.stuck, owner:a.owner, life:a.life,
      trail:a.trail.slice(-5)
    })),
    crumbles: [...crumbles].map(([k,v]) => [k, v.gone, v.timer, v.respawn]),
    bridges: bridges.map(b => [b.px, b.py]),
    movers: movers.map(m => [m.px, m.py]),
    books: books.map(b => ({ x:b.x, y:b.y, type:b.type, life:b.life, bob:b.bob })),
    particles: particles.slice(0, 40).map(p => ({
      x:p.x, y:p.y, vx:p.vx, vy:p.vy, life:p.life, maxLife:p.maxLife,
      color:p.color, size:p.size
    })),
  };
}

function applySnapshot(s){
  worldTime = s.t;
  gameState.timeLeft = s.timeLeft;
  for (let i = 0; i < s.players.length && i < players.length; i++){
    const src = s.players[i], dst = players[i];
    if (i === myIndex){
      dst.x += (src.x - dst.x) * 0.5;
      dst.y += (src.y - dst.y) * 0.5;
    } else {
      dst.x = src.x; dst.y = src.y;
    }
    dst.vx = src.vx; dst.vy = src.vy; dst.facing = src.facing;
    dst.dead = src.dead; dst.deadTimer = src.deadTimer; dst.rescueTimer = src.rescueTimer;
    dst.rescuable = src.rescuable; dst.deathReason = src.deathReason;
    dst.onFire = src.onFire; dst.arrows = src.arrows; dst.hp = src.hp;
    dst.kills = src.kills; dst.deaths = src.deaths;
    dst.skill = src.skill ? { type:src.skill.type, timer:src.skill.timer } : null;
    dst.hurtFlash = src.hurtFlash; dst.dashTime = src.dashTime;
    dst.swordTime = src.swordTime;
    dst.charging = src.charging; dst.chargeTime = src.chargeTime;
    dst.aimAngle = src.aimAngle || 0;
  }
  arrows = s.arrows.map(a => ({ ...a, trail: a.trail || [] }));
  for (const [k, gone, timer, respawn] of s.crumbles){
    const c = crumbles.get(k);
    if (c){ c.gone = gone; c.timer = timer; c.respawn = respawn; }
  }
  for (let i = 0; i < s.bridges.length; i++){ bridges[i].px = s.bridges[i][0]; bridges[i].py = s.bridges[i][1]; }
  for (let i = 0; i < s.movers.length; i++){ movers[i].px = s.movers[i][0]; movers[i].py = s.movers[i][1]; }
  books = s.books.map(b => ({ ...b }));
  particles = s.particles.map(p => ({ ...p }));
  if (s.ended && !gameState.ended){ gameState.ended = true; endGame(); }
}

/* ================================================================
   主循环
   ================================================================ */
let lastTime = 0, acc = 0;
const STEP = 1000/60;

function loop(now){
  requestAnimationFrame(loop);
  if (!document.getElementById('screen-game').classList.contains('active')) return;
  if (!players.length) return;

  const dt = Math.min(now - lastTime, 100);
  lastTime = now;
  acc += dt;

  let iter = 0;
  while (acc >= STEP && iter < 4){
    acc -= STEP;
    iter++;

    if (!gameState.ended){
      if (isHost){
        // 每个玩家：AI 或输入
        for (const p of players){
          if (p.index === myIndex) p.inputs = readInputs();
          else if (p.isAI) updateAI(p);
          else if (p.team === 1 && remoteConnected) p.inputs = remoteInputs;
          else p.inputs = { left:0,right:0,up:0,down:0,jump:0,dash:0,sword:0,bow:0 };
        }
        updateTerrain();
        for (const p of players) updatePlayer(p);
        updateArrows();
        checkGameEnd();
        if (conn && conn.open && remoteConnected){
          conn.send({ type:'snap', snap: makeSnapshot() });
        }
      } else {
        if (conn && conn.open){
          conn.send({ type:'input', inputs: readInputs() });
        }
        // 客户端仅做视觉缓动
        const me = players[myIndex];
        if (me && !me.dead){
          if (me.skill && me.skill.timer > 0) me.skill.timer--;
          if (me.onFire > 0) me.onFire--;
        }
        for (let i = particles.length-1; i >= 0; i--){
          const pt = particles[i];
          pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.15; pt.life--;
          if (pt.life <= 0) particles.splice(i,1);
        }
        for (const b of books) b.bob += 0.08;
        for (const c of clouds){ c.x += c.sp; if (c.x > W+100) c.x = -100; }
        worldTime++;
      }
    }
  }

  render();
  updateHUD();
}

/* ================================================================
   UI
   ================================================================ */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

document.getElementById('joinCode').addEventListener('keydown', e => {
  if (e.key === 'Enter') joinRoom(e.target.value);
});
document.getElementById('joinCode').addEventListener('input', e => {
  e.target.value = e.target.value.toUpperCase();
});

loadSprites();
parseMap();
requestAnimationFrame(loop);
