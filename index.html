    if (!connected){
      hideConnStatus();
      showNotification('连接超时，请检查网络或稍后重试', '#dc2626');
      cleanupConnection();
    }
  }, 12000);

  try { peer = new Peer('arrowarena-' + code); }
  catch(e){
    clearTimeout(connectTimeout);
    hideConnStatus();
    showNotification('创建失败：' + e.message, '#dc2626');
    return;
  }

  peer.on('open', () => {
    connected = true;
    clearTimeout(connectTimeout);
    hideConnStatus();
    document.getElementById('roomCodeDisplay').textContent = code;
    showScreen('room');
    renderRoomUI();
    showNotification('房间已创建', '#22c55e');
  });
  peer.on('connection', c => {
    let slot = -1;
    for (let i = 1; i < 12; i++){
      if (!roomState.players.some(p => p.slot === i)){ slot = i; break; }
    }
    if (slot < 0){ c.close(); return; }
    const info = { slot, nickname:'ROB??????', team:0, charId:'knight', ready:false,
      isHost:false, connected:true, type:'human' };
    roomState.players.push(info);
    clientConns.push({ conn: c, slot });

    c.on('data', d => {
      if (d.type === 'hello'){
        info.nickname = d.nickname;
        info.team = d.team;
        info.charId = d.charId;
        c.send({ type:'welcome', slot, roomState });
        broadcastRoomState();
        showNotification(`${d.nickname} 加入了房间`, '#22c55e');
        renderRoomUI();
      }
      else if (d.type === 'updateConfig'){
        info.team = d.team;
        info.charId = d.charId;
        broadcastRoomState();
        renderRoomUI();
      }
      else if (d.type === 'ready'){
        info.ready = d.ready;
        broadcastRoomState();
        renderRoomUI();
      }
      else if (d.type === 'input'){
        remoteInputs = d.inputs;
      }
    });
    c.on('close', () => {
      showNotification(`${info.nickname} 离开了房间`, '#dc2626');
      roomState.players = roomState.players.filter(p => p.slot !== slot);
      clientConns = clientConns.filter(x => x.conn !== c);
      broadcastRoomState();
      renderRoomUI();
    });
    c.on('error', () => {});
  });
  peer.on('error', err => {
    clearTimeout(connectTimeout);
    hideConnStatus();
    if (err.type === 'unavailable-id') openCreateRoom();
    else {
      showNotification('创建房间失败：' + (err.message || err.type), '#dc2626');
      cleanupConnection();
    }
  });
}

/* ============ 加入房间 ============ */
function joinRoomByCode(){
  const code = (document.getElementById('joinCode').value || '').toUpperCase().trim();
  if (code.length !== 6) return toast('请输入 6 位房间码');
  isHostRoom = false;
  isHost = false;

  showConnStatus('正在连接房间 ' + code + '…');
  let connected = false;
  let joinTimeout = setTimeout(() => {
    if (!connected){
      hideConnStatus();
      showNotification('连接超时，房间可能不存在', '#dc2626');
      cleanupConnection();
    }
  }, 12000);

  try { peer = new Peer(); }
  catch(e){
    clearTimeout(joinTimeout);
    hideConnStatus();
    showNotification('连接失败：' + e.message, '#dc2626');
    return;
  }

  peer.on('open', () => {
    conn = peer.connect('arrowarena-' + code);
    conn.on('open', () => {
      connected = true;
      conn.send({
        type:'hello',
        nickname: myNickname,
        team: myConfig.team,
        charId: myConfig.charId
      });
    });
    conn.on('data', d => {
      if (d.type === 'welcome'){
        clearTimeout(joinTimeout);
        hideConnStatus();
        mySlot = d.slot;
        roomState = d.roomState;
        document.getElementById('roomCodeDisplay').textContent = roomState.roomCode;
        showScreen('room');
        renderRoomUI();
        showNotification(`已加入房间 ${roomState.roomCode}`, '#22c55e');
      }
      else if (d.type === 'roomUpdate'){
        roomState = d.roomState;
        const me = roomState.players.find(p => p.slot === mySlot);
        if (me){
          myConfig.team = me.team;
          myConfig.charId = me.charId;
          amReady = me.ready;
        }
        renderRoomUI();
      }
      else if (d.type === 'start'){
        roomState.config = d.config;
        roomState.players = d.players;
        startGame();
      }
      else if (d.type === 'snap'){
        netStats.snapshotsRecv++;
        netStats.lastSnapTime = performance.now();
        applySnapshot(d.snap);
      }
      else if (d.type === 'kicked'){
        leaveRoom();
      }
    });
    conn.on('close', () => {
      clearTimeout(joinTimeout);
      hideConnStatus();
      showNotification('与房主的连接断开', '#dc2626');
      leaveRoom();
    });
    conn.on('error', () => {});
  });
  peer.on('error', err => {
    clearTimeout(joinTimeout);
    hideConnStatus();
    if (err.type === 'peer-unavailable') showNotification('房间不存在', '#dc2626');
    else showNotification('连接失败：' + (err.message || err.type), '#dc2626');
    cleanupConnection();
  });
}

function broadcastRoomState(){
  const payload = { type:'roomUpdate', roomState };
  for (const x of clientConns){
    try { x.conn.send(payload); } catch(e){}
  }
}
function sendToHost(msg){
  if (conn && conn.open) conn.send(msg);
}
function cleanupConnection(){
  if (conn){ try { conn.close(); } catch(e){} conn = null; }
  for (const x of clientConns){ try { x.conn.close(); } catch(e){} }
  clientConns = [];
  if (peer){ try { peer.destroy(); } catch(e){} peer = null; }
  isHostRoom = false;
  isHost = false;
}
function leaveRoom(){
  cleanupConnection();
  players = []; arrows = []; books = []; particles = [];
  document.getElementById('resultModal').classList.remove('active');
  amReady = false;
  showScreen('menu');
  document.getElementById('joinCode').value = '';
}

/* ============ 房间 UI ============ */
function renderRoomUI(){
  const list = document.getElementById('playerListEl');
  const maxSlots = Math.max(4, roomState.players.length);
  let html = '';
  const sp = [...roomState.players].sort((a,b) => a.slot - b.slot);
  for (let s = 0; s < maxSlots; s++){
    const p = sp.find(x => x.slot === s);
    if (p){
      const t = TEAMS[p.team] || TEAMS[0];
      const c = CHARACTERS.find(x => x.id === p.charId) || CHARACTERS[0];
      const isMe = p.slot === mySlot;
      html += `<div class="player-slot ${isMe ? 'me' : ''}">
        ${p.isHost ? '<span class="host-tag">房主</span>' : ''}
        <span class="nick">${p.nickname}</span>
        <span class="tag" style="background:${t.hex}">${t.name}</span>
        <span style="font-size:10px;color:#3b82f6;font-weight:800">${c.name}</span>
        <span class="ready-tag ${p.ready ? 'yes' : 'no'}">${p.ready ? '✓' : '…'}</span>
      </div>`;
    } else {
      html += `<div class="player-slot empty"><span class="nick">（空位）</span></div>`;
    }
  }
  list.innerHTML = html;

  const tp = document.getElementById('teamPicker');
  let tHtml = '';
  for (let t = 0; t < roomState.config.teams; t++){
    const team = TEAMS[t];
    const cnt = roomState.players.filter(p => p.team === t).length;
    const full = cnt >= roomState.config.perTeam && myConfig.team !== t;
    tHtml += `<button type="button" data-team="${t}" class="${myConfig.team === t ? 'active' : ''}"
      style="${myConfig.team === t ? 'background:'+team.hex : ''}"
      ${full ? 'disabled' : ''}>${team.name}${cnt > 0 ? '·' + cnt : ''}</button>`;
  }
  tp.innerHTML = tHtml;
  tp.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = parseInt(btn.dataset.team);
      myConfig.team = t;
      sendConfigUpdate();
      if (isHostRoom){
        const me = roomState.players.find(p => p.slot === mySlot);
        if (me) me.team = t;
        broadcastRoomState();
      }
      renderRoomUI();
    });
  });

  const cp = document.getElementById('charPicker');
  let cHtml = '';
  for (const c of CHARACTERS){
    const sel = myConfig.charId === c.id ? 'active' : '';
    cHtml += `<button type="button" data-char="${c.id}" class="${sel}">
      ${charSVG(c.id, TEAMS[myConfig.team].hex, 60)}
    </button>`;
  }
  cp.innerHTML = cHtml;
  cp.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      myConfig.charId = btn.dataset.char;
      sendConfigUpdate();
      if (isHostRoom){
        const me = roomState.players.find(p => p.slot === mySlot);
        if (me) me.charId = myConfig.charId;
        broadcastRoomState();
      }
      renderRoomUI();
    });
  });

  if (isHostRoom){
    document.getElementById('hostPanel').classList.remove('hidden');
    document.getElementById('roomHint').textContent = '你是房主，配置后开始游戏';
  } else {
    document.getElementById('hostPanel').classList.add('hidden');
    document.getElementById('roomHint').textContent = '等待房主开始游戏…';
  }

  if (isHostRoom){
    const startBtn = document.getElementById('startBtn');
    const humans = roomState.players.filter(p => p.connected && !p.isHost);
    const allReady = humans.every(p => p.ready);
    startBtn.textContent = allReady ? '▶ 开始游戏' : `▶ 开始游戏（${humans.filter(p => !p.ready).length} 人未准备）`;
  }

  updateReadyBtn();
}
function sendConfigUpdate(){
  if (!isHostRoom) sendToHost({ type:'updateConfig', team: myConfig.team, charId: myConfig.charId });
}
function updateReadyBtn(){
  const btn = document.getElementById('readyBtn');
  if (amReady){ btn.className = 'unready'; btn.textContent = '✗ 取消准备'; }
  else { btn.className = 'ready'; btn.textContent = '✓ 准备'; }
}
function toggleReady(){
  amReady = !amReady;
  if (isHostRoom){
    const me = roomState.players.find(p => p.slot === mySlot);
    if (me) me.ready = amReady;
    broadcastRoomState();
    renderRoomUI();
  } else {
    sendToHost({ type:'ready', ready: amReady });
    updateReadyBtn();
  }
}
document.getElementById('cfgTeams').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#cfgTeams button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  roomState.config.teams = parseInt(btn.dataset.val);
  for (const p of roomState.players) if (p.team >= roomState.config.teams) p.team = 0;
  if (myConfig.team >= roomState.config.teams) myConfig.team = 0;
  broadcastRoomState();
  renderRoomUI();
});
document.getElementById('cfgPer').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#cfgPer button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  roomState.config.perTeam = parseInt(btn.dataset.val);
  broadcastRoomState();
  renderRoomUI();
});
document.getElementById('cfgAI').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#cfgAI button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  roomState.config.aiDiff = btn.dataset.val;
  broadcastRoomState();
  renderRoomUI();
});
function hostStartGame(){
  if (!isHostRoom) return;
  const humans = roomState.players.filter(p => p.connected && !p.isHost);
  if (!humans.every(p => p.ready)) return toast('还有玩家未准备');
  const cfg = roomState.config;
  const byTeam = {};
  for (let t = 0; t < cfg.teams; t++) byTeam[t] = [];
  for (const rp of roomState.players){
    if (!rp.connected) continue;
    if (rp.team >= cfg.teams) continue;
    if (byTeam[rp.team].length < cfg.perTeam) byTeam[rp.team].push(rp);
  }
  const finalPlayers = [];
  for (let t = 0; t < cfg.teams; t++){
    for (const h of byTeam[t]){
      finalPlayers.push({ type:'human', slot: h.slot, nickname: h.nickname, team: t, charId: h.charId });
    }
    while (finalPlayers.filter(x => x.team === t).length < cfg.perTeam){
      const charId = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)].id;
      finalPlayers.push({ type:'ai', team: t, charId });
    }
  }
  const payload = { type:'start', config: cfg, players: finalPlayers };
  for (const x of clientConns){
    try { x.conn.send(payload); } catch(e){}
  }
  roomState.config = cfg;
  roomState.players = finalPlayers;
  startGame();
}
function startGame(){
  if (!roomState.config) return;
  resetWorld();
  document.getElementById('resultModal').classList.remove('active');
  showScreen('game');
  lastTime = performance.now();
  netStats.lastSnapTime = performance.now();
  netStats.snapshotsRecv = 0;
}
function copyRoomCode(){
  if (!roomState.roomCode) return toast('没有房间码');
  const code = roomState.roomCode;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(() => toast('已复制：' + code)).catch(() => fallbackCopy(code));
  } else {
    fallbackCopy(code);
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('已复制：' + text); }
  catch(e){ toast('复制失败：' + text); }
  document.body.removeChild(ta);
}

/* ============ 游戏内快照 ============ */
function makeSnapshot(){
  return {
    t: worldTime, timeLeft: gameState.timeLeft, ended: gameState.ended,
    protectionLeft: gameState.protectionLeft, gateOpen,
    players: players.map(p => ({
      x:p.x, y:p.y, vx:p.vx, vy:p.vy, facing:p.facing, aimAngle:p.aimAngle,
      dead:p.dead, deadTimer:p.deadTimer, rescueTimer:p.rescueTimer,
      rescuable:p.rescuable, deathReason:p.deathReason,
      onFire:p.onFire, frozen:p.frozen, arrows:p.arrows, hp:p.hp,
      kills:p.kills, deaths:p.deaths, charId:p.charId, team:p.team,
      skill:p.skill ? { type:p.skill.type, timer:p.skill.timer } : null,
      hurtFlash:p.hurtFlash, dashTime:p.dashTime, swordTime:p.swordTime,
      charging:p.charging, chargeTime:p.chargeTime, fallTimer:p.fallTimer
    })),
    arrows: arrows.map(a => ({
      x:a.x, y:a.y, vx:a.vx, vy:a.vy, angle:a.angle, speed:a.speed, curve:a.curve,
      onFire:a.onFire, onIce:a.onIce, stuck:a.stuck, owner:a.owner, life:a.life,
      trail:a.trail.slice(-5)
    })),
    books: books.map(b => ({ x:b.x, y:b.y, type:b.type, life:b.life, bob:b.bob })),
    particles: particles.slice(0, 30).map(p => ({
      x:p.x, y:p.y, vx:p.vx, vy:p.vy, life:p.life, maxLife:p.maxLife, color:p.color, size:p.size
    }))
  };
}

/* ★ 客户端快照应用：非位置数据立即生效，位置数据用于插值 */
function applySnapshot(s){
  // 缓冲快照（用于调优，可选择性使用）
  snapshotBuffer.push({ time: performance.now(), snap: s });
  if (snapshotBuffer.length > 10) snapshotBuffer.shift();

  worldTime = s.t;
  gameState.timeLeft = s.timeLeft;
  gameState.protectionLeft = s.protectionLeft;
  gateOpen = s.gateOpen;
  if (s.protectionLeft > 0){
    document.getElementById('protectOverlay').classList.remove('hidden');
    document.getElementById('protectTime').textContent = Math.ceil(s.protectionLeft / 60);
  } else document.getElementById('protectOverlay').classList.add('hidden');

  // 玩家
  for (let i = 0; i < s.players.length && i < players.length; i++){
    const src = s.players[i], dst = players[i];
    dst.vx = src.vx; dst.vy = src.vy;
    dst.facing = src.facing;
    dst.aimAngle = src.aimAngle || 0;
    dst.dead = src.dead; dst.deadTimer = src.deadTimer; dst.rescueTimer = src.rescueTimer || 0;
    dst.rescuable = src.rescuable; dst.deathReason = src.deathReason;
    dst.onFire = src.onFire; dst.frozen = src.frozen;
    dst.arrows = src.arrows; dst.hp = src.hp;
    dst.kills = src.kills; dst.deaths = src.deaths;
    dst.charId = src.charId || dst.charId;
    dst.skill = src.skill ? { type:src.skill.type, timer:src.skill.timer } : null;
    dst.hurtFlash = src.hurtFlash; dst.dashTime = src.dashTime;
    dst.swordTime = src.swordTime;
    dst.charging = src.charging; dst.chargeTime = src.chargeTime;
    dst.fallTimer = src.fallTimer || 0;

    // 远程玩家位置：存为目标，本地插值
    if (i !== myIndex){
      dst._targetX = src.x;
      dst._targetY = src.y;
      dst._hasTarget = true;
    } else {
      // 自己：偏差过大时强制拉回（防作弊/漂移修正）
      const dx = src.x - dst.x, dy = src.y - dst.y;
      if (Math.hypot(dx, dy) > 100){ dst.x = src.x; dst.y = src.y; }
      else {
        // 轻微校正
        dst.x += dx * 0.12;
        dst.y += dy * 0.12;
      }
    }
  }

  // 箭矢：把新快照转为"目标位置"，渲染时插值（尽力按近似位置匹配到已有箭以保留插值曲线）
  const newArrows = s.arrows.map(a => ({ ...a, trail: a.trail || [] }));
  for (const na of newArrows){
    let best = null, bestDist = 80;
    for (const oa of arrows){
      const d = Math.hypot(oa.x - na.x, oa.y - na.y);
      if (d < bestDist){ best = oa; bestDist = d; }
    }
    if (best){
      na._curX = best._curX !== undefined ? best._curX : best.x;
      na._curY = best._curY !== undefined ? best._curY : best.y;
    } else {
      na._curX = na.x;
      na._curY = na.y;
    }
  }
  arrows = newArrows;

  books = s.books.map(b => ({ ...b }));
  particles = s.particles.map(p => ({ ...p }));
  if (s.ended && !gameState.ended){ gameState.ended = true; endGame(); }
}

/* ============ 主循环 ============ */
let lastTime = 0, acc = 0;
const STEP = 1000/60;
let lastNetStatusUpdate = 0;

function loop(now){
  requestAnimationFrame(loop);
  if (!document.getElementById('screen-game').classList.contains('active')) return;
  if (!players.length) return;
  const dt = Math.min(now - lastTime, 100);
  lastTime = now;
  acc += dt;
  let iter = 0;
  while (acc >= STEP && iter < 4){
    acc -= STEP; iter++;
    if (!gameState.ended){
      if (isHostRoom){
        for (const p of players){
          if (p.index === myIndex){
            const inp = readInputs();
            p.ax = inp.ax; p.ay = inp.ay; p.inputs = inp;
          } else if (p.isAI){
            // ★ AI 降频：每 2 帧更新一次
            if (worldTime % 2 === 0) updateAI(p);
          } else {
            p.ax = remoteInputs.ax || 0; p.ay = remoteInputs.ay || 0;
            p.inputs = remoteInputs;
          }
        }
        updateTerrain();
        for (const p of players) updatePlayer(p);
        updateArrows();
        checkGameEnd();
        // ★ 快照 20Hz 广播（每 3 帧一次）
        if (clientConns.length && worldTime % 3 === 0){
          const snap = makeSnapshot();
          for (const x of clientConns){
            try { x.conn.send({ type:'snap', snap }); } catch(e){}
          }
        }
      } else {
        // 客户端
        if (conn && conn.open){
          try { conn.send({ type:'input', inputs: readInputs() }); } catch(e){}
        }

        // ★ 远程玩家插值（平滑过渡）
        const lerpFactor = 0.28;
        for (let i = 0; i < players.length; i++){
          if (i === myIndex) continue;
          const p = players[i];
          if (p._hasTarget){
            p.x += (p._targetX - p.x) * lerpFactor;
            p.y += (p._targetY - p.y) * lerpFactor;
          }
        }

        // ★ 箭矢插值（渲染时用 _curX/_curY）
        for (const a of arrows){
          if (a._hasTarget === false) continue;
          if (a._curX === undefined){ a._curX = a.x; a._curY = a.y; }
          a._curX += (a.x - a._curX) * lerpFactor;
          a._curY += (a.y - a._curY) * lerpFactor;
        }

        // 本地粒子更新
        for (let i = particles.length-1; i >= 0; i--){
          const pt = particles[i];
          pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.05; pt.life--;
          if (pt.life <= 0) particles.splice(i,1);
        }
        for (const b of books) b.bob += 0.08;
        worldTime++;
      }
    }
  }
  // 网络状态每 500ms 更新一次
  if (now - lastNetStatusUpdate > 500){
    lastNetStatusUpdate = now;
    updateNetStatus();
  }
  updateCamera();
  render();
  updateHUD();
}

/* ============ 屏幕切换 ============ */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}
